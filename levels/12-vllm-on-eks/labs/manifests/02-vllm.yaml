# vLLM serving Llama 3.1 8B on one L4 (g6) or L40S (g6e).
#   kubectl -n inference create secret generic hf-token --from-literal=token=$HF_TOKEN
apiVersion: apps/v1
kind: Deployment
metadata: { name: vllm, namespace: inference, labels: { app: vllm } }
spec:
  replicas: 1
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: vllm } }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      terminationGracePeriodSeconds: 120
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      nodeSelector:
        eks.amazonaws.com/instance-family: g6     # 24 GB is enough for 8B BF16 at 8k context
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model=meta-llama/Llama-3.1-8B-Instruct
            - --served-model-name=llama-3.1-8b
            - --max-model-len=8192
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=64
            - --enable-prefix-caching
            - --port=8000
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token } }
            - { name: HF_HOME, value: /models }
          ports: [{ containerPort: 8000, name: http }]
          resources:
            requests: { nvidia.com/gpu: "1", cpu: "6", memory: 24Gi }
            limits: { nvidia.com/gpu: "1", memory: 28Gi }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10, failureThreshold: 90 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, failureThreshold: 4 }
          lifecycle: { preStop: { sleep: { seconds: 15 } } }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: models, emptyDir: { sizeLimit: 60Gi } }
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 8Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: vllm, namespace: inference, labels: { app: vllm } }
spec:
  selector: { app: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: vllm-headless, namespace: inference }
spec:
  clusterIP: None
  selector: { app: vllm }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: vllm, namespace: inference }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: vllm } }
