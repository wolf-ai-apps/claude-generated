# kube-prometheus-stack values for the course.
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f kps-values.yaml
prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    # pick up PodMonitors/ServiceMonitors from every namespace, not only this release's
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 7d
grafana:
  adminPassword: change-me
