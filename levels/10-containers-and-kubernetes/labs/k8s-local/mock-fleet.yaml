# Lab 10b: the same fleet on a local cluster (kind or k3d), no GPU needed.
#   kind create cluster --name academy
#   docker build -t academy/mockllm:dev --build-arg CMD=mockllm platform/ && kind load docker-image academy/mockllm:dev --name academy
#   docker build -t academy/gateway:dev --build-arg CMD=gateway platform/ && kind load docker-image academy/gateway:dev --name academy
#   kubectl apply -f mock-fleet.yaml
#   kubectl -n inference port-forward svc/gateway 9000:9000
apiVersion: v1
kind: Namespace
metadata: { name: inference }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: engine, namespace: inference }
spec:
  replicas: 3
  selector: { matchLabels: { app: engine } }
  template:
    metadata:
      labels: { app: engine }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      containers:
        - name: engine
          image: academy/mockllm:dev
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":8000", "-max-num-seqs", "16", "-cache-blocks", "1000"]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 128Mi }
---
# Headless Service: DNS returns one A record per READY pod, which the gateway's
# -discover flag turns into its backend list (needed for prefix-aware routing).
apiVersion: v1
kind: Service
metadata: { name: engine-headless, namespace: inference }
spec:
  clusterIP: None
  selector: { app: engine }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: inference }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: academy/gateway:dev
          imagePullPolicy: IfNotPresent
          args: ["-addr", ":9000", "-policy", "prefix",
                 "-discover", "engine-headless.inference.svc.cluster.local:8000"]
          ports: [{ containerPort: 9000, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: inference }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 9000, targetPort: http }]
