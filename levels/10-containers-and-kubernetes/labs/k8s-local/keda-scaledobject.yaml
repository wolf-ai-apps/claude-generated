# Lab 10c: autoscale engines on QUEUE DEPTH, not CPU.
# Prereqs: Prometheus in the cluster scraping the engine pods, and KEDA:
#   helm repo add kedacore https://kedacore.github.io/charts && helm install keda kedacore/keda -n keda --create-namespace
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install prom prometheus-community/prometheus -n monitoring --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: engine, namespace: inference }
spec:
  scaleTargetRef: { name: engine }
  minReplicaCount: 1
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 300            # GPU replicas are slow to start: scale down cautiously
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 120 }] }
        scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prom-prometheus-server.monitoring.svc.cluster.local
        # Requests in the system (running + waiting). KEDA treats the result as a total
        # and targets `threshold` per replica: desired = ceil(total / 12).
        # 12 of -max-num-seqs=16 leaves headroom for bursts.
        query: sum(vllm:num_requests_running{namespace="inference"}) + sum(vllm:num_requests_waiting{namespace="inference"})
        threshold: "12"
