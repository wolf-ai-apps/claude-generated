are memory-bound (the slope is bandwidth); right of it, compute-bound.\n\n```mermaid\nxychart-beta\n    title \"H100 roofline: attainable TFLOP/s by arithmetic intensity\"\n    x-axis \"FLOPs per byte (decode batch size, or prefill tokens)\" [\"1\", \"8\", \"32\", \"128\", \"295\", \"512\", \"1024\"]\n    y-axis \"TFLOP/s\" 0 --> 1000\n    line [3.35, 26.8, 107, 429, 989, 989, 989]\n```\n\nFor the weight matmuls in BF16 (2 bytes per weight, 2 FLOPs per weight per token):\n- **Decode with batch B:** each weight is read once and used B times, so intensity \u2248 **B FLOPs/byte**.\n- **Prefill of P tokens:** intensity \u2248 **P FLOPs/byte**.\n\nSo:\n1. **Batch-1 decode on an H100 uses well under 1% of its FLOPs.** Batching is the main lever.\n2. Decode stays memory-bound until batch \u2248 ridge point (~295 on H100, ~400 on an L4 with 121 TFLOP/s over only 300 GB/s). In practice the KV cache runs out of memory long before that.\n3. **Quantizing weights** (FP8: 1 byte, INT4: 0.5 bytes) doubles or quadruples intensity and cuts bytes per step. Decode gets faster even though the FLOPs are unchanged.\n4. Attention over the KV cache adds bytes with few FLOPs, so long contexts push decode further into the memory-bound region.\n\n## 3. Worked examples\n\n**Example A: one GPU or two for Llama 3.1 8B?**\n\n```\n$ go run ./cmd/infercalc -model llama-3.1-8b -gpu a10g -context 4096 -prompt 1024 -price 1.0\nWeights (bf16):        16.1 GB  = 8.03B params x 2.0 bytes\nKV cache per token:  128 KiB = 2 x 32 layers x 8 kv_heads x 128 head_dim x 2.0 bytes (bf16)\nKV per sequence:     0.54 GB  at 4096 tokens of context\nUsable memory:       21.6 GB  (90% of 24 GB x 1)\nKV budget:           4.5 GB  = usable - weights - overhead\nMax concurrent seqs: 8\nAt batch 8:\n  decode step        45.2 ms\n  per-user speed     22.1 tok/s\n  aggregate          177 tok/s\nPrefill (1024 tok):   470 ms  (TTFT floor on an idle GPU)\nCost:                $1.571 per 1M output tokens at $1.00/h\n```\n\nRead it: it fits, but only 8 concurrent 4k-token users, and 22 tok/s each. Try `-dtype fp8 -kv-dtype fp8 -gpu l4`. The L4 has half the A10G's bandwidth, but FP8 halves the bytes, and the KV budget grows enough for several times more users.\n\n**Example B: Llama 3.1 70B.** 141 GB in BF16 doesn't fit on any single GPU in the table except the H200 (141 GB), and there it leaves no room for KV cache. Options:\n\n```\n$ go run ./cmd/infercalc -model llama-3.1-70b -gpu h100 -gpus 4 -context 4096\nWeights (bf16):        141.2 GB ...\nKV budget:           142.8 GB\nMax concurrent seqs: 106\nAt batch 106: decode step 28.2 ms, per-user 35.5 tok/s, aggregate 3758 tok/s\n```\n\nOr quantize to FP8 (70 GB) and use 2\u00d7 H100 (TP=2) per replica, giving four replicas per p5.48xlarge. Level 11 adds the AWS instance view.\n\n**Example C: the long-context trap.** The same 8B on an L4, but users paste 32k-token documents: KV per sequence = 4 GiB, so **one** sequence fits. Long context is a capacity problem before it's a speed problem. Solutions: FP8 KV, a bigger GPU, chunked prefill plus a limit on concurrent long requests, or routing long-context traffic to a separate pool.\n\n## 4. Labs\n\n```bash\ncd platform\ngo run ./cmd/infercalc -h                                   # all flags\ngo run ./cmd/infercalc -model llama-3.1-8b -gpu l4 -dtype fp8 -kv-dtype fp8 -context 8192\ngo run ./cmd/infercalc -model mixtral-8x7b -gpu h100 -gpus 2 # MoE: memory uses total params, speed uses active\ncd ../levels/06-performance-math/labs\npython3 roofline.py --gpu h100\npython3 roofline.py --gpu l4 --bytes-per-weight 1 --batch 1 16 64 128\n```\n\nAssignments:\n1. Fill in this table with the calculator, then check it against vLLM's startup log in level 8 (\"Available KV cache memory\", \"Maximum concurrency\"):\n\n   | Model | GPU | dtype | Max seqs @ 8k | tok/s/user @ max batch | $/1M tok |\n   |---|---|---|---|---|---|\n   | 8B | L4 | bf16 | | | |\n   | 8B | L4 | fp8 | | | |\n   | 8B | L40S | bf16 | | | |\n   | 70B | 4\u00d7L40S | fp8 | | | |\n   | 70B | 8\u00d7H100 | bf16 | | | |\n\n2. Find the batch size where an L4's decode stops being memory-bound with FP8 weights (`roofline.py`). Is it reachable given its KV budget?\n3. Add a `-gpu` preset for a GPU you have access to, and a `-model` preset for a model you care about (`platform/internal/calc/calc.go`). Add a test with your hand calculation.\n\n## 5. Check yourself\n\n<details><summary>1. Why does aggregate throughput rise with batch size while per-user speed falls?<\/summary>\nEach decode step reads the weights once for the whole batch, so more sequences share that fixed cost (aggregate rises). Each step also reads every sequence's KV cache and does more compute, so it takes longer (per-user speed falls).<\/details>\n\n<details><summary>2. Estimate the single-stream decode speed of a 16 GB model on an H100 (3.35 TB/s, MBU 0.75).<\/summary>\n16e9 / (3.35e12 \u00d7 0.75) \u2248 6.4 ms per token, about 157 tok/s.<\/details>\n\n<details><summary>3. A colleague proposes an H100 instead of an L40S \"because it has 3\u00d7 the FLOPs\" for a batch-4 chat workload. What's the better argument?<\/summary>\nAt batch 4, decode is memory-bound, so compare bandwidth (3.35 vs 0.86 TB/s, ~3.9\u00d7) and memory size, and then cost per token. FLOPs matter for prefill-heavy or large-batch workloads.<\/details>\n\n<details><summary>4. Why does FP8 weight quantization speed up decode even though tensor-core FLOPs aren't the bottleneck?<\/summary>\nDecode time is dominated by bytes read per step. FP8 halves the weight bytes.<\/details>\n\n## 6. Going deeper\n- Kipply, *Transformer Inference Arithmetic*\n- Williams, Waterman, Patterson, *Roofline: An Insightful Visual Performance Model* (2009)\n- Databricks / Baseten / Anyscale posts on LLM inference performance engineering (MBU, MFU)\n\n**Next \u2192 [Level 7: Inference optimizations](#level-07)**\n"}, {"id": "level-07", "title": "Inference optimizations", "path": "levels/07-inference-optimizations/README.md", "num": "07", "tier": "Laptop", "md": "# Level 7: Inference optimizations\n\n> Every optimization in vLLM, SGLang and TensorRT-LLM attacks a specific bottleneck. Learn the bottleneck first and the techniques follow from it.\n\n**You will:** understand ten optimizations by the bottleneck each removes, and implement the core of four of them (batching scheduler, paged KV cache with prefix caching, quantization, speculative decoding) with tests.\n**Time:** 6\u20138 hours \u00b7 **Hardware:** laptop (Tier 0) for the labs\n\n---\n\n## 0. The map\n\n| # | Optimization | Bottleneck it attacks | Main win | Trade-off |\n|---|---|---|---|---|\n| 1 | Continuous batching | GPU idle while batches drain | throughput, TTFT | scheduler complexity |\n| 2 | PagedAttention | KV memory fragmentation | concurrency | indirection in attention kernels |\n| 3 | Prefix caching | recomputing shared prompts | TTFT, GPU work | cache memory; needs routing affinity |\n| 4 | Chunked prefill | long prefills stall decodes | ITL tail | slightly higher TTFT |\n| 5 | FlashAttention | HBM traffic in attention | speed and memory at long context | kernel complexity |\n| 6 | CUDA graphs and fusion | kernel launch overhead | decode step time | warm-up time, static shapes |\n| 7 | Quantization | bytes per weight / KV entry | memory and decode speed | accuracy, must evaluate |\n| 8 | Speculative decoding | decode is serial | per-user speed at low batch | wasted work at high batch |\n| 9 | Parallelism (TP/PP/EP) | model doesn't fit / too slow on one GPU | capacity, latency | communication overhead |\n| 10 | Disaggregated prefill/decode | prefill and decode interfere | goodput at strict SLOs | KV transfer, more moving parts |\n\n---\n\n## 1. Continuous batching (iteration-level scheduling)\n\n**Static batching:** collect B requests, run them together until **all** finish. Short answers sit idle waiting for the longest one, and new requests wait for the next batch.\n\n**Continuous batching** (Orca, 2022): the scheduler makes a decision **every step**. Finished sequences leave immediately and waiting ones join immediately. The GPU always runs the fullest batch it can.\n\n**Static batching.** C runs for 9 steps, so A and B hold their slots after finishing, and D waits for the whole batch:\n\n```mermaid\ngantt\n    title Static batching: 3 slots, one batch at a time\n    dateFormat YYYY-MM-DD\n    axisFormat step %e\n    section Slot 1\n    A            :a1, 2024-01-01, 5d\n    idle         :crit, 2024-01-06, 4d\n    D            :2024-01-10, 4d\n    section Slot 2\n    B            :b1, 2024-01-01, 2d\n    idle         :crit, 2024-01-03, 7d\n    E            :2024-01-10, 3d\n    section Slot 3\n    C            :c1, 2024-01-01, 9d\n    F            :2024-01-10, 4d\n```\n\n**Continuous batching.** The scheduler refills each slot the step after it frees up:\n\n```mermaid\ngantt\n    title Continuous batching: slots refilled every step\n    dateFormat YYYY-MM-DD\n    axisFormat step %e\n    section Slot 1\n    A            :2024-01-01, 5d\n    D            :2024-01-06, 4d\n    G            :2024-01-10, 4d\n    section Slot 2\n    B            :2024-01-01, 2d\n    E            :2024-01-03, 3d\n    F            :2024-01-06, 4d\n    H            :2024-01-10, 4d\n    section Slot 3\n    C            :2024-01-01, 9d\n    I            :2024-01-10, 4d\n```\n\nThe scheduler's job each step: pick which waiting requests to admit, subject to a max batch size (`--max-num-seqs`), a token budget per step (`--max-num-batched-tokens`) and available KV blocks. If memory runs out mid-generation, it **preempts** a sequence (frees its blocks and recomputes them later), which shows up as latency spikes.\n\n## 2. PagedAttention\n\nOlder servers reserved `max_model_len` tokens of contiguous KV memory per request. A 200-token chat wasted almost all of an 8k reservation, so 60\u201380% of KV memory went unused.\n\n**PagedAttention** (vLLM, 2023) borrows virtual memory from operating systems:\n- The KV cache is a pool of fixed-size **blocks** (vLLM default: 16 tokens).\n- Each sequence has a **block table** mapping its logical blocks to physical blocks, like a page table.\n- Blocks are allocated only as tokens are generated, so waste is at most one partial block per sequence.\n- Blocks can be **shared** (reference-counted) between sequences: parallel samples (`n > 1`), beam search and common prefixes. A shared block is **copied on write**.\n- The attention kernel reads K/V by following the block table.\n\nTwo sequences sharing a 2-block prefix, with 4-token blocks:\n\n```mermaid\nflowchart LR\n    subgraph A[\"Sequence A: block table\"]\n        A0[\"logical 0\"]\n        A1[\"logical 1\"]\n        A2[\"logical 2\"]\n    end\n    subgraph B[\"Sequence B: block table\"]\n        B0[\"logical 0\"]\n        B1[\"logical 1\"]\n        B2[\"logical 2\"]\n    end\n    subgraph POOL[\"Physical KV block pool on the GPU\"]\n        P7[\"block 7<br/>system prompt, part 1<br/>refcount 2\"]\n        P3[\"block 3<br/>system prompt, part 2<br/>refcount 2\"]\n        P9[\"block 9<br/>A's question\"]\n        P4[\"block 4<br/>B's question\"]\n        PF[\"free blocks ...\"]\n    end\n    A0 --> P7\n    A1 --> P3\n    A2 --> P9\n    B0 --> P7\n    B1 --> P3\n    B2 --> P4\n```\n\n## 3. Prefix caching\n\nChat traffic repeats itself: the same system prompt, few-shot examples, tool definitions, document, or conversation history on every turn. With **automatic prefix caching**, each full KV block is identified by a **hash of its tokens and of all tokens before it** (a hash chain). A new request looks up its prefix blocks. Cache hits skip prefill entirely for those tokens.\n\n- A 2,000-token system prompt plus a 50-token question means ~97% of prefill is skipped on a hit. TTFT drops from hundreds of ms to tens.\n- The cache lives **on one replica**. With 10 replicas and round-robin routing, each prefix is cached 10 times and hit rarely. That's why **prefix-aware routing** (level 10) matters.\n- SGLang's RadixAttention stores prefixes in a radix tree. The idea is the same.\n\nHow a new request finds its cached prefix:\n\n```mermaid\nflowchart LR\n    REQ[\"New prompt\"] --> SPLIT[\"Split into 16-token blocks\"]\n    SPLIT --> H1[\"h1 = hash(block 1)\"]\n    H1 --> H2[\"h2 = hash(h1 + block 2)\"]\n    H2 --> H3[\"h3 = hash(h2 + block 3)\"]\n    H1 -.->|hit| C1[(\"cached\")]\n    H2 -.->|hit| C2[(\"cached\")]\n    H3 -.->|miss| NEW[\"compute from here on\"]\n```\n\nA block only matches if every block before it matched too, because each hash includes the previous one.\n\n## 4. Chunked prefill\n\nA 16k-token prompt arriving in a continuous batch makes one step take hundreds of milliseconds, and **every** other user's next token waits. **Chunked prefill** caps the tokens per step (e.g. 512\u20138192) and splits long prompts across steps, mixed with the ongoing decodes. ITL tails flatten. The cost is a somewhat higher TTFT for the long prompt itself. (Sarathi-Serve, 2024; enabled by default in recent vLLM.)\n\n## 5. FlashAttention\n\nNaive attention materializes the T\u00d7T score matrix in HBM: write scores, read them for softmax, write probabilities, read them for the V multiply. **FlashAttention** tiles q, k and v into SRAM-sized blocks and computes the softmax **online** (a running max and sum), so the T\u00d7T matrix never touches HBM. The result is exact, uses O(T) memory instead of O(T\u00b2), and is much faster at long context. FlashDecoding / split-KV extends it to decode with long caches by parallelizing over the KV length. FlashInfer and FlashAttention 2/3 are the kernels vLLM and SGLang use.\n\n## 6. CUDA graphs and kernel fusion\n\nA decode step is hundreds of small kernels, and launching each one costs microseconds of CPU time. **CUDA graphs** capture the step once per batch size and replay it with a single launch. **Fusion** merges elementwise ops (RMSNorm + residual, RoPE, SwiGLU activation) into neighbouring kernels to avoid HBM round trips. Both are why a vLLM decode step is far faster than `transformers.generate()` on the same GPU. It's also why vLLM's startup includes \"capturing CUDA graphs\".\n\n## 7. Quantization\n\n| Method | What is quantized | Notes |\n|---|---|---|\n| Weight-only INT8 / INT4 (**GPTQ**, **AWQ**) | weights; activations stay BF16 | INT4 at group size 128 is common; big memory and decode win; dequantized inside the matmul kernel |\n| **FP8** (W8A8) | weights and activations, per-tensor/channel scales | native on L4/L40S/H100/H200; ~2\u00d7 memory and good speed; usually small quality loss |\n| **SmoothQuant** | moves activation outliers into weights, then INT8 W8A8 | handles activation outliers |\n| **KV cache FP8** | the cache | ~2\u00d7 more context/users; check long-context quality |\n| GGUF (llama.cpp) | many k-quant types | CPU / Apple Silicon / edge |\n\nTwo rules: (1) decode speed tracks **bytes per weight**, so quantization is a throughput and capacity tool as well as a memory tool; (2) **always evaluate on your own task**. Perplexity can look fine while a coding or math benchmark drops.\n\n## 8. Speculative decoding\n\nA cheap **draft** proposes k tokens. The **target** model checks all k in one forward pass, which costs about the same as one decode step, because decode is memory-bound and k extra tokens add little. Accept each draft token with probability `min(1, p/q)`. On rejection, resample from the residual `max(0, p \u2212 q)`. **The output distribution is exactly the target's.**\n\nExpected tokens per target pass with acceptance rate \u03b1: `(1 \u2212 \u03b1^(k+1)) / (1 \u2212 \u03b1)`.\n\nDraft sources: a small model from the same family, **n-gram / prompt lookup** (copy from the prompt; great for summarization, RAG and code edits), **Medusa** heads, **EAGLE** (a light draft head on the target's features, typically the best acceptance). **Caveat:** at high batch sizes decode becomes compute-bound, verification stops being nearly free, and speculation can *reduce* throughput. It's a latency tool for low-to-moderate load.\n\nOne speculative step with k = 4:\n\n```mermaid\nsequenceDiagram\n    participant D as Draft model (small)\n    participant T as Target model (large)\n    participant S as Sampler\n    D->>D: propose x1, x2, x3, x4 (4 cheap steps)\n    D->>T: x1..x4\n    T->>T: ONE forward pass scores all 4 positions\n    T->>S: p(x1) .. p(x4), plus p for a 5th position\n    S->>S: accept x1 (p/q \u2265 random)\n    S->>S: accept x2\n    S->>S: reject x3, resample from max(0, p - q)\n    S-->>T: emit x1, x2, x3' (3 tokens for 1 target pass)\n    Note over D,S: If all 4 are accepted, the 5th position<br/>gives a free bonus token\n```\n\n## 9. Parallelism\n\n| Strategy | Split | Communication | Use when |\n|---|---|---|---|\n| **Tensor parallel (TP)** | each layer's matrices across GPUs | 2 all-reduces per layer, latency-critical | model doesn't fit on one GPU; within a node on NVLink |\n| **Pipeline parallel (PP)** | layers across GPUs/nodes | activations between stages | across nodes; tolerates slower links; adds pipeline bubbles |\n| **Data parallel (replicas)** | whole model copies | none | the model fits: **always prefer replicas** for throughput |\n| **Expert parallel (EP)** | MoE experts across GPUs | all-to-all per MoE layer | large MoE models |\n| **Context/sequence parallel** | the sequence | ring attention | very long context |\n\nRule: use the smallest TP that fits with reasonable KV room, keep TP inside an NVLink domain, then scale with replicas.\n\n## 10. Disaggregated prefill and decode\n\nPrefill (compute-bound, bursty) and decode (memory-bound, steady) interfere when they share a GPU. **Disaggregation** runs them on separate pools and ships the KV cache from prefill to decode workers over a fast interconnect (RDMA/NVLink-class transfer libraries). It improves goodput under strict TTFT and ITL SLOs at scale, at the cost of KV transfer and operational complexity (DistServe, Splitwise, Mooncake; NVIDIA Dynamo and llm-d productize the idea). Below large scale, chunked prefill usually captures most of the benefit.\n\n---\n\n```mermaid\nflowchart LR\n    R[\"Request\"] --> RT[\"Router\"]\n    RT --> PF[\"Prefill pool<br/>compute-heavy GPUs\"]\n    PF -->|\"KV cache transfer<br/>RDMA / NVLink-class\"| DC[\"Decode pool<br/>memory-bandwidth-heavy GPUs\"]\n    DC -->|token stream| R\n```\n\n## Labs\n\n```bash\ncd levels/07-inference-optimizations/labs\npython3 batching_sim.py   # static vs continuous vs chunked prefill on the same workload\npython3 paged_kv.py       # block tables, prefix sharing, copy-on-write, fragmentation\npython3 quantize.py       # INT8 per-channel and INT4 group-wise: size vs error, outliers\npython3 speculative.py    # proof of losslessness + speed-up table\npython3 -m unittest test_level07\n```\n\nSample output of `batching_sim.py`:\n\n```\nstatic batching (16)                   782 tok/s    13113    26003 ms TTFT p50/p99   10.4   10.4 ms ITL p50/p99\ncontinuous batching                   2231 tok/s      204      790 ms TTFT p50/p99   17.6  180.7 ms ITL p50/p99\ncontinuous + chunked prefill 512      2171 tok/s      622     1265 ms TTFT p50/p99   22.6   26.4 ms ITL p50/p99\n```\n\nRead it like an engineer:\n- Continuous batching gives ~3\u00d7 the throughput and ~60\u00d7 better median TTFT than static batching.\n- Without chunking, ITL p99 is 180 ms: the long prompts freeze everyone. Chunking brings it to 26 ms and **costs TTFT**. That's the trade-off the `--max-num-batched-tokens` setting controls.\n\nExercises:\n1. `batching_sim.py`: sweep `chunk_tokens` over 128, 512, 2048, 8192 and plot TTFT p50 against ITL p99. Where would you set it for a chat product, and for a batch-summarization product?\n2. `paged_kv.py`: add **LRU eviction statistics** and a workload of 50 conversations \u00d7 5 turns where each turn's prompt is the previous turn's prompt + answer + new question. What hit rate do you get with 64 vs 512 blocks?\n3. `quantize.py`: implement **AWQ-style scaling**. Scale up the input channels with the largest activations before quantizing, scale the activations down by the same factor, and measure the error reduction with outlier activations.\n4. `speculative.py`: add a \"batch size\" parameter where verification costs `1 + 0.02 \u00d7 batch \u00d7 k` steps. Find the batch size where speculation stops helping.\n\n## Check yourself\n\n<details><summary>1. Which optimization would you look at first for each symptom: (a) TTFT high only for users with a long shared system prompt; (b) ITL p99 spikes when someone pastes a document; (c) the server fits 10 concurrent users but memory looks half empty?<\/summary>\n(a) Prefix caching, plus prefix-aware routing. (b) Chunked prefill (lower `max-num-batched-tokens`). (c) Fragmentation or over-reservation: PagedAttention (in vLLM already), or `max-model-len` set far larger than needed.<\/details>\n\n<details><summary>2. Why does prefix caching need help from the router?<\/summary>\nThe cache is per replica. Requests sharing a prefix only hit it if they land on the replica that holds those blocks.<\/details>\n\n<details><summary>3. Is speculative decoding lossy?<\/summary>\nNo. With correct rejection sampling, the output distribution equals the target model's. Only speed changes.<\/details>\n\n<details><summary>4. You can serve a 70B model with TP=8 on one 8-GPU node, or with 2 replicas at TP=4. Which is usually better for throughput, and why?<\/summary>\nTwo TP=4 replicas, if each has enough KV room. Less communication per token, and two independent schedulers. TP=8 gives lower per-token latency and more KV memory per replica.<\/details>\n\n## Going deeper\n- Yu et al., *Orca* (OSDI '22) \u00b7 Kwon et al., *PagedAttention / vLLM* (SOSP '23) \u00b7 Zheng et al., *SGLang* (RadixAttention)\n- Agrawal et al., *Sarathi-Serve* (OSDI '24) \u00b7 Dao et al., *FlashAttention 1/2/3*\n- Frantar et al., *GPTQ* \u00b7 Lin et al., *AWQ* \u00b7 Xiao et al., *SmoothQuant* \u00b7 Dettmers et al., *LLM.int8()*\n- Leviathan et al. / Chen et al., speculative decoding (2023) \u00b7 Cai et al., *Medusa* \u00b7 Li et al., *EAGLE*\n- Shoeybi et al., *Megatron-LM* \u00b7 Zhong et al., *DistServe* \u00b7 Patel et al., *Splitwise* \u00b7 Qin et al., *Mooncake*\n\n**Next \u2192 [Level 8: Running models and vLLM](#level-08)**\n"}, {"id": "level-08", "title": "Running models, from laptop to vLLM", "path": "levels/08-running-models-and-vllm/README.md", "num": "08", "tier": "GPU", "md": "# Level 8: Running models, from laptop to vLLM\n\n> vLLM implements level 7 for you. This level is about using it well: its architecture, the flags that matter, its API and its metrics.\n\n**You will:** run models with Transformers, llama.cpp/Ollama and vLLM; understand vLLM's architecture; tune its memory flags; use its OpenAI-compatible API and its metrics.\n**Time:** 4\u20136 hours \u00b7 **Hardware:** a 24 GB GPU (Tier 1: g6.xlarge/g5.xlarge, or Colab for the 0.5B model)\n\n---\n\n## 1. Concepts\n\n### 1.1 The engine landscape\n\n| Engine | Strengths | Typical use |\n|---|---|---|\n| HF Transformers `generate()` | simplest, every model | research, correctness reference; slow for serving |\n| llama.cpp / Ollama | CPU, Apple Silicon, GGUF quantization, one binary | laptops, edge, dev |\n| **vLLM** | PagedAttention, continuous batching, broad model and hardware support, OpenAI API, huge community | **default choice for GPU serving** |\n| SGLang | RadixAttention, fast structured generation, strong for agents and multi-call programs | high-throughput and agentic workloads |\n| TensorRT-LLM | compiled engines tuned for NVIDIA GPUs | maximum NVIDIA performance, more build effort |\n| HF TGI | earlier popular server | existing deployments; check project status before adopting |\n| NVIDIA Dynamo, llm-d | orchestration *around* engines: disaggregation, KV-aware routing | large fleets (level 14) |\n\n### 1.2 vLLM architecture\n\n```mermaid\nflowchart LR\n    CL[\"HTTP client\"] --> API\n    subgraph API[\"API server (FastAPI, OpenAI-compatible)\"]\n        TOK[\"tokenize, chat template, validate\"]\n        DETOK[\"detokenize, stream SSE\"]\n    end\n    TOK --> CORE\n    subgraph CORE[\"Engine core: own process, one iteration per model step\"]\n        direction TB\n        SCH[\"Scheduler<br/>waiting, running, preempted<br/>token budget, chunked prefill\"]\n        KVM[\"KV cache manager<br/>block pool, block tables<br/>prefix-cache hash table\"]\n        SCH <--> KVM\n    end\n    CORE --> EXE[\"Executor\"]\n    EXE --> W1[\"Worker GPU 0<br/>model runner, CUDA graphs, sampling\"]\n    EXE --> W2[\"Worker GPU 1..N<br/>(tensor / pipeline parallel)\"]\n    W1 --> DETOK\n    DETOK --> CL\n```\n\nOne request's path through the engine:\n\n```mermaid\nsequenceDiagram\n    participant C as Client\n    participant A as API server\n    participant S as Scheduler\n    participant K as KV cache manager\n    participant W as GPU worker\n    C->>A: chat request\n    A->>S: token IDs (waiting queue)\n    S->>K: allocate blocks, look up prefix cache\n    K-->>S: cached prefix blocks + new blocks\n    S->>W: step with a prefill chunk plus other requests' decodes\n    W-->>A: first token\n    A-->>C: SSE chunk\n    loop each engine step\n        S->>W: decode this request with the rest of the batch\n        W-->>A: token\n        A-->>C: SSE chunk\n    end\n    S->>K: free blocks (full blocks stay in the prefix cache)\n```\n\n### 1.3 The flags that matter\n\n| Flag | What it controls | Rule of thumb |\n|---|---|---|\n| `--model`, `--served-model-name` | weights to load / name clients use | serve a stable alias, not the HF id |\n| `--max-model-len` | max prompt + output tokens per request | set to what users need, **not** the model's maximum. Halving it can double concurrency |\n| `--gpu-memory-utilization` | fraction of GPU memory for weights + KV pool | 0.85\u20130.92; lower if the GPU is shared or you see OOMs |\n| `--max-num-seqs` | max sequences per step | caps batch size: higher means more throughput and slower per-user tokens |\n| `--max-num-batched-tokens` | tokens per step (chunked prefill budget) | lower means smoother ITL; higher means better TTFT/throughput for long prompts |\n| `--tensor-parallel-size`, `--pipeline-parallel-size` | multi-GPU split | smallest that fits (level 7) |\n| `--enable-prefix-caching` | automatic prefix caching | on for chat and agents (default on in recent versions) |\n| `--quantization`, `--kv-cache-dtype fp8` | quantized weights / KV | use a pre-quantized checkpoint (AWQ, GPTQ, FP8) when available |\n| `--enable-lora`, `--max-loras` | serve LoRA adapters on one base model | multi-tenant fine-tunes (level 15 case study) |\n| `--speculative-config` | speculative decoding | latency at low load; measure at your real batch size |\n| `--enable-chunked-prefill` | chunked prefill | default on in recent versions |\n\nFlag names and defaults change between releases. **Pin the version** and check `vllm serve --help` for it.\n\n### 1.4 Reading the startup log\n\nAbridged and illustrative; the exact wording changes between versions:\n\n```\nLoading weights took 15.2 GB / 6.3 s                           <- level 4/6: params \u00d7 bytes\nMemory profiling: ... activations peak 1.4 GiB\nAvailable KV cache memory: 3.9 GiB                             <- formula 3 in level 6\nGPU KV cache size: 31,904 tokens                               <- 3.9 GiB / 128 KiB per token\nMaximum concurrency for 8,192 tokens per request: 3.89x        <- full-length sequences that fit\nCapturing CUDA graphs (decode, batch sizes 1..512) ... 12 s    <- level 7.6\n```\n\nIf your level 6 calculation and this log disagree by more than ~20%, find out why. It's usually overhead, `max-model-len`, or the dtype.\n\n### 1.5 The API\n\nvLLM exposes OpenAI-compatible endpoints: `/v1/chat/completions`, `/v1/completions`, `/v1/embeddings` (for embedding models), `/v1/models`, plus `/health` and `/metrics`. Any OpenAI SDK works by changing `base_url`. vLLM-specific sampling options (`top_k`, `min_p`, `repetition_penalty`, `ignore_eos`, structured-output options) go in `extra_body`.\n\n### 1.6 Metrics you'll use for the rest of the course\n\n| Metric | Type | Meaning | Used for |\n|---|---|---|---|\n| `vllm:num_requests_running` | gauge | sequences in the current batch | load, concurrency |\n| `vllm:num_requests_waiting` | gauge | queued, not yet scheduled | **saturation**, autoscaling |\n| `vllm:kv_cache_usage_perc` | gauge (0\u20131) | KV block pool usage | memory pressure, preemption risk |\n| `vllm:time_to_first_token_seconds` | histogram | TTFT | SLO |\n| `vllm:inter_token_latency_seconds` | histogram | ITL | SLO |\n| `vllm:e2e_request_latency_seconds` | histogram | end-to-end latency | SLO |\n| `vllm:prompt_tokens_total`, `vllm:generation_tokens_total` | counters | tokens processed | throughput, cost attribution |\n| `vllm:prefix_cache_queries_total`, `vllm:prefix_cache_hits_total` | counters | prefix cache lookups / hits (tokens) | cache hit rate, routing quality |\n\nNames have changed across versions (e.g. `gpu_cache_usage_perc` \u2192 `kv_cache_usage_perc`, `time_per_output_token_seconds` \u2192 `inter_token_latency_seconds`). The academy's `mockllm` uses the current names, so dashboards and autoscalers you build against it carry over.\n\n---\n\n## 2. Worked example: fixing a startup OOM\n\nYou launch Llama 3.1 8B on a 24 GB L4 with defaults and see:\n\n```\nValueError: The model's max seq len (131072) is larger than the maximum number of tokens\nthat can be stored in KV cache (31904). Try increasing gpu_memory_utilization or decreasing max_model_len.\n```\n\nThe model supports 128k context. One 128k sequence needs 128k \u00d7 128 KiB = **16 GiB** of KV, but only 3.9 GiB is free. Fixes, in order of preference:\n1. `--max-model-len 8192`: the product only needs 8k. Done.\n2. `--kv-cache-dtype fp8`: twice the tokens.\n3. An FP8 model checkpoint (frees ~8 GB of weights for KV).\n4. A 48 GB L40S (g6e) if users really need long context.\n\n## 3. Labs\n\n```bash\ncd levels/08-running-models-and-vllm/labs\n./serve_vllm.sh                                   # Qwen2.5-0.5B, ungated; watch the startup log\nMODEL=meta-llama/Llama-3.1-8B-Instruct HF_TOKEN=hf_... ./serve_vllm.sh   # the course's running example\npip install openai && python3 client.py           # streaming, JSON schema, vLLM extras\n./watch_metrics.sh http://localhost:8000          # live scheduler state while you send load\npip install vllm && python3 offline_batch.py --n 512   # offline throughput, no HTTP\n```\n\nNo GPU yet? Everything except `serve_vllm.sh` and `offline_batch.py` works against the mock: `go run ./platform/cmd/mockllm`, then `python3 client.py`. The structured-output step needs real vLLM.\n\nAssignments:\n1. **Calculator vs reality:** record \"Available KV cache memory\", \"GPU KV cache size\" and \"Maximum concurrency\" for 8B at `--max-model-len` 4096, 8192 and 32768. Compare with `infercalc`.\n2. **Concurrency vs speed:** using `platform/cmd/loadgen` in closed-loop mode, run `-concurrency 1, 4, 16, 64`. Plot aggregate output tok/s and per-user TPOT. Match the shape to level 6's prediction.\n3. **Prefix caching:** run loadgen with `-prefix-tokens 2000 -prefix-groups 4` with prefix caching on, then with `--no-enable-prefix-caching`. Compare TTFT p50 and the hit rate shown by `watch_metrics.sh`.\n4. **Online vs offline:** compare `offline_batch.py` tok/s with the best online tok/s that met a 1 s TTFT p95. Why is offline always higher?\n\n## 4. Check yourself\n\n<details><summary>1. Which two flags most often fix \"not enough KV cache\" at startup?<\/summary>\n`--max-model-len` (lower it to what you need) and `--gpu-memory-utilization` (raise it slightly if the GPU isn't shared). Next come FP8 KV and quantized weights.<\/details>\n\n<details><summary>2. What does a sustained non-zero `vllm:num_requests_waiting` mean?<\/summary>\nThe replica is saturated: it can't admit requests as fast as they arrive, limited by `max-num-seqs`, the token budget or KV blocks. TTFT will grow. Scale out or shed load.<\/details>\n\n<details><summary>3. Why serve with `--served-model-name llama-3.1-8b` instead of the HF repo id?<\/summary>\nClients and gateways bind to a stable alias, so you can swap checkpoints (quantized, fine-tuned, new revision) without changing callers.<\/details>\n\n## 5. Going deeper\n- vLLM docs: engine arguments, optimization and tuning, production metrics, structured outputs, LoRA, speculative decoding\n- vLLM blog posts on the V1 engine architecture\n- SGLang docs; TensorRT-LLM docs (for comparison in level 14)\n\n**Next \u2192 [Level 9: Benchmarking and SLOs](#level-09)**\n"}, {"id": "level-09", "title": "Benchmarking and SLOs", "path": "levels/09-benchmarking-and-slos/README.md", "num": "09", "tier": "Laptop", "md": "# Level 9: Benchmarking and SLOs\n\n> A benchmark answers one question: how much traffic can this setup serve while meeting its latency promise? Most published LLM benchmarks measure something else.\n\n**You will:** define SLOs for different products, learn open- vs closed-loop load and coordinated omission, measure goodput, and run a capacity sweep with the academy's Go load generator.\n**Time:** 4\u20135 hours \u00b7 **Hardware:** laptop with the mock (Tier 0); a GPU for the real runs (Tier 1)\n\n---\n\n## 1. Concepts\n\n### 1.1 SLOs depend on the product\n\n| Product | TTFT p95 | ITL / TPOT p95 | Notes |\n|---|---|---|---|\n| Chat assistant | < 1 s | < 50\u2013100 ms (10\u201320+ tok/s; faster than reading speed) | users watch the stream |\n| Code autocomplete | < 200\u2013300 ms end to end | \u2014 (short outputs) | latency above all; small models, short prompts |\n| Agent / tool loop | moderate | high tokens/s | many sequential calls: per-call latency compounds |\n| RAG over long documents | < 2\u20133 s | < 100 ms | prefill-heavy; prefix caching matters |\n| Batch / offline (evals, labeling) | none | none | **throughput and $/token only** |\n\nAn SLO is a percentile + a threshold + a window: *\"p95 TTFT < 1 s and p95 TPOT < 60 ms, measured over 5-minute windows, 99% of windows.\"*\n\n### 1.2 Throughput vs goodput\n\n- **Throughput:** tokens/s or requests/s the server produced.\n- **Goodput:** requests/s that **met the SLO**. A server pushed past its knee keeps raising throughput a little while goodput collapses, because everyone is served too slowly.\n\nThe headline number for a deployment is **max goodput per replica** (or per dollar) at your SLO.\n\n### 1.3 Closed loop vs open loop\n\n| | Closed loop | Open loop |\n|---|---|---|\n| How | N virtual users; each sends its next request after the previous one finishes | requests arrive on a clock (e.g. Poisson at \u03bb req/s), regardless of completions |\n| Models | a fixed pool of clients (batch jobs, load tests with a concurrency knob) | real users (they don't wait for each other) |\n| Under overload | **arrival rate drops automatically**, which hides the problem | queue grows, latency explodes, which **shows the problem** |\n\n### 1.4 Coordinated omission\n\nIn a closed loop, when the server stalls for 5 s, your 8 virtual users also stall, so no requests are *sent* during the stall and none are measured as slow. The benchmark \"coordinates\" with the server and **omits** exactly the samples that would have shown the problem. Percentiles look great; production users see 5 s spikes. Open-loop load (the academy loadgen's `-rate`) avoids this. The arrival schedule is computed up front and never waits for responses.\n\nThe same 5-second server stall, seen by each kind of load generator:\n\n```mermaid\nsequenceDiagram\n    participant CL as Closed-loop client (2 users)\n    participant S as Server\n    participant OL as Open-loop client (2 req/s)\n    Note over S: server stalls for 5 s\n    CL->>S: request 1 (user A)\n    CL->>S: request 2 (user B)\n    OL->>S: t=0.0 s request\n    OL->>S: t=0.5 s request\n    OL->>S: t=1.0 s request\n    OL->>S: ... 10 requests arrive during the stall\n    S-->>CL: 2 slow responses\n    S-->>OL: 10 slow responses\n    Note over CL: 2 slow samples recorded.<br/>No requests sent during the stall,<br/>so the stall barely shows in p99\n    Note over OL: 10 slow samples recorded.<br/>p99 shows what users experienced\n```\n\n### 1.5 Making the workload realistic\n\n- **Length distributions matter more than averages.** 90% short chats plus 10% long documents behaves very differently from \"everyone sends 500 tokens\".\n- **Output length:** benchmarks often set `ignore_eos` so outputs are exactly `max_tokens`. Production outputs vary, so model both.\n- **Prefix reuse:** real traffic shares system prompts and history. Random prompts understate prefix-cache benefit, and identical prompts overstate it. The academy loadgen has `-prefix-tokens` and `-prefix-groups` to control this.\n- **Warm-up:** the first requests pay for CUDA graph capture, cache warm-up and connection setup. Discard them or run long enough.\n- **Reproducibility:** record the engine version, flags, GPU, driver, model revision, workload seed and client location. One flag change can move results by 2\u00d7.\n\n### 1.6 Little's Law, again\n\n`concurrency = throughput \u00d7 latency`. A replica with `--max-num-seqs 16` and requests taking ~3.7 s each tops out near 16 / 3.7 \u2248 **4.3 req/s**. At 6 req/s the queue grows forever and TTFT climbs without bound. Your sweep should show exactly this knee.\n\n---\n\n## 2. Worked example: a capacity sweep (on the mock)\n\n```bash\ngo run ./platform/cmd/mockllm -addr :8000 -max-num-seqs 16 &\nRATES=\"2 4 6 8\" N=200 levels/09-benchmarking-and-slos/labs/sweep.sh http://localhost:8000\n```\n\nMeasured result (prompt 256\u20131024 tokens, output 64\u2013256, SLO TTFT \u2264 500 ms, TPOT \u2264 50 ms):\n\n```\nrate     req/s      out_tok/s    ttft_p95     tpot_p95     slo_met\n2        2.14       330          200          20.9         100.0%\n4        3.68       585          1493         23.3         56.5%\n6        3.87       616          7879         23.3         25.0%\n8        4.02       627          21428        23.4         8.0%\n```\n\n- Throughput plateaus at ~4 req/s, as Little's Law predicted.\n- **TPOT barely moves**, because the batch size is capped at 16. All the damage is in **TTFT** (queueing).\n- Attainment is already 56% at 4 req/s. The real capacity at a 95% target sits between 2 and 4 req/s. Refine the sweep (`RATES=\"2 2.5 3 3.5\"`) to find it. That number is what you use for capacity planning and autoscaling (level 12).\n\n## 3. Labs\n\n```bash\ncd platform\ngo run ./cmd/loadgen -h\n# closed loop: 8 users\ngo run ./cmd/loadgen -url http://localhost:8000 -concurrency 8 -n 200\n# open loop: Poisson 5 req/s with an SLO\ngo run ./cmd/loadgen -url http://localhost:8000 -rate 5 -n 300 -slo-ttft 500ms -slo-tpot 50ms -out run.json\n# shared prefixes (system prompts) for prefix-cache experiments\ngo run ./cmd/loadgen -url http://localhost:8000 -rate 5 -n 300 -prefix-tokens 2000 -prefix-groups 8\n```\n\nAssignments:\n1. **Coordinated omission, demonstrated:** start the mock with `-max-num-seqs 4`. Run closed-loop `-concurrency 4` and open-loop `-rate 3`. Compare TTFT p99. Which one tells the truth about user experience?\n2. **Find the knee** for the mock with `sweep.sh`, then do the same against real vLLM on a GPU (8B on an L4 or A10G). Record max goodput per replica at your SLO. You'll reuse this number in levels 12\u201314.\n3. **Cross-check the tool:** run `vllm_bench.sh` and the equivalent loadgen command. TTFT/TPOT p50 should agree within ~5\u201310%. If they don't, explain why (tokenization differences, client location, warm-up).\n4. **Write a benchmark report** (template below) for one configuration.\n\n### Benchmark report template\n\n```\nSystem:     model / revision / dtype / engine+version / key flags / GPU / driver / instance\nWorkload:   arrival process + rate, prompt and output length distributions, prefix reuse, seed, duration\nSLO:        TTFT p95 <= X, TPOT p95 <= Y\nResults:    table per rate: req/s, out tok/s, TTFT p50/p95/p99, TPOT p50/p95, error rate, SLO attainment\nAnswer:     max goodput per replica at SLO = N req/s (M tok/s); $/1M tokens at that point\nCaveats:    what would change the answer (longer prompts, different prefix reuse, ...)\n```\n\n## 4. Check yourself\n\n<details><summary>1. Why can a closed-loop benchmark report a fine p99 for a server that's overloaded?<\/summary>\nWhen the server slows down, the fixed pool of clients sends fewer requests, so the overload never shows up as long queues (coordinated omission).<\/details>\n\n<details><summary>2. In the sweep above, throughput rose ~4% from rate 6 to rate 8 while SLO attainment fell from 25% to 8%. Which number goes in the capacity plan?<\/summary>\nNeither of those. Use the highest rate where attainment still meets your target (e.g. \u2265 95%). Past the knee, extra throughput comes from making users wait longer.<\/details>\n\n<details><summary>3. Why must sweep runs use different random seeds when prefix caching is on?<\/summary>\nWith the same seed, every run sends the same prompts, so later runs hit blocks cached by earlier runs and look faster than they really are.<\/details>\n\n## 5. Going deeper\n- Gil Tene, *How NOT to Measure Latency* (coordinated omission)\n- vLLM benchmarking docs (`vllm bench serve`), GuideLLM, NVIDIA GenAI-Perf\n- Zhong et al., *DistServe*: the goodput-at-SLO framing\n\n**Next \u2192 [Level 10: Containers and Kubernetes for GPUs](#level-10)**\n"}, {"id": "level-10", "title": "Containers and Kubernetes for GPUs", "path": "levels/10-containers-and-kubernetes/README.md", "num": "10", "tier": "Laptop + K8s", "md": "# Level 10: Containers and Kubernetes for GPUs\n\n> Kubernetes was built for stateless CPU services. LLM servers are huge, slow to start, stateful (their KV cache) and run on scarce, expensive hardware. This level covers what changes because of that.\n\n**You will:** containerize inference, analyse cold starts, schedule GPUs in Kubernetes, write probes for slow starters, route LLM traffic properly, and autoscale on the right signal. Most of it runs on a laptop.\n**Time:** 6\u20138 hours \u00b7 **Hardware:** laptop + Docker + kind (Tier 0); a GPU cluster for 10d\u201310f (Tier 1)\n\n---\n\n## 1. Concepts\n\n### 1.1 GPU containers\n\n- The container holds the **user-space** stack (CUDA runtime, PyTorch, the engine). The **host** provides the kernel driver.\n- The **NVIDIA Container Toolkit** is the bridge. `docker run --gpus all` (or the Kubernetes device plugin) exposes `/dev/nvidia*` and mounts the driver's user-space libraries into the container.\n- Images are big. `vllm/vllm-openai` is several GB compressed and around 10 GB+ unpacked. Image pull is a real part of cold start.\n- **Shared memory:** multi-GPU inference uses `/dev/shm` for NCCL. Docker's 64 MB default breaks it. Use `--ipc=host` or mount a memory-backed `emptyDir` at `/dev/shm` in Kubernetes.\n\n### 1.2 Model weights are not code\n\n| Where weights live | Cold start | Pros | Cons |\n|---|---|---|---|\n| Baked into the image | image pull (huge) | one artifact, immutable | 16\u2013140 GB images, slow CI, registry costs |\n| Downloaded from the HF Hub at start | network + HF rate limits | simplest | slow; depends on an external service; gated-model tokens in pods |\n| **Object storage (S3) \u2192 local disk at start** | in-region S3 throughput | fast, private, versioned | needs IAM and an init step |\n| Shared filesystem (FSx for Lustre, EFS) or a PVC | mount + read | download once, share across pods | a filesystem to operate; throughput limits |\n| Streamed straight to GPU memory (model streamers) | overlaps download and load | fastest for big models | engine and format support needed |\n\n**Anatomy of a cold start** (8B on one GPU, typical orders of magnitude):\n\n```mermaid\ngantt\n    title Cold start of one 8B replica (typical, mid-range values)\n    dateFormat mm:ss\n    axisFormat %M:%S\n    Node provisioning, if no free GPU node (60-180 s) :crit, node, 00:00, 02:00\n    Image pull (30-120 s)                             :img, after node, 75s\n    Weights download, 16 GB (20-200 s)                :w, after img, 90s\n    Load weights into GPU (5-30 s)                    :load, after w, 15s\n    CUDA graph capture and warm-up (10-60 s)          :graph, after load, 30s\n    Ready                                             :milestone, after graph, 0s\n```\n\nTotal: about 2 to 10 minutes, so autoscaling has to react early (level 12).\n\n### 1.3 GPUs in Kubernetes\n\n- The **device plugin** (or the **NVIDIA GPU Operator**, which also manages drivers, the toolkit and DCGM) advertises `nvidia.com/gpu: N` on each node.\n- Pods request whole GPUs: `resources.limits: {nvidia.com/gpu: 1}`. No fractions without sharing features.\n- **Taint** GPU nodes (`nvidia.com/gpu:NoSchedule`) so CPU pods don't squat on $30/hour machines, and give GPU pods the matching **toleration**.\n- **Node affinity/selectors** pin workloads to GPU types (e.g. `eks.amazonaws.com/instance-family: g6`).\n- **Sharing a GPU:**\n\n| Mechanism | Isolation | Granularity | Use |\n|---|---|---|---|\n| Time-slicing | none (memory and faults shared) | N virtual GPUs per GPU | dev/test, tiny models |\n| MPS | partial | processes share SMs concurrently | many small inference processes |\n| **MIG** (A100/H100/H200) | hardware: memory + SMs + faults | up to 7 slices | multi-tenant small models |\n| **DRA** (Dynamic Resource Allocation) | depends on driver | structured requests (\"a GPU with \u2265 40 GB\") | the newer Kubernetes API for devices |\n\n### 1.4 Probes and lifecycle for slow, stateful servers\n\n- **startupProbe** with a long budget (10\u201320 minutes). Without it, the liveness probe kills the pod while it's still loading weights, and it restarts forever.\n- **readinessProbe** on `/health`: only route traffic after the model is loaded.\n- **Graceful shutdown:** `preStop` sleep (let endpoints update), then SIGTERM, and a `terminationGracePeriodSeconds` longer than your longest generation.\n- **Rollouts:** `maxUnavailable: 0, maxSurge: 1`. Never drop capacity, and accept that a rollout needs a spare GPU.\n- **PodDisruptionBudget:** stops node drains from evicting all replicas at once.\n\nA vLLM pod's lifecycle with correct probes:\n\n```mermaid\nstateDiagram-v2\n    [*] --> Pending: no free GPU node yet\n    Pending --> Starting: scheduled, image pulled\n    Starting --> Starting: startupProbe failing while weights load and CUDA graphs are captured (liveness not checked yet)\n    Starting --> Ready: /health OK\n    Ready --> NotReady: readinessProbe fails (removed from Service)\n    NotReady --> Ready: recovers\n    Ready --> Draining: scale-in or rollout (preStop sleep, then SIGTERM)\n    Draining --> [*]: in-flight streams finished (grace period)\n    Ready --> Restarting: livenessProbe fails repeatedly\n    Restarting --> Starting\n```\n\n### 1.5 Routing: why round-robin fails for LLMs\n\nClassic load balancers assume requests cost about the same. LLM requests vary **1000\u00d7** (10 vs 10,000 prompt tokens, 5 vs 2,000 output tokens), and replicas hold **state** (prefix caches).\n\n| Policy | Signal | Problem it solves | Weakness |\n|---|---|---|---|\n| Round-robin | none | \u2014 | ignores load and caches |\n| Least-connections / least-loaded | in-flight requests | uneven request cost | still ignores caches |\n| Engine-load-aware | `num_requests_waiting`, KV usage scraped from engines | real saturation | slightly stale metrics |\n| **Prefix/KV-cache-aware** | hash of the prompt prefix (or the engines' actual cache state) | prefix cache hits \u2192 TTFT and GPU savings | hot prefixes can overload one replica \u2192 needs **bounded load** |\n\nThe academy gateway (`platform/internal/gateway`) implements the first, second and fourth policies. Its prefix-aware router uses **rendezvous hashing** (removing a replica only remaps that replica's keys) plus a **bounded-load** spill. The Kubernetes **Gateway API Inference Extension** and llm-d standardize model-aware routing like this.\n\nHow the academy gateway's prefix-aware router picks a replica:\n\n```mermaid\nflowchart TB\n    IN[\"Request arrives\"] --> KEY[\"Routing key = first 256 characters of the prompt<br/>(system prompt, conversation history)\"]\n    KEY --> RANK[\"Rank healthy replicas by hash(key, replica)<br/>rendezvous hashing\"]\n    RANK --> TOP{\"Top replica's in-flight count<br/>\u2264 1.5 \u00d7 average + 1?\"}\n    TOP -->|yes| SEND[\"Send to the top replica<br/>its prefix cache likely holds this prompt\"]\n    TOP -->|no| SPILL[\"Spill to the next replica in rank order<br/>(bounded load)\"]\n    SEND --> ERR{\"Connection failed before<br/>any byte was sent?\"}\n    SPILL --> ERR\n    ERR -->|yes| RETRY[\"Retry once on the next replica\"]\n    ERR -->|no| STREAM[\"Stream tokens to the client;<br/>client disconnect cancels upstream\"]\n```\n\n### 1.6 Autoscaling on the right signal\n\nCPU utilization is meaningless for a GPU server, and GPU utilization (level 2) and memory (always ~90%) are misleading too. Scale on **work in the system**:\n- `vllm:num_requests_running + vllm:num_requests_waiting` per replica, against a target below `--max-num-seqs` (headroom).\n- `vllm:kv_cache_usage_perc` for long-context traffic.\n- Or directly on SLO burn (TTFT p95), which is more reactive but noisier.\n\nScaling **only** on `num_requests_waiting` oscillates: scale out, the queue drains to zero, desired replicas drop, scale in, the queue returns. **KEDA** turns a Prometheus query into an HPA metric.\n\n---\n\n## 2. Worked example: routing policies on the same fleet\n\nThree mock replicas (16 slots each, small prefix caches), 12 tenants each with a 2,000-token system prompt, Poisson 20 req/s, SLO TTFT \u2264 300 ms and TPOT \u2264 40 ms. Measured with the academy tools:\n\n| Policy | Prefix cache hit rate | SLO attained | Goodput |\n|---|---|---|---|\n| round-robin | 56% | 59.7% | 10.3 req/s |\n| least-loaded | 49% | 51.7% | 8.9 req/s |\n| **prefix-aware** | **81%** | **85.7%** | **14.8 req/s** |\n\nSame hardware, same traffic. **Routing alone improved goodput by 44%.** Least-loaded did *worse* than round-robin here, because spreading every tenant everywhere thrashes each replica's cache. Prefix-aware routing gave each replica a subset of tenants whose prompts fit in its cache. Look at the backend counts too (`replica-1=150 replica-2=49 replica-3=101`): prefix routing is deliberately uneven, and the bounded-load check stops it from overloading one replica.\n\nReproduce it:\n\n```bash\ncd platform && go build -o bin/ ./cmd/...\nfor i in 1 2 3; do bin/mockllm -addr :800$i -name replica-$i -max-num-seqs 16 -cache-blocks 1000 & done\nbin/gateway -addr :9000 -policy prefix -backends http://localhost:8001,http://localhost:8002,http://localhost:8003 &\nbin/loadgen -url http://localhost:9000 -rate 20 -n 300 -prompt-min 50 -prompt-max 200 \\\n  -output-min 32 -output-max 64 -prefix-tokens 2000 -prefix-groups 12 -slo-ttft 300ms -slo-tpot 40ms\n# restart the mocks (fresh caches) and repeat with -policy round-robin and -policy least-loaded\n```\n\n## 3. Labs\n\n| Lab | Files | Needs |\n|---|---|---|\n| 10a. Fleet + gateway + Prometheus on Docker Compose | `labs/compose/` | Docker |\n| 10b. The same fleet on kind with DNS discovery | `labs/k8s-local/mock-fleet.yaml` | Docker + kind |\n| 10c. KEDA autoscaling on concurrency | `labs/k8s-local/keda-scaledobject.yaml` | 10b + Helm |\n| 10d. vLLM on a GPU cluster with correct probes/shm/PDB | `labs/k8s-gpu/vllm.yaml` | GPU node |\n| 10e. GPU smoke test | `labs/k8s-gpu/gpu-test-pod.yaml` | GPU node |\n| 10f. Time-slicing | `labs/k8s-gpu/time-slicing-config.yaml` | GPU Operator |\n\n**10a**\n\n```bash\ncd levels/10-containers-and-kubernetes/labs/compose\ndocker compose up --build\ncd ../../../../platform && go run ./cmd/loadgen -url http://localhost:9000 -rate 15 -n 300 -prefix-tokens 2000 -prefix-groups 12\n# Prometheus at http://localhost:9090:  sum by (instance) (vllm:num_requests_running)\nPOLICY=round-robin docker compose up -d gateway   # switch policy and compare\n```\n\n**10b + 10c**\n\n```bash\nkind create cluster --name academy\ndocker build -t academy/mockllm:dev --build-arg CMD=mockllm platform/ && kind load docker-image academy/mockllm:dev --name academy\ndocker build -t academy/gateway:dev --build-arg CMD=gateway platform/ && kind load docker-image academy/gateway:dev --name academy\nkubectl apply -f levels/10-containers-and-kubernetes/labs/k8s-local/mock-fleet.yaml\nkubectl -n inference port-forward svc/gateway 9000:9000 &\ngo run ./platform/cmd/loadgen -url http://localhost:9000 -rate 10 -n 300\nkubectl -n inference scale deploy/engine --replicas 5     # watch the gateway log discover the new pods\n# then install Prometheus + KEDA (commands in keda-scaledobject.yaml) and apply it; drive load and watch:\nkubectl -n inference get hpa,pods -w\n```\n\nQuestions to answer:\n1. In 10b, kill an engine pod mid-load (`kubectl delete pod`). How many requests fail? Which ones? (Compare with level 14's chaos lab.)\n2. In 10c, what happens to autoscaling if you change the query to only `num_requests_waiting`? Reproduce the oscillation.\n3. In 10d, remove the `startupProbe` and use a liveness probe with `initialDelaySeconds: 30`. What happens on a cold node?\n\n## 4. Check yourself\n\n<details><summary>1. Why taint GPU nodes?<\/summary>\nSo that only pods that explicitly tolerate the taint (GPU workloads) are scheduled there. Otherwise ordinary pods fill expensive GPU nodes and block GPU pods.<\/details>\n\n<details><summary>2. Why does prefix-aware routing need a bounded-load rule?<\/summary>\nA popular prefix (one big tenant) would send all its traffic to one replica, overloading it while others idle. Bounded load spills to the next-preferred replica past a threshold.<\/details>\n\n<details><summary>3. Why is \"pull weights from the HF Hub at pod start\" risky in production?<\/summary>\nIt's slow, it depends on an external service and its rate limits, it needs tokens inside pods, and it multiplies download traffic on every scale-out. Mirror weights to in-region object storage.<\/details>\n\n<details><summary>4. A vLLM rollout with `maxUnavailable: 1` on a 2-replica deployment drops TTFT SLOs every deploy. Why, and what's the fix?<\/summary>\nFor several minutes of model loading, capacity halves. Use `maxUnavailable: 0, maxSurge: 1`. A new pod must be Ready before an old one is removed, which means planning for one spare GPU during rollouts.<\/details>\n\n## 5. Going deeper\n- NVIDIA GPU Operator and k8s-device-plugin docs (time-slicing, MIG); Kubernetes DRA docs\n- KEDA Prometheus scaler; HPA scaling behavior policies\n- Kubernetes Gateway API Inference Extension; llm-d; vLLM production-stack (router + Helm)\n- KServe, LeaderWorkerSet (multi-node serving, level 12)\n\n**Next \u2192 [Level 11: AWS foundations for GPU inference](#level-11)**\n"}, {"id": "level-11", "title": "AWS foundations for GPU inference", "path": "levels/11-aws-foundations/README.md", "num": "11", "tier": "AWS", "md": "# Level 11: AWS foundations for GPU inference\n\n> On AWS, the first obstacles aren't technical: GPU quota, GPU capacity, and choosing the right instance. Then come storage, networking and identity.\n\n**You will:** pick GPU instances from first principles, get quota and capacity, store weights for fast starts, and set up networking and IAM the way production systems do.\n**Time:** 3\u20134 hours \u00b7 **Hardware:** an AWS account (no GPU spend needed for most of this level)\n\n---\n\n## 1. Concepts\n\n### 1.1 GPU instance families\n\n| Family | GPU | GPUs/instance | GPU memory | GPU interconnect | Good for |\n|---|---|---|---|---|---|\n| g4dn | T4 16 GB | 1\u20138 | 16 GB each | PCIe | small/legacy models, cheap experiments |\n| **g5** | A10G 24 GB | 1, 4, 8 | 24 GB each | PCIe | 7\u20138B BF16; widely available |\n| **g6** | L4 24 GB | 1, 4, 8 | 24 GB each | PCIe | 7\u20138B, **FP8**, cost-efficient |\n| **g6e** | L40S 48 GB | 1, 4, 8 | 48 GB each | PCIe | 8\u201334B, 70B FP8 on 4 GPUs, long context |\n| p4d / p4de | A100 40 / 80 GB | 8 | 320 / 640 GB | NVLink + EFA | 70B BF16 with TP |\n| **p5** | H100 80 GB | 8 | 640 GB | NVLink + EFA | large models, high throughput |\n| p5e / p5en | H200 141 GB | 8 | 1,128 GB | NVLink + EFA | 70B on fewer GPUs, 405B, long context |\n| p6-b200 | B200 | 8 | ~1.4 TB | NVLink + EFA | frontier scale |\n| **inf2** | AWS Inferentia2 | 1\u201312 chips | 32 GB per chip | NeuronLink | cost-efficient serving via the Neuron SDK |\n\nNotes:\n- Within one family, the instance size mostly changes vCPU, RAM and GPU count (e.g. g6.xlarge vs g6.2xlarge are both 1 L4). Give vLLM enough CPU for tokenization and scheduling: 4\u20138 vCPUs per GPU is a sensible floor.\n- **SageMaker** uses the same hardware with an `ml.` prefix (`ml.g6.2xlarge`) and a different, usually higher, price.\n- **Inferentia/Trainium** need models compiled with the AWS Neuron SDK. vLLM has a Neuron backend, and AWS provides Neuron containers. They're worth evaluating for steady, high-volume workloads on supported models.\n- **Prices change and vary by region.** Get current numbers from the EC2 and SageMaker pricing pages and pass them to the course tools. Don't hard-code them.\n\n### 1.2 Quotas: the day-1 blocker\n\nNew accounts often have **zero** GPU quota. EC2 quotas are measured in **vCPUs per instance-family group**:\n\n| Quota (Service Quotas \u2192 EC2) | Covers | Code |\n|---|---|---|\n| Running On-Demand G and VT instances | g4dn, g5, g6, g6e | `L-DB2E81BA` |\n| Running On-Demand P instances | p4d, p5, p5e ... | `L-417A185B` |\n| All G and VT Spot Instance Requests / All P Spot Instance Requests | Spot | (separate codes) |\n\nOne `g6.2xlarge` = 8 vCPUs; one `p5.48xlarge` = 192 vCPUs. **Request quota days before you need it.** SageMaker has its **own** per-instance-type quotas (e.g. \"ml.g6.2xlarge for endpoint usage\").\n\n```bash\naws service-quotas get-service-quota --service-code ec2 --quota-code L-DB2E81BA --query Quota.Value\n```\n\n### 1.3 Capacity: quota is not capacity\n\nQuota is permission. Capacity is whether AWS has the GPUs in that AZ right now. For scarce GPUs (H100/H200):\n\n| Option | What | Use |\n|---|---|---|\n| On-Demand | pay per second, no commitment | g-family usually fine; p-family can be unavailable |\n| **On-Demand Capacity Reservations (ODCR)** | reserve capacity in an AZ, pay whether used or not | production baseline |\n| **EC2 Capacity Blocks for ML** | book GPU clusters for a fixed window (days to weeks) | load tests, launches, multi-node experiments |\n| Savings Plans / Reserved | price discount for commitment | steady baseline (discount, not a capacity guarantee) |\n| Spot | spare capacity, deep discount, 2-minute interruption notice | stateless replicas behind a router with N+1 headroom; batch jobs |\n\nDesign for **multiple instance types and AZs**: let Karpenter pick from `g6`/`g6e`/`g5`. That flexibility is what makes Spot and scarce on-demand usable.\n\n### 1.4 Storage for model weights\n\n| Option | Read throughput (order of magnitude) | Notes |\n|---|---|---|\n| S3 (in-region, parallel ranged GETs) | GB/s with enough parallelism | the source of truth; versioned; use `aws s3 sync`, s5cmd, or model streamers |\n| Mountpoint for Amazon S3 (CSI driver) | high for sequential reads | mount a bucket as a read-only filesystem |\n| Instance store NVMe (g5/g6/g6e/p) | several GB/s | fastest local cache; erased when the instance stops |\n| EBS gp3 | up to 1 GB/s with provisioned throughput | root volume; baking weights into a snapshot works |\n| FSx for Lustre (S3-linked) | very high, shared | many nodes reading the same large models |\n\nRule: keep weights in **S3 in the same region as the GPUs**, and cache them on local NVMe or a shared filesystem. Never make production scale-out depend on the HF Hub.\n\n### 1.5 Networking\n\n- Run inference in **private subnets** and expose it through an **internal** load balancer behind your API layer.\n- **VPC endpoints** (S3 gateway endpoint; interface endpoints for ECR, STS, CloudWatch) keep image pulls and weight downloads off NAT gateways. That's faster, and NAT data charges on 100 GB pulls add up.\n- **Load balancer idle timeout:** the ALB default is 60 s. Streaming keeps the connection busy, but a slow first token or a non-streaming long generation can hit it. Raise it (level 12).\n- **EFA** (Elastic Fabric Adapter): OS-bypass networking for NCCL across nodes on p4d/p5. You need it for multi-node tensor/pipeline parallelism, and you need placement groups (or Capacity Blocks) to keep nodes close.\n\n### 1.6 Identity: no keys in pods\n\n- **EKS Pod Identity** (or IRSA) gives a Kubernetes service account an IAM role. Pods get short-lived credentials automatically, so you never put access keys in a Secret.\n- Minimum policies: read-only S3 on the model bucket, ECR pull, CloudWatch logs.\n- Keep the Hugging Face token in **AWS Secrets Manager** (synced via External Secrets / the Secrets Store CSI driver), or avoid it entirely by mirroring weights to S3.\n\n---\n\n## 2. Worked example: choosing instances for the course's running example\n\n```bash\npython3 levels/11-aws-foundations/labs/pick_instance.py --params 8 --context 8192 --concurrency 32\npython3 levels/11-aws-foundations/labs/pick_instance.py --params 70 --dtype fp8 --context 8192 --concurrency 64\n```\n\nFor **Llama 3.1 8B, BF16, 8k context, 32 concurrent users per replica**: a single L4 or A10G fits the weights but holds only a few 8k-token sequences. Options: (a) FP8 weights + FP8 KV on g6; (b) g6e (48 GB) BF16; (c) shorter `max-model-len`. For **70B FP8, 64 concurrent users**: 4\u00d7 L40S (g6e.12xlarge) fits but with little KV room. H100/H200 (p5/p5e) hold far more sequences per replica, so price per *sequence-hour* decides. Pass `--prices-file` with current prices to rank options by cost.\n\n## 3. Labs\n\n1. **Quota:** check your G and P quotas in two regions with the CLI command above. File a request for 16 G-family vCPUs in your course region.\n2. **Sizing:** run `pick_instance.py` for 8B, 70B and 405B (FP8). For each, write one sentence explaining the winning shape and its runner-up.\n3. **Prices:** create `prices.json` from the EC2 pricing page for your region (e.g. `{\"g6.2xlarge\": <price>, \"g6e.2xlarge\": <price>, ...}`) and rerun with `--prices-file prices.json`.\n4. **Weights to S3:** mirror a model to your bucket once:\n   ```bash\n   pip install -U \"huggingface_hub[cli]\"\n   huggingface-cli download meta-llama/Llama-3.1-8B-Instruct --local-dir ./llama-3.1-8b\n   aws s3 sync ./llama-3.1-8b s3://YOUR-BUCKET/models/Llama-3.1-8B-Instruct/\n   ```\n   Time a download back onto an EC2 instance in the same region (`time aws s3 sync ...`) and compare it with HF Hub download speed.\n5. **IAM:** write the least-privilege IAM policy a vLLM pod needs to read only that prefix of the bucket.\n\n## 4. Check yourself\n\n<details><summary>1. You have 64 vCPUs of G quota. How many g6.2xlarge and how many g6.12xlarge can you run?<\/summary>\n8 \u00d7 g6.2xlarge (8 vCPU each), or 1 \u00d7 g6.12xlarge (48 vCPU) plus 2 \u00d7 g6.2xlarge.<\/details>\n\n<details><summary>2. Your p5 launch fails with InsufficientInstanceCapacity although quota is fine. What are your options?<\/summary>\nTry other AZs or regions, use a Capacity Block for the time window, buy an ODCR for steady needs, or re-plan onto available shapes (H200/L40S, or quantize to fit smaller GPUs).<\/details>\n\n<details><summary>3. Why put an S3 gateway endpoint in the VPC of a GPU cluster?<\/summary>\nWeight downloads (tens to hundreds of GB per scale-out) then go directly to S3 instead of through NAT gateways. That's faster and avoids per-GB NAT charges.<\/details>\n\n## 5. Going deeper\n- EC2 accelerated computing instance docs; EC2 Capacity Blocks for ML; On-Demand Capacity Reservations\n- EKS best practices guide: AI/ML section (compute, networking, storage)\n- AWS Neuron SDK documentation (Inferentia2/Trainium, vLLM on Neuron)\n\n**Next \u2192 [Level 12: vLLM on EKS](#level-12)**\n"}, {"id": "level-12", "title": "vLLM on EKS, end to end", "path": "levels/12-vllm-on-eks/README.md", "num": "12", "tier": "AWS GPU", "md": "# Level 12: vLLM on EKS, end to end\n\n> Everything so far comes together here: a production-shaped LLM service on Amazon EKS with GPU nodes that appear on demand, vLLM, a gateway with tenant budgets and prefix-aware routing, an internal ALB, autoscaling on the right signal, and SLO dashboards and alerts.\n\n**You will:** build the cluster, run Llama 3.1 8B on L4 GPUs, put the academy gateway in front, autoscale pods *and* GPU nodes, observe everything, load-test to your SLO, then scale up to 70B and multi-node.\n**Time:** 1\u20132 days \u00b7 **Hardware:** AWS (Tier 1: g6 instances; Tier 2 for the 70B/multi-node sections) \u00b7 **Cost guardrail:** run `./labs/cleanup.sh` at the end of every session.\n\n---\n\n## 1. Architecture\n\n```mermaid\nflowchart LR\n    CLIENT[\"Client inside the VPC<br/>or your API layer\"] --> ALB[\"Internal ALB<br/>idle timeout 600 s\"]\n    subgraph VPC[\"VPC \u00b7 private subnets in 2-3 AZs\"]\n        ALB --> GW[\"Gateway pods (Go, CPU nodes)<br/>API keys, token budgets<br/>prefix-aware routing\"]\n        GW -->|\"headless Service:<br/>one endpoint per pod\"| V1[\"vLLM pod<br/>Llama 3.1 8B, 1x L4\"]\n        GW --> V2[\"vLLM pod\"]\n        GW --> V3[\"vLLM pod\"]\n        PROM[\"Prometheus\"] -.->|scrape /metrics| V1\n        PROM -.-> GW\n        PROM -.->|DCGM| V2\n        PROM --> GRAF[\"Grafana + alerts\"]\n        PROM --> KEDA[\"KEDA\"]\n        KEDA -->|\"desired replicas\"| HPA[\"HPA on the vLLM Deployment\"]\n        HPA -->|\"new pods Pending\"| NP[\"GPU NodePool<br/>Auto Mode / Karpenter\"]\n        NP -->|\"launches g6 nodes\"| V3\n    end\n    S3[(\"S3: model weights<br/>same region\")] -->|\"init container or streamer\"| V1\n```\n\nHow a traffic spike turns into new capacity:\n\n```mermaid\nsequenceDiagram\n    participant U as Users\n    participant V as vLLM replicas\n    participant P as Prometheus\n    participant K as KEDA / HPA\n    participant N as GPU NodePool\n    participant E as EC2\n    U->>V: traffic rises\n    V->>P: running + waiting per replica above target\n    P->>K: query result (every 15 s)\n    K->>K: desired replicas = ceil(total / 48)\n    K->>N: new vLLM pods are Pending (no free GPU)\n    N->>E: launch a g6 instance\n    E-->>N: node Ready (1-3 min)\n    N-->>V: pod scheduled, then image pull, weights, CUDA graphs\n    V-->>U: new replica Ready, queue drains\n    Note over U,E: The SLO burns for this whole window,<br/>which is why warm headroom and fast cold starts matter\n```\n\nTwo autoscalers form a chain: **KEDA/HPA** adds vLLM *pods* when work per replica exceeds its target. The pods are Pending because no GPU is free, so the **NodePool** launches GPU *nodes* that fit them. When load drops, pods scale in and empty nodes are consolidated away.\n\n## 2. Two ways to build the cluster\n\n| | Path A: **EKS Auto Mode** (course default) | Path B: managed node groups (+ Karpenter) |\n|---|---|---|\n| Node provisioning | built-in (Karpenter-based), configured with `NodePool` | managed node groups or self-installed Karpenter |\n| NVIDIA driver + device plugin | **included and managed** for GPU instances | AL2023 NVIDIA AMI has the driver; you install the device plugin (Helm) |\n| Load balancer controller | built in (`eks.amazonaws.com/alb`) | install the AWS Load Balancer Controller |\n| Control over the AMI/OS | less | full |\n| Choose when | you want to focus on inference, not node plumbing | you need custom AMIs, specific drivers, or existing node tooling |\n\nPath A files: `labs/cluster/auto-mode-cluster.yaml` + `labs/manifests/01-gpu-nodepool.yaml`. Path B: `labs/cluster/managed-nodegroup-cluster.yaml` (read the device-plugin note at the top).\n\n## 3. Step by step\n\n`labs/deploy.sh` runs every step below in order. Read the steps first and run the script once you understand them.\n\n### Step 0: Prerequisites\n- Tools: `aws` CLI v2, `eksctl` (\u2265 0.195 for Auto Mode), `kubectl`, `helm`, `docker`.\n- **Quota:** \u2265 8 vCPUs of \"Running On-Demand G and VT instances\" in your region (level 11).\n- A Hugging Face token with the Llama 3.1 license accepted, or switch the model to `Qwen/Qwen2.5-7B-Instruct` (ungated).\n\n### Step 1: Cluster\n\n```bash\neksctl create cluster -f levels/12-vllm-on-eks/labs/cluster/auto-mode-cluster.yaml    # ~15-20 min\nkubectl get nodepools        # general-purpose, system (CPU)\n```\n\n### Step 2: GPU NodePool\n\n`01-gpu-nodepool.yaml` allows `g6` and `g6e` on-demand instances, taints them `nvidia.com/gpu:NoSchedule`, caps the pool at 8 GPUs (a **cost guardrail**: an autoscaling bug can't launch 100 GPUs), and only consolidates **empty** nodes so busy inference pods are never evicted to save money.\n\n```bash\nkubectl apply -f labs/manifests/00-namespace.yaml -f labs/manifests/01-gpu-nodepool.yaml\nkubectl -n inference create secret generic hf-token --from-literal=token=$HF_TOKEN\n```\n\n### Step 3: Observability first\n\nInstall it before the workload, so you see the first cold start:\n\n```bash\nhelm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace \\\n  -f labs/monitoring/kps-values.yaml\n# GPU metrics: NVIDIA DCGM exporter (on Path B, the GPU Operator can install it for you)\nhelm repo add gpu-helm-charts https://nvidia.github.io/dcgm-exporter/helm-charts\nhelm install dcgm gpu-helm-charts/dcgm-exporter -n monitoring \\\n  --set-json 'tolerations=[{\"key\":\"nvidia.com/gpu\",\"operator\":\"Exists\",\"effect\":\"NoSchedule\"}]' \\\n  --set serviceMonitor.enabled=true\n```\n\n### Step 4: vLLM\n\n```bash\nkubectl apply -f labs/manifests/02-vllm.yaml -f labs/monitoring/podmonitors.yaml -f labs/monitoring/alerts.yaml\nkubectl get nodeclaims -w                    # watch a g6 node being launched for the pending pod\nkubectl -n inference logs -f deploy/vllm     # weights download, KV cache size, CUDA graph capture\n```\n\nThings in `02-vllm.yaml` that come from earlier levels:\n\n| Setting | Why (level) |\n|---|---|\n| `--max-model-len=8192` | fit enough sequences in the L4's KV budget (6, 8) |\n| `--max-num-seqs=64`, `--enable-prefix-caching` | batching ceiling; reuse of system prompts (7, 8) |\n| `nodeSelector: instance-family g6` | an 8B BF16 model at 8k fits a 24 GB L4 (11) |\n| `startupProbe` with a 15-minute budget | cold start = node + image + weights + graphs (10) |\n| `maxUnavailable: 0, maxSurge: 1` + PDB | never lose capacity during rollouts or drains (10) |\n| `/dev/shm` memory volume | NCCL needs it once you use TP > 1 (3, 10) |\n| `preStop` sleep, 120 s grace period | in-flight streams finish before shutdown (10) |\n| headless Service `vllm-headless` | the gateway discovers pod IPs for prefix routing (10) |\n\n**Write down the cold-start breakdown** from the events and logs: node launch \u2192 image pull \u2192 weights \u2192 ready. It goes in your report, and step 7 shrinks it.\n\n### Step 5: Gateway and internal ALB\n\n```bash\n# build/push the gateway to ECR (deploy.sh does this), then:\nkubectl apply -f labs/manifests/03-gateway.yaml -f labs/manifests/04-ingress.yaml\nkubectl -n inference get ingress gateway     # internal ALB DNS name (reachable from inside the VPC)\n```\n\nThe ALB's **idle timeout is raised to 600 s**. With the 60 s default, any request whose first byte takes longer than a minute (long prompts under load, or non-streaming requests) gets a 504 from the load balancer, while vLLM keeps generating for a client that has gone. The gateway also sets `X-Accel-Buffering: no` and flushes every chunk, so no proxy buffers the token stream.\n\n### Step 6: Autoscaling\n\n`05-keda-autoscaling.yaml` scales on two signals and the HPA takes the higher:\n1. **Requests in the system per replica** (`running + waiting`) against a target of 48 (out of `max-num-seqs` 64). That leaves headroom so bursts queue briefly instead of breaking the TTFT SLO.\n2. **KV cache usage** against 80%, for long-context traffic that fills memory before it fills batch slots.\n\nIt scales up fast (2 pods per minute) and down slowly (1 pod per 5 minutes after a 10-minute window). A new replica takes minutes, so scaling in too eagerly causes cold-start storms.\n\n### Step 7: Faster cold starts (pick at least one)\n\n| Technique | How | Saves |\n|---|---|---|\n| Weights from S3 in-region | `07-s3-weights-initcontainer.yaml` + Pod Identity | HF download time and rate limits |\n| Model streaming | vLLM `--load-format runai_streamer` with an `s3://` model path (check your version's docs) | overlaps download and GPU load |\n| Image pre-pull / lazy loading | DaemonSet that pre-pulls the vLLM image on GPU nodes; SOCI lazy loading | image pull time |\n| Warm headroom | `minReplicaCount` \u2265 expected base load + 1; over-provisioning \"pause\" pods to keep a spare GPU node warm | node launch time |\n\nPod Identity for the S3 pattern:\n\n```bash\naws iam create-role --role-name vllm-s3-read --assume-role-policy-document '{\n  \"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"pods.eks.amazonaws.com\"},\n  \"Action\":[\"sts:AssumeRole\",\"sts:TagSession\"]}]}'\naws iam put-role-policy --role-name vllm-s3-read --policy-name read-models --policy-document '{\n  \"Version\":\"2012-10-17\",\"Statement\":[\n   {\"Effect\":\"Allow\",\"Action\":\"s3:ListBucket\",\"Resource\":\"arn:aws:s3:::YOUR-BUCKET\",\"Condition\":{\"StringLike\":{\"s3:prefix\":\"models/*\"}}},\n   {\"Effect\":\"Allow\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::YOUR-BUCKET/models/*\"}]}'\nkubectl -n inference create serviceaccount vllm\naws eks create-pod-identity-association --cluster-name inference-academy --namespace inference \\\n  --service-account vllm --role-arn arn:aws:iam::<ACCOUNT>:role/vllm-s3-read\n```\n\n### Step 8: Load test to your SLO\n\nFrom a pod or an instance in the VPC (or through `kubectl port-forward`):\n\n```bash\ngo run ./platform/cmd/loadgen -url http://<gateway> -api-key team-support -model llama-3.1-8b \\\n  -rate 4 -n 400 -prompt-min 256 -prompt-max 2048 -output-min 64 -output-max 512 \\\n  -prefix-tokens 1500 -prefix-groups 6 -slo-ttft 1s -slo-tpot 60ms\n```\n\nRun `levels/09-benchmarking-and-slos/labs/sweep.sh` against one replica to find **max goodput per replica**, then set the KEDA target from it. Then run a **5\u00d7 ramp** and watch Grafana (`labs/monitoring/grafana-dashboard.json`): queue \u2192 new pods Pending \u2192 NodeClaims \u2192 nodes Ready \u2192 pods Ready \u2192 queue drains. **How long did the SLO burn?** That's the number warm headroom has to cover.\n\n## 4. Scaling the model up\n\n**Llama 3.1 70B on one node.** Options (check with `infercalc` and `pick_instance.py`):\n\n| Shape | Config | Notes |\n|---|---|---|\n| g6e.12xlarge (4\u00d7 L40S, PCIe) | FP8 checkpoint, `--tensor-parallel-size 4`, `--max-model-len 8192` | fits; little KV room; PCIe all-reduce tax |\n| p4de.24xlarge (8\u00d7 A100 80 GB) | BF16, TP=8, or 2 replicas \u00d7 TP=4 | NVLink; FP8 weights run as weight-only on Ampere |\n| p5.48xlarge (8\u00d7 H100) | FP8, 4 replicas \u00d7 TP=2 | usually the best $/token at scale; capacity is scarce (Capacity Blocks) |\n\nChanges from `02-vllm.yaml`: request `nvidia.com/gpu: \"4\"` (or 2/8), add `--tensor-parallel-size`, raise `/dev/shm` and memory limits, widen the NodePool's instance families, and allow a longer startup budget (~140 GB to load).\n\n**Multi-node (405B).** `06-multinode-lws.yaml` uses a **LeaderWorkerSet**: one group = leader + workers on separate nodes, started together and restarted together, with Ray coordinating vLLM's workers. TP=8 inside each node over NVLink, PP=2 across nodes over **EFA**. Prerequisites: p5-class capacity (usually a Capacity Block), the EFA device plugin, and a NodePool for those instances. This is a Tier 2 lab; a recorded walkthrough is fine if you lack capacity.\n\n## 5. Operations checklist\n\n- [ ] GPU NodePool has a `limits.nvidia.com/gpu` cap, and consolidation is `WhenEmpty`\n- [ ] vLLM image and model revision pinned; upgrades canaried on one replica\n- [ ] startupProbe budget > worst-case cold start; `maxUnavailable: 0`; PDB present\n- [ ] ALB internal, idle timeout raised; streaming verified end to end through every proxy\n- [ ] KEDA targets derived from measured goodput per replica (level 9), not guessed\n- [ ] Dashboards: TTFT/ITL p50/p95, running/waiting, KV usage, prefix hit rate, tokens/s, GPU util/memory, per-tenant traffic\n- [ ] Alerts: SLO burn, sustained queueing, KV near full, GPU Xid errors, pods Pending > N minutes (capacity)\n- [ ] Weights in in-region S3; Pod Identity, no static keys; HF token not needed at runtime\n- [ ] `cleanup.sh` tested; budget alarms set in AWS Budgets\n\n## 6. Check yourself\n\n<details><summary>1. Load rises, KEDA raises desired replicas from 2 to 4, but TTFT stays bad for 6 minutes. Walk through what's happening.<\/summary>\nThe new pods are Pending until GPU nodes launch (1\u20133 min). Then come image pull, weights load and CUDA graph capture (several minutes) before they're Ready. Meanwhile the original replicas are saturated. Fixes: warm headroom, faster cold starts (step 7), and scaling earlier (lower targets).<\/details>\n\n<details><summary>2. Why not let Karpenter consolidate under-utilized GPU nodes?<\/summary>\nConsolidation evicts pods and moves them elsewhere. For vLLM that means killing in-flight generations and paying a multi-minute cold start to save a little money. Consolidate only empty nodes.<\/details>\n\n<details><summary>3. Why does the gateway discover pods through a headless Service instead of using the ClusterIP Service?<\/summary>\nA ClusterIP Service load-balances connections randomly (kube-proxy), which destroys prefix-cache affinity. The gateway needs individual pod endpoints to route a prefix to the same replica.<\/details>\n\n<details><summary>4. A non-streaming request with max_tokens=4000 returns 504 after exactly 60 s. What is it?<\/summary>\nThe ALB idle timeout (default 60 s). Raise it, and prefer streaming for long generations.<\/details>\n\n## 7. Going deeper\n- EKS user guide: Auto Mode, accelerated workloads, Pod Identity; EKS best practices: AI/ML\n- Karpenter docs (NodePools, disruption); KEDA Prometheus scaler\n- AWS Load Balancer Controller / Auto Mode ingress annotations\n- vLLM docs: Kubernetes deployment, production-stack Helm chart; LeaderWorkerSet docs\n- AI on EKS (awslabs) blueprints for inference\n\n**Next \u2192 [Level 13: SageMaker and managed options](#level-13)**\n"}, {"id": "level-13", "title": "SageMaker and managed options", "path": "levels/13-sagemaker/README.md", "num": "13", "tier": "AWS GPU", "md": "# Level 13: SageMaker and managed options\n\n> SageMaker runs the cluster for you. You give up some control and pay a premium per instance-hour, and in return there are no nodes, no autoscaler plumbing and no load balancer to operate. Learn exactly what it does so you can choose deliberately.\n\n**You will:** deploy the same vLLM + Llama 3.1 8B service to a SageMaker real-time endpoint with plain boto3, stream from it, autoscale it on concurrency, pack several models onto one endpoint with inference components, and know when to use Bedrock instead.\n**Time:** 4\u20136 hours \u00b7 **Hardware:** AWS with SageMaker quota for `ml.g6.2xlarge` (or `ml.g5.2xlarge`) endpoint usage\n\n---\n\n## 1. Concepts\n\n### 1.1 SageMaker inference options\n\n| Option | How it behaves | GPU? | Use for |\n|---|---|---|---|\n| **Real-time endpoint** | always-on instances behind an HTTPS API; autoscaling | yes | interactive LLM serving (this level) |\n
