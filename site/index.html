| Real-time + **inference components** | one endpoint, many models/copies bin-packed onto instances; per-model scaling; scale to zero | yes | many models or fine-tunes, spiky traffic |\n| **Asynchronous inference** | requests queued (S3 in/out), long timeouts, scale to zero | yes | long generations, batch-like interactive work |\n| **Batch transform** | offline job over an S3 dataset | yes | bulk offline inference |\n| Serverless inference | per-request, scale to zero | **no** (CPU only) | small non-LLM models |\n\n### 1.2 What a SageMaker deployment is\n\n```mermaid\nflowchart LR\n    subgraph MODEL[\"Model\"]\n        IMG[\"Container image (ECR)\"]\n        ENV[\"Environment variables<br/>MODEL_ID, VLLM_ARGS\"]\n        DATA[\"Optional model data<br/>S3 to /opt/ml/model\"]\n    end\n    subgraph CFG[\"EndpointConfig\"]\n        VAR[\"Production variant<br/>instance type and count<br/>health-check and download timeouts\"]\n    end\n    subgraph EP[\"Endpoint (billable)\"]\n        INST[\"Running instances\"]\n        LB[\"Managed load balancer<br/>HTTPS API, SigV4 auth\"]\n    end\n    MODEL --> CFG --> EP\n```\n\nThe container contract, as SageMaker uses it:\n\n```mermaid\nsequenceDiagram\n    participant SM as SageMaker\n    participant C as Your container (vLLM)\n    participant U as Caller (boto3)\n    SM->>C: docker run image serve\n    C->>C: vllm serve MODEL --host 0.0.0.0 --port 8080\n    loop until healthy or the startup timeout\n        SM->>C: GET /ping\n        C-->>SM: 200 once the model is loaded\n    end\n    SM-->>U: endpoint InService\n    U->>SM: InvokeEndpointWithResponseStream (SigV4)\n    SM->>C: POST /invocations (OpenAI chat payload)\n    C-->>SM: SSE token stream\n    SM-->>U: PayloadPart events\n```\n\n**The container contract:** SageMaker runs your image with the argument `serve`, health-checks `GET /ping` and sends traffic to `POST /invocations`, both on **port 8080**. vLLM's OpenAI server implements `/ping` and `/invocations` itself. The academy's BYOC image (`labs/byoc/`) only sets the port, the host and the model location.\n\n### 1.3 Three ways to get vLLM onto SageMaker\n\n| Approach | What you manage | Notes |\n|---|---|---|\n| **BYOC: stock vLLM image + tiny entrypoint** (this level) | the image (pin the vLLM version) | full control and transparency; same engine and flags as EKS |\n| AWS **LMI** (Large Model Inference) containers | environment variables (`HF_MODEL_ID`, `OPTION_*`) | AWS-maintained; vLLM (and other) backends; check the LMI docs for the current image tags and option names |\n| AWS **vLLM Deep Learning Container** for SageMaker | environment variables (vLLM flags exposed as `SM_VLLM_*`) | AWS-maintained vLLM build; check the AWS DLC docs for image URIs and variables |\n\nThe BYOC route teaches the contract and keeps EKS and SageMaker on the **same engine version**, so benchmark comparisons are fair.\n\n### 1.4 Scaling\n\n- **Instance autoscaling** via Application Auto Scaling, target tracking on **concurrent requests per model/copy**. The high-resolution variants report every 10 s, so scaling reacts faster than with 1-minute invocation metrics.\n- **Inference components** scale *copies* of each model and (with managed instance scaling) the instances under them, including **scale to zero** for components.\n- New instances still take minutes (instance launch, image pull, weights, CUDA graphs). Startup tuning (container caching, model data in S3, smaller images) matters as much as on EKS.\n\n### 1.5 SageMaker vs EKS vs Bedrock\n\n| | EKS + vLLM | SageMaker + vLLM | Amazon Bedrock |\n|---|---|---|---|\n| You operate | cluster, nodes, autoscaling, LB, observability | container + config | nothing (API) |\n| Billing | EC2 instance-hours | ml.* instance-hours (premium) | per token (or provisioned throughput) |\n| Control over engine and flags | full | full (BYOC) | none |\n| Custom/fine-tuned models | any | any | Custom Model Import for supported architectures; fine-tuning for some models |\n| Routing / gateway customization | full (level 10) | limited (built-in routing strategies) | none |\n| Best when | high volume, platform team in place, need control | small team, a handful of models, want managed ops | standard models, variable volume, fastest time to production |\n\n**SageMaker HyperPod** sits between EKS and SageMaker. It's resilient GPU clusters orchestrated with EKS (or Slurm), with tooling for deploying inference on them. Consider it when you want EKS-style control with managed cluster health and node recovery.\n\n---\n\n## 2. Worked example: the same service, two platforms\n\n| Step | EKS (level 12) | SageMaker (this level) |\n|---|---|---|\n| Capacity | quota + NodePool | quota for `ml.g6.2xlarge` endpoint usage |\n| Engine | `vllm/vllm-openai:v0.11.0` | the same image + 8-line entrypoint |\n| Config | container `args` | `VLLM_ARGS` env var |\n| Exposure | internal ALB + gateway | SageMaker HTTPS endpoint (IAM/SigV4) |\n| Autoscaling | KEDA on running+waiting per replica | target tracking on concurrent requests per model |\n| Observability | Prometheus/Grafana (vLLM metrics) | CloudWatch endpoint metrics + container logs (vLLM `/metrics` isn't scraped for you) |\n| Cold start | node + image + weights | instance + image + weights (similar) |\n\n## 3. Labs\n\nPrerequisites: a SageMaker execution role with ECR pull, CloudWatch Logs and (optionally) S3 read on your model bucket, plus endpoint quota.\n\n```bash\ncd levels/13-sagemaker/labs\n# 13a. image\nIMAGE=$(./byoc/build_push.sh | tail -1)\n# 13b. deploy (10-20 min for the first InService)\npython3 deploy.py --image-uri \"$IMAGE\" --role-arn arn:aws:iam::<acct>:role/<SageMakerExecRole> \\\n  --model-id meta-llama/Llama-3.1-8B-Instruct --hf-token \"$HF_TOKEN\"\n#   better: ship weights from S3 (mirrored in level 11) and drop the token:\n#   --model-data-s3 s3://YOUR-BUCKET/models/Llama-3.1-8B-Instruct/\n# 13c. call it\npython3 invoke.py --name academy-llama-8b\n# 13d. autoscale on concurrency\npython3 autoscale.py --name academy-llama-8b --min 1 --max 3 --target 32\n# 13e. (optional, 4-GPU instance) two models packed on one endpoint\npython3 inference_components.py --image-uri \"$IMAGE\" --role-arn ... --hf-token \"$HF_TOKEN\"\n# ALWAYS\npython3 cleanup.py --prefix academy-\n```\n\nAssignments:\n1. **Cold start:** from the CloudWatch logs (`/aws/sagemaker/Endpoints/academy-llama-8b`), break down time to InService. Compare it with level 12's EKS breakdown.\n2. **Latency overhead:** compare TTFT and ITL measured by `invoke.py` with the same model on EKS (through the ALB) at low load. How much does SageMaker's routing layer add?\n3. **Load test:** SageMaker endpoints need SigV4-signed requests, so the academy loadgen can't call them directly. Write a small Python load generator with boto3 and threads (open loop, Poisson arrivals, streaming TTFT), or run the gateway with a SigV4-signing backend as a stretch goal. Find max goodput per instance and compare with EKS.\n4. **Cost:** plug both platforms' measured goodput and current prices into `levels/14-production-operations/labs/cost_compare.py`.\n\n## 4. Check yourself\n\n<details><summary>1. What three resources make up a SageMaker deployment, and which one do you change to roll out a new model version?<\/summary>\nModel, EndpointConfig, Endpoint. Create a new Model and EndpointConfig, then `update_endpoint` to point at the new config. SageMaker performs a blue/green swap.<\/details>\n\n<details><summary>2. Your endpoint fails with \"health check did not pass\" after ~10 minutes, but the same image works on EKS. What should you check?<\/summary>\n`ContainerStartupHealthCheckTimeoutInSeconds` (big models need longer), that vLLM listens on 0.0.0.0:8080, that `/ping` exists in your vLLM version, and that the model download had time to finish (`ModelDataDownloadTimeoutInSeconds`). Then read the CloudWatch container logs.<\/details>\n\n<details><summary>3. When would you choose Bedrock over both EKS and SageMaker?<\/summary>\nWhen a supported foundation model meets your quality needs, volume is variable or modest, and time to production and zero operations matter more than per-token cost at high volume or deep control over the engine.<\/details>\n\n## 5. Going deeper\n- SageMaker docs: real-time endpoints, inference components, autoscaling (including scale to zero), asynchronous inference\n- LMI container docs (DJL Serving); AWS Deep Learning Containers for vLLM\n- SageMaker HyperPod docs; Amazon Bedrock Custom Model Import\n\n**Next \u2192 [Level 14: Production operations](#level-14)**\n"}, {"id": "level-14", "title": "Production operations", "path": "levels/14-production-operations/README.md", "num": "14", "tier": "Laptop", "md": "# Level 14: Production operations\n\n> Serving one model to one load test is a project. Running it for a year (upgrades, failures, cost reviews, many tenants) is a platform.\n\n**You will:** choose between EKS, SageMaker and APIs using numbers; ship model changes safely; design for GPU failure modes; run a chaos drill; secure the stack; and run offline batch inference cheaply.\n**Time:** 4\u20136 hours \u00b7 **Hardware:** laptop for the labs; your level 12/13 deployments for the stretch goals\n\n---\n\n## 1. Choosing a platform with numbers\n\n```bash\npython3 levels/14-production-operations/labs/cost_compare.py --tokens-per-day 200e6 --peak-to-avg 3 \\\n  --replica-tok-s 2500 --eks-instance-hour <price> --sm-instance-hour <price> --api-per-mtok <price>\n```\n\nSample output (illustrative inputs; use your measured goodput and current prices):\n\n```\noption                   $/month  $/1M tok  notes\nEKS + vLLM                 2,644     0.435  peak 4 replicas, avg 2.8\nSageMaker + vLLM           2,947     0.485  peak 4 replicas, avg 3.0\nToken-priced API           3,040     0.500  no capacity to manage\nEKS becomes cheaper than the API above ~174M output tokens/day (with these inputs).\n```\n\nThe structural lessons are more durable than the specific numbers:\n- **Self-hosting is a fixed cost sized for peak.** APIs are a variable cost. Low or spiky volume favors APIs; high, steady volume favors self-hosting.\n- **`replica-tok-s` is the most important input.** That's goodput *at your SLO* (level 9), not the marketing tokens/s. A 2\u00d7 improvement from routing, quantization or batching (levels 7 and 10) halves the self-hosted cost.\n- **Engineer time** isn't in the table, and it dominates at small scale.\n\n## 2. Shipping model changes safely\n\nA \"model change\" is any of: new weights, new quantization, new engine version, new flags, new chat template. Each one can change quality, latency or memory.\n\n1. **Offline eval gate:** run your task-specific eval set (plus a safety set) on the candidate. Block on regressions beyond a threshold.\n2. **Performance gate:** run the level 9 sweep. Block if goodput at SLO drops or memory headroom shrinks.\n3. **Shadow traffic:** mirror a sample of production requests to the candidate and compare outputs and latency without serving them.\n4. **Canary:** route 1\u20135% of traffic (by tenant or by hash) to the new version. Watch SLOs, error rates and user feedback.\n5. **Progressive rollout, with automatic rollback** on SLO burn.\n6. Keep the previous version **warm** until the new one has seen peak traffic.\n\nVersion everything together: `model revision + quantization + engine version + flags + chat template`. A \"model\" in your registry is that whole tuple.\n\n```mermaid\nflowchart LR\n    C[\"Candidate:<br/>weights + quantization + engine version + flags + chat template\"] --> E{\"Offline eval gate<br/>task + safety sets\"}\n    E -->|regression| X[\"Reject\"]\n    E -->|pass| P{\"Performance gate<br/>goodput at SLO, memory headroom\"}\n    P -->|regression| X\n    P -->|pass| SH[\"Shadow traffic<br/>compare outputs and latency\"]\n    SH --> CA[\"Canary 1-5%\"]\n    CA --> M{\"SLOs and errors<br/>healthy?\"}\n    M -->|no| RB[\"Automatic rollback<br/>previous version still warm\"]\n    M -->|yes| PR[\"Progressive rollout to 100%\"]\n```\n\n## 3. Failure modes and what to do about them\n\n| Failure | Symptom | Detection | Mitigation |\n|---|---|---|---|\n| GPU hardware fault (Xid 48/79, ECC) | pod crash, CUDA errors, NaNs | DCGM Xid/ECC metrics, node events | cordon and drain node; replace instance; N+1 capacity |\n| GPU OOM | engine crash on long prompts | crash loops, logs | correct `max-model-len`, admission limits, gateway max-tokens caps |\n| KV pressure / preemption | latency spikes, throughput collapse | `kv_cache_usage_perc` near 1, preemption counters | scale on KV usage; FP8 KV; route long context separately |\n| Stuck / very long requests | slots held for minutes | e2e latency tail, running count without tokens | server-side max_tokens and timeouts; cancellation on disconnect (gateway) |\n| NCCL hang (TP/multi-node) | engine alive but no output | liveness probe that **generates a token**, not just `/health` | restart the group together (LWS); check EFA/NCCL config |\n| Replica death mid-stream | truncated responses | client error counters (streams without `[DONE]`) | retry only **before** the first byte; clients retry idempotent requests |\n| Cold-start storm | many pods loading at once, TTFT burn | pods Pending/not Ready, queue depth | warm headroom, slower scale-in, faster loading |\n| Capacity unavailable | pods Pending, NodeClaims failing | Pending duration alert | multiple instance types/AZs; reservations; spill to another region/provider |\n| Spot interruption | 2-minute notice, node drained | interruption events | stateless replicas, N+1, drain gracefully, mix on-demand baseline |\n\n**Health checks that test generation:** `/health` says the process is up. A synthetic probe that asks for 1 token every 30 s tells you the GPU path works. Run it from outside the pod (a blackbox exporter or a canary job) and alert on it.\n\nWhat a client sees when a replica dies, depending on timing:\n\n```mermaid\nsequenceDiagram\n    participant C as Client\n    participant G as Gateway\n    participant R1 as Replica 1\n    participant R2 as Replica 2\n    C->>G: request A\n    G->>R1: forward\n    R1--xG: connection refused (replica is dead)\n    G->>R2: retry (nothing was sent to the client yet)\n    R2-->>G: tokens\n    G-->>C: complete answer for A\n    C->>G: request B\n    G->>R1: forward (before the crash)\n    R1-->>G: first tokens\n    G-->>C: first tokens of B\n    R1--xG: replica crashes mid-stream\n    G-->>C: stream ends without [DONE]\n    Note over C,G: The gateway cannot retry B because the client<br/>already has tokens. The client sees an error and decides.\n```\n\n## 4. Security\n\n- **Model supply chain:** load **safetensors** only. Pickle-based checkpoints can execute code when loaded. Pin model revisions (commit hashes) and mirror approved models to your own S3.\n- **`trust_remote_code`:** some models ship custom Python. Enabling it runs that code in your pod. Review it, or avoid such models.\n- **Tenant isolation:** API keys per tenant, token budgets (the gateway), per-tenant metrics and logs. Never put one tenant's data in another tenant's prefix-cache-visible prompts. Separate pools or MIG for strict isolation.\n- **Network:** private subnets, internal load balancers, NetworkPolicies so only the gateway reaches vLLM pods. vLLM has no auth of its own, or only a simple `--api-key`.\n- **Prompt injection, data leakage and content safety** are application-layer concerns (guardrails, input/output filters, tool sandboxing). The platform's job is to give the application hooks (pre/post-processing in the gateway) and audit logs.\n- **Logging:** prompts and outputs may contain personal data. Decide retention deliberately, and redact before sending to shared logging.\n\n## 5. Offline and batch inference\n\nEvals, labeling, embeddings, synthetic data. There's no latency SLO, only throughput, cost and completion:\n- Use the engine's **offline API** (level 8's `offline_batch.py`) or a batch job against a dedicated server at high `max-num-seqs`.\n- Run on **Spot** or idle reserved capacity; **checkpoint progress** (write results per shard to S3, resume from the last completed shard).\n- Sort or bucket prompts by length and share prefixes, which gives better batching and cache hits.\n- Managed alternatives: SageMaker batch transform, provider batch APIs (often discounted for 24-hour turnaround).\n\n## 6. Labs\n\n```bash\ncd levels/14-production-operations/labs\npython3 cost_compare.py                     # then rerun with YOUR measured goodput and prices\n./chaos.sh                                  # kill a replica mid-load on the laptop fleet\n```\n\nSample `chaos.sh` result:\n\n```\n== Drill: kill replica-2 five seconds into the run\n   [chaos] replica-2 killed at t=5s\nRequests: 120  errors: 1  wall: 17.7s\nSLO (TTFT<=500ms, TPOT<=50ms): 119/120 met (99.2%)  goodput 6.74 req/s\nBackends: replica-1=58 replica-2=10 replica-3=51\n```\n\nOne stream that was in flight on replica-2 was **truncated**. The load generator counts that as an error, not a fast success. New requests failed over within one health-check interval (and the gateway's pre-first-byte retry hid even the ones that were sent to the dead replica).\n\nAssignments:\n1. **Runbook:** answer the four questions `chaos.sh` prints. Write a one-page runbook for \"replica died\" and one for \"GPU Xid error on a node\".\n2. **N+1 capacity:** rerun `chaos.sh` at a rate near the fleet's knee (level 9). Does losing one replica break the SLO? What `minReplicaCount` follows from that?\n3. **Rollout design:** write the pipeline (gates, canary %, rollback triggers) for moving the production model from BF16 to FP8 weights.\n4. **Stretch (EKS):** inject a failure in your level 12 cluster: delete a GPU node with `kubectl delete node` plus terminate the instance. Time detection \u2192 replacement \u2192 SLO recovery on your dashboard.\n\n## 7. Check yourself\n\n<details><summary>1. Why shouldn't the gateway retry a request after streaming has started?<\/summary>\nThe client has already received tokens. A retry would duplicate or contradict output. Only retry before the first byte; afterwards, surface the error and let the client decide.<\/details>\n\n<details><summary>2. Your liveness probe hits /health and passes, yet the replica produces no tokens. What kind of probe catches this?<\/summary>\nA synthetic generation probe (request 1 token with a short timeout) that exercises the scheduler and the GPU path. Alert on it rather than restarting aggressively.<\/details>\n\n<details><summary>3. At what point does self-hosting beat a per-token API, structurally?<\/summary>\nWhen steady volume keeps provisioned GPUs well utilized at your SLO, so the fixed instance cost per token falls below the API price including your operations overhead. Spiky or low volume pushes the break-even far out.<\/details>\n\n## 8. Going deeper\n- Google SRE book: SLOs, error budgets, alerting on burn rate\n- NVIDIA DCGM docs (Xid errors, health checks); EKS node health monitoring / auto repair\n- OWASP Top 10 for LLM Applications (application-layer risks)\n- Hugging Face docs on safetensors and `trust_remote_code`\n\n**Next \u2192 [Level 15: Capstone and system design](#level-15)**\n"}, {"id": "level-15", "title": "Capstone and system design", "path": "levels/15-capstone-and-system-design/README.md", "num": "15", "tier": "AWS GPU", "md": "# Level 15: Capstone and system design\n\n> Build it, measure it, defend it. Then design systems ten times bigger on a whiteboard.\n\n**Time:** 1\u20133 weeks \u00b7 **Hardware:** Tier 1 for the capstone; none for the design studio\n\n---\n\n## Part A: Capstone, \"Support Copilot at scale\"\n\n### The brief\n\nA company wants a support assistant for **20 tenants** (business units). Each tenant has its own ~1,500-token system prompt and knowledge snippets. Traffic: **average 3 req/s, peak 10 req/s** during business hours; prompts 500\u20133,000 tokens; answers 100\u2013400 tokens. SLO: **p95 TTFT \u2264 1.0 s, p95 TPOT \u2264 60 ms, 99% of 5-minute windows**. Model: Llama 3.1 8B Instruct (or a justified alternative). Budget: as low as possible at that SLO.\n\n### Deliverables\n\n1. **Capacity plan (before touching AWS):** `infercalc` and `pick_instance.py` estimates of memory, concurrency per replica, replicas at peak, and $/month. One page.\n2. **Running system on EKS** (level 12): vLLM + academy gateway (tenant keys, token budgets, prefix-aware routing) + KEDA + GPU NodePool + dashboards + alerts.\n3. **The same model on SageMaker** (level 13) with autoscaling.\n4. **Benchmark report** (level 9 template):\n   - sweep per replica \u2192 max goodput at SLO\n   - full-system test at 3 and 10 req/s with a realistic tenant mix (`-prefix-groups 20`)\n   - a 3 \u2192 10 req/s ramp: time to recover the SLO\n   - routing comparison: round-robin vs prefix-aware (prefix-cache hit rate, TTFT, goodput)\n   - one optimization experiment of your choice: FP8 weights / FP8 KV / speculative decoding / chunked-prefill tuning, with a quality check\n5. **Chaos results** (level 14): replica loss and GPU node loss at peak, with the runbooks.\n6. **Cost comparison:** EKS vs SageMaker vs an API, using your measured goodput (`cost_compare.py`).\n7. **Design review (20 minutes):** justify each decision by the bottleneck it addresses, and say what you'd change at 100\u00d7 traffic.\n\n### Grading rubric\n\n| Area | Excellent looks like |\n|---|---|\n| Estimation | predictions within ~2\u00d7 of measurements; gaps explained |\n| Correct measurement | open-loop load, realistic distributions, distinct seeds, warm-up excluded, versions recorded |\n| SLO met at peak | yes, with headroom stated; N+1 shown by the chaos test |\n| Cost | $/1M tokens at SLO for both platforms; break-even vs API |\n| Operability | dashboards answer \"is it healthy, is it saturated, is it the GPU\"; alerts have runbooks |\n| Reasoning | every flag and replica count traced to a measurement or a formula |\n\n### Suggested schedule\n\n| Week | Focus |\n|---|---|\n| 1 | capacity plan; EKS stack up; per-replica sweep; dashboards |\n| 2 | full-system tests, routing comparison, autoscaling ramp, optimization experiment |\n| 3 | SageMaker deployment, chaos drills, cost comparison, report and review |\n\n---\n\n## Part B: System design studio\n\nUse this structure for every case (it also works as an interview framework):\n\n1. **Requirements:** users, traffic (avg/peak), prompt/output lengths, SLOs, quality bar, tenancy, compliance, budget.\n2. **Back-of-envelope:** tokens/s at peak \u2192 replicas (goodput per replica) \u2192 GPUs \u2192 $/month (level 6).\n3. **Architecture:** API/gateway, routing, engines, model storage, autoscaling, regions.\n4. **The bottleneck:** which of prefill / decode / KV memory / network / capacity dominates, and the optimization that targets it (level 7).\n5. **Failure modes and operations:** what breaks, how you know, what happens automatically (level 14).\n6. **Evolution:** what changes at 10\u00d7 and 100\u00d7.\n\n### Case 1: Consumer chat assistant, 10M daily active users\n*Hints:* convert DAU to peak tokens/s (sessions \u00d7 turns \u00d7 tokens, peak factor). Multi-region active-active with capacity reservations. Prefix caching of conversation history needs **session affinity** in routing. Tiered models (small model for easy queries, a router model). Disaggregated prefill/decode at this scale. Graceful degradation (shorter max_tokens, smaller model) under capacity loss.\n\n### Case 2: 500 fine-tuned LoRA adapters on one base model\n*Hints:* multi-LoRA serving (`--enable-lora`, `--max-loras`, `--max-lora-rank`). Adapters load into GPU memory, so adapter-aware routing keeps each adapter on a few replicas. Cold adapters load from S3 on demand (latency for the first request). Per-tenant quotas. Compare with merging popular adapters into dedicated deployments.\n\n### Case 3: Code completion (p95 end-to-end < 300 ms)\n*Hints:* small models (1\u20137B), short prompts with heavy prefix reuse (the open file), aggressive cancellation (most requests are superseded by the next keystroke, so cancellation must free the GPU immediately), speculative decoding / prompt-lookup decoding, regional deployment close to users, reject or truncate long contexts.\n\n### Case 4: RAG over a 50M-document corpus\n*Hints:* three different inference workloads: an **embedding** model (batch, throughput), a **reranker** (prefill-only, short outputs), and the **generator** (long prompts, prefill-heavy). Each needs different instance shapes and batching. Long retrieved contexts favor prefix caching of shared documents, chunked prefill and FP8 KV. Measure retrieval and generation latency separately.\n\n### Case 5: Nightly evaluation of 1B tokens at minimum cost\n*Hints:* offline engine API, Spot capacity with checkpointing, length bucketing, maximum `max-num-seqs`, the cheapest $/token GPU (not the fastest), a provider batch API as a baseline, a deadline-aware scheduler that falls back to on-demand if Spot is scarce.\n\n### Case 6: Global platform with data residency\n*Hints:* per-region deployments; routing by tenant residency, not latency; model weights replicated per region; per-region capacity planning and reservations; cross-region failover only where residency allows; central control plane, regional data planes.\n\n### Case 7: Serving a large MoE model (hundreds of billions of total parameters)\n*Hints:* memory set by total params, compute by active params. Expert parallelism + tensor parallelism; multi-node with EFA; all-to-all communication cost; load imbalance across experts; FP8 weights; disaggregated prefill/decode; LeaderWorkerSet for gang scheduling; the blast radius of one node failure (the whole group restarts).\n\n---\n\n## Part C: Interview preparation\n\n### Concept questions (answer each in 2 minutes, with numbers)\n1. Walk through what happens to a chat request from HTTP to the last token.\n2. Why is decode memory-bound? Estimate single-stream tokens/s for an 8B model on an H100.\n3. How big is the KV cache for 70B at 32k context? What do you do about it?\n4. Explain PagedAttention to a backend engineer using virtual memory.\n5. Continuous batching vs static batching: what improves, and what gets worse?\n6. When does speculative decoding hurt?\n7. TP vs PP vs replicas: pick for 70B on 8\u00d7 H100 and justify.\n8. Which metric do you autoscale vLLM on, and why not GPU utilization?\n9. Why does round-robin load balancing hurt LLM serving?\n10. EKS vs SageMaker vs Bedrock for a startup with one model and 1M requests/day?\n\n### DSA problems that come from inference systems\n| Problem | Where it appears |\n|---|---|\n| LRU cache with O(1) operations | prefix-cache block eviction (`paged_kv.py`, `mockllm`) |\n| Trie / radix tree insert and longest-prefix match | prefix caching (SGLang RadixAttention), constrained decoding |\n| Priority queue scheduling with preemption | request scheduler (priorities, fairness) |\n| Consistent / rendezvous hashing with bounded load | prefix-aware routing (`gateway/router.go`) |\n| Token bucket / sliding-window rate limiter | tenant token budgets (`gateway/router.go`) |\n| Free-list allocator with reference counts | KV block manager, copy-on-write (`paged_kv.py`) |\n| Streaming percentiles (t-digest, histograms) | latency metrics at scale |\n| Bin packing | placing model copies on GPUs (SageMaker inference components, MIG) |\n\n### Behavioral stories to prepare from this course\n- **Debugging:** the startup OOM (`max-model-len`), the 60 s ALB timeout, the driver/runtime mismatch.\n- **Trade-off:** chunked prefill (ITL vs TTFT), autoscaling headroom vs cost, EKS vs SageMaker.\n- **Impact with numbers:** \"prefix-aware routing raised goodput 44% on the same hardware\", \"FP8 weights + KV roughly tripled concurrency per GPU at an eval cost we measured and accepted\".\n- **Failure and learning:** the coordinated-omission benchmark that looked great and lied.\n\n**Congratulations!** Go back to [the course index](#home) and pick a stretch goal: contribute a fix to vLLM, add engine-metric-aware routing to the gateway, or run the capstone on Inferentia2.\n"}], "parts": [["Foundations", ["00", "01", "02", "03"]], ["Model and engine", ["04", "05", "06", "07"]], ["Serving", ["08", "09", "10"]], ["Cloud and production", ["11", "12", "13", "14", "15"]]], "gh": "https://github.com/wolf-ai-apps/claude-generated/blob/ai-inference-academy/"}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("academy-data").textContent);
  const pages = DATA.pages;
  const byId = Object.fromEntries(pages.map(p => [p.id, p]));
  const levels = pages.filter(p => p.num);
  const STORE = "academy-done-v1";

  function loadDone() { try { return new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch (e) { return new Set(); } }
  function saveDone(s) { try { localStorage.setItem(STORE, JSON.stringify([...s])); } catch (e) {} }
  let done = loadDone();

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- nav ----
  const navTop = document.getElementById("nav-top");
  navTop.innerHTML = ["home", "curriculum"].map(id =>
    `<a class="nav-item nav-plain" href="#${id}" data-id="${id}"><span>${esc(byId[id].title)}</span><span></span></a>`).join("");
  document.getElementById("nav-parts").innerHTML = DATA.parts.map(([label, nums]) =>
    `<div class="part"><div class="part-label">${esc(label)}</div>` +
    nums.map(n => { const p = byId["level-" + n]; return `<a class="nav-item" href="#${p.id}" data-id="${p.id}">
      <span class="nav-num">${n}</span><span>${esc(p.title)}</span><span class="nav-check" data-check="${p.id}"></span></a>`; }).join("") +
    `</div>`).join("");

  function paintProgress() {
    const n = levels.filter(p => done.has(p.id)).length;
    document.getElementById("progress-text").textContent = `${n} of ${levels.length} levels done`;
    document.getElementById("progress-bar").style.width = (100 * n / levels.length) + "%";
    document.querySelectorAll("[data-check]").forEach(el => { el.textContent = done.has(el.dataset.check) ? "✓" : ""; });
  }

  // ---- render ----
  marked.setOptions({ gfm: true, breaks: false });
  const content = document.getElementById("content");
  function render(id) {
    const p = byId[id] || byId.home;
    content.innerHTML = marked.parse(p.md);
    content.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
    const diagrams = [];
    content.querySelectorAll("pre > code.language-mermaid").forEach(code => {
      const wrap = document.createElement("div"); wrap.className = "diagram";
      const pre = document.createElement("pre"); pre.className = "mermaid"; pre.textContent = code.textContent;
      wrap.appendChild(pre); code.parentElement.replaceWith(wrap); diagrams.push(pre);
    });
    content.querySelectorAll("pre:not(.mermaid)").forEach(pre => {
      const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copy";
      b.addEventListener("click", () => {
        const text = pre.querySelector("code")?.innerText ?? pre.innerText;
        const ok = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1400); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre.querySelector("code") || pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
      pre.appendChild(b);
    });
    drawDiagrams(diagrams);
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });

    const meta = document.getElementById("meta");
    meta.innerHTML = p.num ? `<span class="chip lvl">Level ${p.num} of 15</span><span class="chip tier">${esc(p.tier)}</span>` : "";
    meta.hidden = !p.num;

    const markBtn = document.getElementById("mark-btn");
    document.getElementById("done-row").hidden = false;
    markBtn.hidden = !p.num;
    const isDone = done.has(p.id);
    markBtn.setAttribute("aria-pressed", String(isDone));
    markBtn.textContent = isDone ? "✓ Done" : "Mark level as done";
    markBtn.onclick = () => { done.has(p.id) ? done.delete(p.id) : done.add(p.id); saveDone(done); paintProgress(); render(p.id); };
    document.getElementById("source-link").href = DATA.gh + p.path;

    const order = ["home", ...levels.map(l => l.id)];
    const i = order.indexOf(p.id);
    const prev = i > 0 ? byId[order[i - 1]] : null;
    const next = i >= 0 && i < order.length - 1 ? byId[order[i + 1]] : (p.id === "curriculum" ? byId["level-00"] : null);
    const label = q => q.num ? `${q.num} · ${esc(q.title)}` : esc(q.title);
    document.getElementById("pager").innerHTML =
      (prev ? `<a href="#${prev.id}"><span class="dir">Previous</span><span>${label(prev)}</span></a>` : "") +
      (next ? `<a class="next" href="#${next.id}"><span class="dir">Next</span><span>${label(next)}</span></a>` : "");

    document.querySelectorAll(".nav-item").forEach(a => a.toggleAttribute("aria-current", false));
    const cur = document.querySelector(`.nav-item[data-id="${p.id}"]`);
    if (cur) cur.setAttribute("aria-current", "page");
    document.getElementById("mobile-title").textContent = p.num ? `${p.num} · ${p.title}` : p.title;
    window.scrollTo(0, 0);
  }

  // ---- diagrams ----
  function drawDiagrams(nodes) {
    if (!nodes.length || !window.mermaid) return;  // without the library the source stays readable as text
    const css = getComputedStyle(document.documentElement);
    const v = n => css.getPropertyValue(n).trim();
    mermaid.initialize({
      startOnLoad: false, securityLevel: "strict", theme: "base",
      fontFamily: v("--font-body"),
      themeVariables: {
        background: v("--surface"), primaryColor: v("--accent-soft"), primaryTextColor: v("--ink"),
        primaryBorderColor: v("--accent"), secondaryColor: v("--code-bg"), tertiaryColor: v("--bg"),
        lineColor: v("--muted"), textColor: v("--ink"), mainBkg: v("--accent-soft"), nodeBorder: v("--accent"),
        clusterBkg: v("--bg"), clusterBorder: v("--rule"), titleColor: v("--ink"), edgeLabelBackground: v("--surface"),
        actorBkg: v("--accent-soft"), actorBorder: v("--accent"), actorTextColor: v("--ink"), actorLineColor: v("--muted"),
        signalColor: v("--ink"), signalTextColor: v("--ink"), labelBoxBkgColor: v("--code-bg"), labelBoxBorderColor: v("--rule"),
        labelTextColor: v("--ink"), loopTextColor: v("--ink"), noteBkgColor: v("--code-bg"), noteBorderColor: v("--signal"),
        noteTextColor: v("--ink"), activationBkgColor: v("--code-bg"), sequenceNumberColor: v("--surface"),
        taskBkgColor: v("--accent"), taskBorderColor: v("--accent"), taskTextColor: v("--surface"), taskTextOutsideColor: v("--ink"),
        taskTextLightColor: v("--surface"), activeTaskBkgColor: v("--signal"), activeTaskBorderColor: v("--signal"),
        doneTaskBkgColor: v("--muted"), doneTaskBorderColor: v("--muted"), critBkgColor: v("--signal"), critBorderColor: v("--signal"),
        sectionBkgColor: v("--bg"), altSectionBkgColor: v("--surface"), gridColor: v("--rule"), todayLineColor: "transparent",
        xyChart: { backgroundColor: v("--surface"), titleColor: v("--ink"), xAxisLabelColor: v("--muted"), yAxisLabelColor: v("--muted"),
          xAxisTitleColor: v("--ink"), yAxisTitleColor: v("--ink"), xAxisLineColor: v("--rule"), yAxisLineColor: v("--rule"),
          xAxisTickColor: v("--rule"), yAxisTickColor: v("--rule"), plotColorPalette: v("--accent") }
      }
    });
    mermaid.run({ nodes }).catch(err => console.warn("diagram failed to render", err));
  }
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  const redraw = () => render((byId[location.hash.slice(1)] || byId.home).id);
  darkQuery.addEventListener?.("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---- mobile menu ----
  const side = document.getElementById("side"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menu-btn");
  function setMenu(open) { side.classList.toggle("open", open); scrim.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); }
  menuBtn.addEventListener("click", () => setMenu(!side.classList.contains("open")));
  scrim.addEventListener("click", () => setMenu(false));
  side.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

  function route() { const id = location.hash.slice(1); render(byId[id] ? id : "home"); }
  window.addEventListener("hashchange", route);
  paintProgress();
  route();
})();
</script>

</body>
</html>
