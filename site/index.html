<style>
/* Layout: a course reader. Fixed level index on the left (like a datasheet's table of contents), one lesson column on the right. */
:root {
  --bg: #f4f6f8;          /* cool paper */
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5a6776;
  --rule: #d9dfe6;
  --accent: #0a6e7d;      /* HBM teal */
  --accent-soft: #e1f0f2;
  --signal: #b35c00;      /* the one warm accent: tiers, "done" */
  --code-bg: #eef1f4;
  --done: #2c7a3f;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #151d26; --ink: #e4e9ef; --muted: #96a3b1; --rule: #273340;
    --accent: #5fc3cf; --accent-soft: #15303a; --signal: #f0a050; --code-bg: #1b2530; --done: #6cc784;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #151d26; --ink: #e4e9ef; --muted: #96a3b1; --rule: #273340;
  --accent: #5fc3cf; --accent-soft: #15303a; --signal: #f0a050; --code-bg: #1b2530; --done: #6cc784;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }

/* ---------- sidebar ---------- */
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--rule);
  padding-block: 24px 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
.brand-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -.01em; }
.progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--code-bg); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
.nav-top { display: flex; flex-direction: column; gap: 2px; }
.part { display: flex; flex-direction: column; gap: 2px; }
.part-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 8px 4px; }
.nav-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; gap: 6px;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3; }
.nav-item:hover { background: var(--code-bg); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav-item[aria-current="page"] .nav-num { color: var(--accent); }
.nav-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-check { font-size: 12px; color: var(--done); width: 14px; text-align: right; }
.nav-plain { grid-template-columns: minmax(0, 1fr) auto; }

/* ---------- mobile bar ---------- */
.mobile-bar { display: none; }

/* ---------- lesson ---------- */
.main { padding-block: 40px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }
.lesson { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.chip { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); }
.chip.tier { color: var(--signal); border-color: currentColor; }
.chip.lvl { color: var(--accent); border-color: currentColor; }

.prose { min-width: 0; }
.prose h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5vw, 46px); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 18px; text-wrap: balance; }
.prose h2 { font-family: var(--font-display); font-weight: 600; font-size: 27px; line-height: 1.15; margin: 48px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); text-wrap: balance; }
.prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 30px 0 8px; text-wrap: balance; }
.prose p, .prose li { max-width: 68ch; }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; }
.prose li { margin: 4px 0; }
.prose li > p { margin: 0; }
.prose strong { font-weight: 600; }
.prose blockquote { margin: 0 0 24px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 17.5px; }
.prose blockquote p { margin: 0; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0; }
.prose code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.prose pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 18px; line-height: 1.5; position: relative; }
.prose pre code { background: none; padding: 0; font-size: 13.5px; white-space: pre; }
.copy { position: absolute; top: 8px; right: 8px; font: 500 11px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.prose pre:hover .copy, .copy:focus-visible { opacity: 1; }
.diagram { margin: 4px 0 22px; padding: 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow-x: auto; }
.diagram pre.mermaid { margin: 0; padding: 0; border: 0; background: none; display: flex; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: pre; }
.diagram svg { max-width: 100%; height: auto; }
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.45; }
.prose th, .prose td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.prose th { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .02em; background: var(--code-bg); white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose td code { white-space: nowrap; }
.prose details { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin: 0 0 10px; padding: 0 16px; }
.prose summary { cursor: pointer; padding: 12px 0; font-weight: 500; list-style-position: outside; }
.prose details[open] { padding-bottom: 12px; }
.prose details[open] summary { border-bottom: 1px solid var(--rule); margin-bottom: 10px; color: var(--accent); }

.done-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); }
.btn { font: 500 15px var(--font-body); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.mark[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .dir { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pager .next { text-align: right; grid-column: 2; }
.source { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); height: 100%; z-index: 30; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .45); z-index: 25; }
  .mobile-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mobile-bar .title { font-family: var(--font-display); font-weight: 600; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .prose h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script id="academy-data" type="application/json">{"pages": [{"id": "home", "title": "Course home", "path": "README.md", "num": null, "tier": null, "md": "# AI Inference Academy\n\n**From \"what is a GPU\" to serving vLLM on Amazon EKS and SageMaker.** Understand the basics, then build the system.\n\nThe course has 16 levels. Each one has concepts, worked examples with real numbers, runnable labs and self-check questions. Most labs run on a laptop with no GPU: a GPU-free mock inference server reproduces the queueing, prefill/decode timing, prefix caching and vLLM metrics that the platform layer cares about. The GPU and AWS labs use the same tools against real vLLM.\n\n**Running example:** a support chatbot on **Llama 3.1 8B**, which grows to 70B and multi-node. Every level asks what happens to this model and this workload at that layer.\n\n## Read the course as a website\n\n```bash\npython3 site/build.py                    # rebuilds site/index.html from the level READMEs\npython3 -m http.server -d site 8080      # open http://localhost:8080\n```\n\nOr just double-click `site/index.html`: it's one self-contained file (it needs internet for fonts and the Markdown renderer). Progress (\"Mark level as done\") is saved in your browser.\n\n## Course map\n\n```mermaid\nflowchart LR\n    subgraph F[\"Foundations\"]\n        direction TB\n        L0[\"0 Why inference\"] --> L1[\"1 Computer basics\"] --> L2[\"2 What a GPU is\"] --> L3[\"3 GPU software stack\"]\n    end\n    subgraph M[\"Model and engine\"]\n        direction TB\n        L4[\"4 Models\"] --> L5[\"5 Generation\"] --> L6[\"6 Performance math\"] --> L7[\"7 Optimizations\"]\n    end\n    subgraph S[\"Serving\"]\n        direction TB\n        L8[\"8 vLLM\"] --> L9[\"9 Benchmarks and SLOs\"] --> L10[\"10 Containers and K8s\"]\n    end\n    subgraph C[\"Cloud and production\"]\n        direction TB\n        L11[\"11 AWS foundations\"] --> L12[\"12 vLLM on EKS\"] --> L13[\"13 SageMaker\"] --> L14[\"14 Production ops\"] --> L15[\"15 Capstone\"]\n    end\n    F --> M --> S --> C\n```\n\n\n| # | Level | You'll be able to | Labs | Hardware |\n|---|---|---|---|---|\n| 0 | [Why inference matters](#level-00) | explain prefill vs decode, TTFT/ITL/throughput/cost | stream timing | laptop |\n| 1 | [Computer basics](#level-01) | tell compute-bound from memory-bound; use Little's Law | SIMD vs loop; measure GFLOP/s vs GB/s | laptop |\n| 2 | [What a GPU is](#level-02) | read GPU specs for inference; write CUDA/Triton kernels | CUDA + Triton vector add, fusion, bandwidth | any GPU |\n| 3 | [GPU software stack](#level-03) | debug driver/runtime mismatches; profile generation | stack checker, PyTorch profiler | any GPU |\n| 4 | [Models from first principles](#level-04) | read a config.json; count params; explain GQA, MoE | BPE tokenizer, param counter, attention | laptop |\n| 5 | [How generation works](#level-05) | implement the KV cache, samplers, JSON-constrained decoding | NumPy Llama with exact KV cache | laptop |\n| 6 | [Performance math](#level-06) | estimate memory, concurrency, speed and $/token within 2\u00d7 | `infercalc` (Go), roofline | laptop |\n| 7 | [Inference optimizations](#level-07) | map 10 optimizations to the bottleneck each removes | batching simulator, paged KV + prefix cache, INT8/INT4, speculative decoding | laptop |\n| 8 | [Running models and vLLM](#level-08) | run and tune vLLM; read its log and metrics | serve, OpenAI client, offline batch, metrics | 24 GB GPU |\n| 9 | [Benchmarking and SLOs](#level-09) | measure goodput at an SLO without lying to yourself | `loadgen` (Go), capacity sweep | laptop / GPU |\n| 10 | [Containers and Kubernetes](#level-10) | schedule GPUs, survive cold starts, route and autoscale LLM traffic | `gateway` (Go), Compose fleet, kind, KEDA, GPU manifests | laptop / GPU cluster |\n| 11 | [AWS foundations](#level-11) | pick instances, get quota and capacity, store weights, set up IAM | instance picker, S3 weights | AWS account |\n| 12 | [vLLM on EKS](#level-12) | run a production-shaped LLM service on EKS end to end | Auto Mode cluster, NodePool, vLLM, gateway, ALB, KEDA, dashboards, alerts, multi-node | AWS GPUs |\n| 13 | [SageMaker](#level-13) | deploy, stream, autoscale and pack models on SageMaker | BYOC vLLM image, boto3 deploy/invoke/autoscale, inference components | AWS GPUs |\n| 14 | [Production operations](#level-14) | choose platforms with numbers; ship safely; handle failures | cost model, chaos drill | laptop |\n| 15 | [Capstone and system design](#level-15) | build, measure and defend a system; design 7 more | capstone brief + rubric, design cases, interview prep | AWS GPUs |\n\nSuggested paths (detail in [CURRICULUM.md](#curriculum)):\n- **Full path:** 0 \u2192 15 in order (~10\u201312 weeks at ~8 h/week).\n- **Platform engineer, fast track:** 0, 1, 5 (KV cache), 6, 7 (skim), 8\u201315.\n- **ML / engine engineer:** 0\u20139 in depth, then 10 and 12, plus the level 7 exercises.\n\n## Tools you build and use (`platform/`, Go, standard library only)\n\n| Tool | What it does | First used |\n|---|---|---|\n| `cmd/infercalc` | back-of-envelope sizing: weights, KV cache, concurrency, decode speed, prefill time, $/1M tokens | level 6 |\n| `cmd/mockllm` | GPU-free OpenAI-compatible server: FCFS queueing, KV budget, prefill/decode timing, block-hash prefix cache, cancellation, **vLLM metric names** | level 0 |\n| `cmd/loadgen` | streaming load generator: open-loop Poisson or closed loop, length distributions, shared prefixes, TTFT/TPOT/ITL percentiles, SLO goodput, truncated-stream detection | level 9 |\n| `cmd/gateway` | LLM gateway: tenant API keys + token-bucket budgets, round-robin / least-loaded / **prefix-aware (rendezvous hashing + bounded load)** routing, Kubernetes DNS discovery, health checks, pre-first-byte retry, cancellation propagation, Prometheus metrics | level 10 |\n\n```bash\ncd platform && go build -o bin/ ./cmd/...      # Go 1.24+\n```\n\n## Quick start (5 minutes, no GPU)\n\n```bash\ncd platform && go build -o bin/ ./cmd/...\nfor i in 1 2 3; do bin/mockllm -addr :800$i -name replica-$i -max-num-seqs 16 -cache-blocks 1000 & done\nbin/gateway -addr :9000 -policy prefix -backends http://localhost:8001,http://localhost:8002,http://localhost:8003 &\nbin/loadgen -url http://localhost:9000 -rate 20 -n 300 -prompt-min 50 -prompt-max 200 -output-min 32 -output-max 64 \\\n  -prefix-tokens 2000 -prefix-groups 12 -slo-ttft 300ms -slo-tpot 40ms\nbin/infercalc -model llama-3.1-8b -gpu l4 -dtype fp8 -kv-dtype fp8 -context 8192\n```\n\n## Requirements\n\n| For | Needs |\n|---|---|\n| Levels 0\u20131, 4\u20137, 9, 14 and all Go tools | Python 3.10+ with NumPy, Go 1.24+ |\n| Levels 2\u20133, 8 | an NVIDIA GPU (24 GB for the 8B model; any GPU for the 0.5B model), Docker with the NVIDIA Container Toolkit, PyTorch / vLLM |\n| Level 10 | Docker, kind, kubectl, Helm |\n| Levels 11\u201313, 15 | an AWS account with G-instance quota, aws CLI v2, eksctl, kubectl, Helm; a Hugging Face token for Llama (or use Qwen2.5, which is ungated) |\n\n## Verify everything\n\n```bash\nscripts/test.sh     # go vet + race tests for the tools, and unit tests for every Python lab (no GPU needed)\n```\n\n## Conventions\n- **Versions are pinned** (e.g. `vllm/vllm-openai:v0.11.0`). Bump them deliberately, and check flags with `vllm serve --help` for your version.\n- **Prices are inputs, never constants.** Look up current EC2/SageMaker prices for your region.\n- **Every AWS lab ends with cleanup.** GPU instances bill by the second.\n"}, {"id": "curriculum", "title": "Curriculum", "path": "CURRICULUM.md", "num": null, "tier": null, "md": "# AI Inference Academy: Curriculum\n\nThis document is the syllabus: audience, outcomes, the level sequence, learning paths, assessment and hardware/cost planning. The lessons themselves live in [`levels/`](https://github.com/wolf-ai-apps/claude-generated/blob/ai-inference-academy/levels).\n\n## 1. Audience and prerequisites\n\nTwo audiences share one sequence:\n- **Platform / SRE / infra engineers** who have to run LLM inference in production.\n- **ML / systems engineers** who want to understand what happens inside engines like vLLM.\n\nPrerequisites: comfortable in Python or Go (ideally both); basic linear algebra (matrix multiply, softmax); Docker basics; basic Kubernetes (Pods, Deployments, Services) from level 10 on. No ML research background needed.\n\n## 2. Learning outcomes\n\nA graduate can:\n1. **Do the back-of-envelope math:** given a model, GPU and workload, estimate weight memory, KV cache capacity, max concurrency, decode speed and $/1M tokens to within ~2\u00d7 of measurement.\n2. **Explain every major serving optimization** (KV cache, continuous batching, PagedAttention, prefix caching, chunked prefill, FlashAttention, CUDA graphs, quantization, speculative decoding, parallelism, disaggregation) by the bottleneck it attacks.\n3. **Implement** the core of the key ones (KV cache, schedulers, paged allocation, prefix hashing, quantization, speculative sampling) and measure their effect.\n4. **Operate** vLLM on Kubernetes and EKS: GPU scheduling, cold starts, probes, routing, autoscaling, observability, failure handling.\n5. **Deploy and scale** the same service on SageMaker, and choose between EKS, SageMaker and managed APIs with numbers.\n6. **Benchmark honestly:** open-loop load, realistic distributions, goodput at an SLO.\n7. **Design** inference systems in an architecture review or interview, with explicit trade-offs.\n\n## 3. Sequence\n\n```mermaid\nflowchart LR\n    subgraph F[\"Foundations\"]\n        direction TB\n        L0[\"0 \u00b7 Why inference\"] --> L1[\"1 \u00b7 Computer basics\"] --> L2[\"2 \u00b7 What a GPU is\"] --> L3[\"3 \u00b7 GPU software stack\"]\n    end\n    subgraph M[\"Model and engine\"]\n        direction TB\n        L4[\"4 \u00b7 Models\"] --> L5[\"5 \u00b7 Generation\"] --> L6[\"6 \u00b7 Performance math\"] --> L7[\"7 \u00b7 Optimizations\"]\n    end\n    subgraph S[\"Serving\"]\n        direction TB\n        L8[\"8 \u00b7 vLLM\"] --> L9[\"9 \u00b7 Benchmarks and SLOs\"] --> L10[\"10 \u00b7 Containers and K8s\"]\n    end\n    subgraph C[\"Cloud and production\"]\n        direction TB\n        L11[\"11 \u00b7 AWS foundations\"] --> L12[\"12 \u00b7 vLLM on EKS\"] --> L13[\"13 \u00b7 SageMaker\"] --> L14[\"14 \u00b7 Production ops\"] --> L15[\"15 \u00b7 Capstone\"]\n    end\n    F --> M --> S --> C\n```\n\n| Level | Core question | Key artifacts |\n|---|---|---|\n| 0 Why inference | What happens between \"send\" and the last token? | token timeline, `stream_timing.py` |\n| 1 Computer basics | Is this computation limited by math or by memory? | `memory_vs_compute.py`, Little's Law |\n| 2 What a GPU is | Which GPU spec matters for which part of inference? | CUDA/Triton kernels, GPU table |\n| 3 GPU software stack | Why won't my container see the GPU? Where does time go? | `check_stack.sh`, profiler trace |\n| 4 Models | What does config.json tell me about memory and compute? | BPE, `count_params.py`, GQA attention |\n| 5 Generation | How do the KV cache and the sampler work? | NumPy Llama with exact KV cache, samplers, constrained decoding |\n| 6 Performance math | Will it fit, how fast, and what does it cost? | `infercalc`, roofline |\n| 7 Optimizations | Which technique removes which bottleneck? | batching sim, paged KV, quantization, speculative decoding |\n| 8 vLLM | How do I run and tune a real engine? | serve/tune/metrics labs |\n| 9 Benchmarks | How much can one replica serve at my SLO? | `loadgen`, sweep, report template |\n| 10 Kubernetes | What changes when the workload is huge, slow-starting and stateful? | `gateway`, Compose/kind fleet, KEDA, GPU manifests |\n| 11 AWS | Which instance, and how do I actually get one? | `pick_instance.py`, quota/capacity/storage/IAM |\n| 12 EKS | How does it all fit together in production shape? | Auto Mode cluster, NodePool, vLLM, gateway, ALB, KEDA, dashboards, alerts, LWS |\n| 13 SageMaker | What does the managed path give and cost? | BYOC image, boto3 deploy/invoke/autoscale, inference components |\n| 14 Operations | How do I run this for a year? | cost model, rollout gates, failure-mode table, chaos drill |\n| 15 Capstone | Can I build, measure and defend it, and design bigger ones? | capstone brief + rubric, 7 design cases, interview prep |\n\n## 4. Learning paths\n\n| Path | Levels | Approx. time (8 h/week) |\n|---|---|---|\n| **Full** | 0 \u2192 15 | 10\u201312 weeks |\n| **Platform fast track** | 0, 1, 5, 6, (7 skim), 8, 9, 10, 11, 12, 13, 14, 15 | 7\u20138 weeks |\n| **Engine deep dive** | 0\u20139 in depth with all exercises, then 10, 12 | 7\u20138 weeks |\n| **AWS-only refresher** (already knows inference) | 6, 9, 10, 11, 12, 13, 14 | 3\u20134 weeks |\n\n## 5. Assessment\n\n- **Every level:** self-check questions with answers, and labs with observable outcomes (\"what to observe\"). `scripts/test.sh` runs all automated lab tests.\n- **Measured assignments:** levels 6, 8, 9, 10 and 12 each ask you to compare a prediction with a measurement and explain the gap.\n- **Benchmark report** (level 9 template), reused in levels 12\u201315.\n- **Capstone** (level 15) with a rubric covering estimation, measurement correctness, SLO attainment, cost, operability and reasoning, plus a 20-minute design review.\n\n## 6. Hardware and cost tiers\n\n| Tier | Hardware | Levels |\n|---|---|---|\n| **0: Laptop** | any machine with Python + Go (Docker + kind for level 10) | 0, 1, 4, 5, 6, 7, 9, 10 (mock fleet), 14 |\n| **1: One GPU** | a 16\u201324 GB NVIDIA GPU: cloud g6/g5 by the hour, or a free notebook GPU for the 0.5B model | 2, 3, 8, 9 (real), 10 (GPU manifests), 12 (8B), 13 |\n| **2: Multi-GPU** | 4\u20138 GPUs; p-family needs quota + usually a Capacity Block | 12 (70B, multi-node), 15 stretch goals |\n\nCost discipline: every AWS lab ships a cleanup script; the GPU NodePool has a hard GPU cap; set an AWS Budgets alarm before level 11.\n\n## 7. Content status\n\n| Area | Status |\n|---|---|\n| Levels 0\u201315 lessons | written |\n| Laptop labs (levels 0, 1, 4\u20137, 9, 10, 14) | runnable and tested (`scripts/test.sh`, mock-fleet runs) |\n| GPU labs (levels 2, 3, 8) | written against current PyTorch/Triton/vLLM APIs; need a GPU run to validate in your environment |\n| AWS labs (levels 11\u201313) | written against current EKS Auto Mode, Karpenter v1, KEDA and SageMaker APIs; validate on a first run (check pinned versions, quotas, region) |\n\n## 8. Core reading list\n\n- Vaswani et al., *Attention Is All You Need* (2017) \u00b7 Ainslie et al., *GQA* (2023)\n- Pope et al., *Efficiently Scaling Transformer Inference* (2022) \u00b7 Kipply, *Transformer Inference Arithmetic*\n- Horace He, *Making Deep Learning Go Brrrr From First Principles*\n- Yu et al., *Orca* (OSDI '22) \u00b7 Kwon et al., *PagedAttention / vLLM* (SOSP '23) \u00b7 Zheng et al., *SGLang*\n- Dao et al., *FlashAttention* 1/2/3 \u00b7 Agrawal et al., *Sarathi-Serve* (OSDI '24)\n- Frantar et al., *GPTQ* \u00b7 Lin et al., *AWQ* \u00b7 Xiao et al., *SmoothQuant* \u00b7 Dettmers et al., *LLM.int8()*\n- Leviathan et al., *Fast Inference from Transformers via Speculative Decoding* (2023) \u00b7 *Medusa* \u00b7 *EAGLE*\n- Shoeybi et al., *Megatron-LM* \u00b7 Zhong et al., *DistServe* (OSDI '24) \u00b7 Patel et al., *Splitwise* \u00b7 Qin et al., *Mooncake*\n- Gil Tene, *How NOT to Measure Latency* \u00b7 Google SRE book (SLOs)\n- Docs: vLLM, Kubernetes device plugins/DRA, KEDA, Karpenter, EKS (Auto Mode, AI/ML best practices), SageMaker inference\n"}, {"id": "level-00", "title": "Why inference matters", "path": "levels/00-why-inference/README.md", "num": "00", "tier": "Laptop", "md": "# Level 0: Why inference matters\n\n> Training builds the model once. Inference runs it billions of times, so that's where speed, cost and reliability are decided.\n\n**You will:** understand what happens between \"send\" and the last token, and learn the four numbers that inference engineering optimizes.\n**Time:** 1\u20132 hours \u00b7 **Hardware:** laptop (Tier 0)\n\n---\n\n## 1. Concepts\n\n### 1.1 Training vs inference\n\n| | Training | Inference |\n|---|---|---|\n| What happens | Adjust billions of weights using gradients | Use fixed weights to produce outputs |\n| How often | Once (weeks, then occasional fine-tunes) | Every user request, forever |\n| Optimized for | Total throughput over days | Latency per user **and** cost per token |\n| Failure looks like | A job restarts from a checkpoint | Users wait, time out, or leave |\n| Who owns it | Research / ML teams | ML engineers **and** platform/SRE teams |\n\nA model trained once might serve 100 million requests a day. Over a model's lifetime, inference compute usually exceeds training compute by a wide margin. So small inference efficiency gains (10% more tokens per GPU) turn into large amounts of money.\n\n### 1.2 What happens when you press \"send\"\n\nA request to a chat model, step by step:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant C as Client\n    participant G as API gateway\n    participant R as Router\n    participant E as Inference engine (GPU)\n    C->>G: POST /v1/chat/completions (stream=true)\n    G->>G: auth, tenant quota\n    G->>R: forward\n    R->>E: pick a replica\n    E->>E: tokenize text into token IDs\n    E->>E: wait in the queue for a batch slot\n    Note over E: PREFILL - whole prompt in one pass<br/>compute-bound, sets TTFT\n    E-->>C: first token (SSE)\n    loop DECODE: one forward pass per token (memory-bound, sets ITL)\n        E-->>C: next token (SSE)\n    end\n    E->>E: stop at EOS, max_tokens or a stop string\n    E-->>C: final SSE event [DONE]\n```\n\nTwo phases, with very different behavior. The rest of the course builds on this split:\n\n- **Prefill** processes all prompt tokens in parallel. It's one big computation and it's *compute-bound*. It sets the **time to first token**.\n- **Decode** produces one token per step. Each step has to read all of the model's weights from GPU memory, so it's *memory-bandwidth-bound*. It sets the **speed of the stream**.\n\n### 1.3 The four numbers\n\n| Metric | Definition | What the user feels | Typical target (chat) |\n|---|---|---|---|\n| **TTFT**, time to first token | request sent \u2192 first token received | \"Is it thinking?\" | p95 < 0.5\u20131 s |\n| **ITL**, inter-token latency (also **TPOT**, time per output token) | gap between consecutive tokens | Reading speed of the stream | p95 < 50\u2013100 ms (\u2265 10\u201320 tok/s) |\n| **Throughput** | tokens/s (or requests/s) across all users | (operator) how much one GPU serves | as high as the SLO allows |\n| **Cost** | $ per million tokens | (business) unit economics | depends on model/hardware |\n\nThe core tension: **batching more users per GPU raises throughput and lowers cost, but each user's tokens arrive more slowly.** Inference engineering means getting the most throughput while still meeting the latency targets. That throughput is called **goodput** (level 9).\n\n### 1.4 Who does what\n\n- **ML/engine engineers** make each forward pass faster: kernels, batching, memory management, quantization (levels 2\u20138).\n- **Platform engineers** make the fleet fast, cheap and reliable: containers, Kubernetes, routing, autoscaling, observability, cost (levels 9\u201314).\n- The best engineers in either role understand both, because every platform decision (routing, autoscaling signal, instance type) depends on how the engine behaves.\n\n---\n\n## 2. Worked example: reading a token timeline\n\nA user asks a question with a 1,000-token prompt (system prompt + chat history) and gets a 200-token answer:\n\n```mermaid\ngantt\n    title One request: 1,000-token prompt, 200-token answer\n    dateFormat ss.SSS\n    axisFormat %S.%L s\n    section Platform\n    Network and gateway (40 ms)       :done, net, 00.000, 00.040\n    section Engine\n    Queue, waiting for a slot (80 ms) :crit, q, 00.040, 00.120\n    Prefill 1,000 tokens (200 ms)     :active, pf, 00.120, 00.320\n    TTFT = 330 ms                     :milestone, ttft, 00.330, 0s\n    Decode 199 tokens x 20 ms (4.0 s) :dec, 00.330, 04.330\n```\n\nWhat each slice tells you:\n- 40 ms network/gateway: platform overhead. It should be tiny and stable.\n- 80 ms queueing: **the system is near capacity.** This is the first place latency grows under load.\n- 200 ms prefill: proportional to prompt length. Prefix caching (level 7) can remove most of it for a repeated system prompt.\n- 20 ms per decode step: set by memory bandwidth and batch size (level 6).\n\n## 3. Lab: feel TTFT and ITL\n\nNo GPU needed. Start the academy's mock inference server. It simulates queueing, prefill and decode timing, and uses the same API as vLLM:\n\n```bash\ncd platform\ngo run ./cmd/mockllm -addr :8000\n```\n\nIn another terminal:\n\n```bash\npython3 levels/00-why-inference/labs/stream_timing.py --url http://localhost:8000 --max-tokens 32\n```\n\nExpected output (numbers vary):\n\n```\n    42.0 ms  TTFT    42.0 ms  'the '\n    57.3 ms  ITL     15.3 ms  'quick '\n    ...\nTTFT 42.0 ms | tokens 32 | ITL p50 15.3 ms | decode speed 65.3 tok/s | end-to-end 517 ms\n```\n\nExperiments:\n1. Make the prompt longer (`--prompt \"$(python3 -c 'print(\"word \" * 2000)')\"`). TTFT grows, ITL doesn't. Why?\n2. Restart the mock with `-itl 40ms`. What changes for the user, and what stays the same?\n3. If you have [Ollama](https://ollama.com) installed: `ollama run qwen2.5:0.5b` once, then point the script at `--url http://localhost:11434 --model qwen2.5:0.5b`. Now you're timing a real model on your laptop.\n\n## 4. Check yourself\n\n<details><summary>1. Why does a longer prompt increase TTFT but not ITL?<\/summary>\nThe whole prompt is processed during prefill, before the first token. Decode steps each process one new token. They do attend to the longer history, but in most regimes the per-step cost is dominated by reading the weights, not by prompt length.<\/details>\n\n<details><summary>2. A dashboard shows TTFT p95 rising from 300 ms to 3 s while ITL stays flat. What's the most likely cause?<\/summary>\nQueueing: requests wait longer for a slot because the system is near capacity, or a few very long prompts are hogging prefill. Flat ITL means the batch that *is* running isn't slower; requests are just waiting to get in.<\/details>\n\n<details><summary>3. Why can't you just report \"average latency\"?<\/summary>\nLLM latency depends on output length (a 500-token answer always takes longer than a 5-token one), and users feel TTFT and ITL separately. Averages also hide the tail. Report TTFT and ITL percentiles, and end-to-end latency normalized by output length.<\/details>\n\n## 5. Going deeper\n- Anyscale / Databricks / BentoML engineering blogs on LLM inference metrics\n- Level 9 of this course: defining SLOs and measuring them correctly\n\n**Next \u2192 [Level 1: Computer basics a GPU builds on](#level-01)**\n"}, {"id": "level-01", "title": "Computer basics a GPU builds on", "path": "levels/01-computer-basics/README.md", "num": "01", "tier": "Laptop", "md": "# Level 1: Computer basics a GPU builds on\n\n> Every inference optimization is about one of two limits: how fast you can compute, and how fast you can move data. Learn to tell them apart.\n\n**You will:** understand why parallel hardware exists, the memory hierarchy, and the compute-bound vs memory-bound distinction, and measure both on your own machine.\n**Time:** 2\u20133 hours \u00b7 **Hardware:** laptop (Tier 0)\n\n---\n\n## 1. Concepts\n\n### 1.1 One fast worker vs thousands of simple ones\n\nA **CPU** has a few (4\u2013128) powerful cores. Each one is built to run *one* stream of instructions as fast as possible: branch prediction, out-of-order execution, big caches. It's great for complicated logic with lots of `if` statements.\n\nA **GPU** has thousands of simple cores grouped into units that run *the same instruction on different data* at the same time. It's terrible at branchy logic, and extraordinary at \"do this math on these 10 million numbers\".\n\n**Analogy:** a CPU is a team of 16 senior engineers, each able to solve any problem quickly. A GPU is a stadium of 10,000 people with calculators who can each add two numbers. To add 10 million pairs of numbers, the stadium wins by a mile. To debug a race condition, you want the engineers.\n\nNeural network inference is mostly **matrix multiplication**: millions of independent multiply-adds. It's the perfect stadium workload.\n\n### 1.2 SIMD: parallelism inside one core\n\nEven CPUs do some data parallelism. **SIMD** (Single Instruction, Multiple Data) instructions such as AVX-512 add 16 floats in one instruction. NumPy uses them, which is why `a + b` on arrays is hundreds of times faster than a Python loop. A GPU applies the same idea at a much larger scale: one instruction drives 32 threads at once (a **warp**), and thousands of threads are active.\n\n### 1.3 The memory hierarchy\n\nData has to be close to the compute units to be used. The closer it is, the smaller and faster the storage:\n\n| Level | Typical size | Typical bandwidth | Latency | GPU equivalent |\n|---|---|---|---|---|\n| Registers | KB per core | ~TB/s per core | ~1 cycle | registers (per thread) |\n| L1 / shared memory (SRAM) | 32\u2013256 KB per core/SM | many TB/s aggregate | ~few ns | shared memory / L1 per SM |\n| L2 cache | MBs | TB/s | ~10s of ns | L2 (e.g. 50 MB on H100) |\n| Main memory | GBs | CPU DDR5: ~50\u2013500 GB/s | ~100 ns | **HBM: 1\u20138 TB/s**, 16\u2013192 GB |\n| Interconnect | \u2014 | PCIe Gen4 x16: ~32 GB/s per direction; NVLink: hundreds of GB/s | \u00b5s | GPU\u2194CPU, GPU\u2194GPU |\n| Disk / network | TBs | NVMe: ~2\u20137 GB/s; network: 10\u2013400 Gb/s | \u00b5s\u2013ms | loading model weights |\n\nTwo lessons that come back in every level:\n1. **Moving data is often more expensive than computing on it.** Copying a tensor from CPU to GPU over PCIe can take longer than the math done on it.\n2. **Model weights live in GPU main memory (HBM).** Every decode step has to stream all of them through the compute units. HBM bandwidth is therefore the single most important number for LLM decode speed.\n\n### 1.4 Compute-bound vs memory-bound\n\nEvery computation has an **arithmetic intensity**:\n\n```\narithmetic intensity = FLOPs performed / bytes moved to and from memory\n```\n\n- **Elementwise add** `c = a + b` (FP32): 1 FLOP per 12 bytes (read 4 + 4, write 4). That's ~0.08 FLOPs/byte. The hardware waits on memory and the math units sit idle: **memory-bound**.\n- **Matrix multiply** of two n\u00d7n matrices: 2n\u00b3 FLOPs over ~12n\u00b2 bytes, so the intensity grows with n. For big n there's plenty of math per byte: **compute-bound**.\n\nA machine has a peak compute rate (FLOP/s) and a peak bandwidth (bytes/s). Their ratio is the intensity at which a kernel switches from memory-bound to compute-bound. Level 6 turns this into the **roofline model** and applies it to LLMs. For now, remember:\n\n> **LLM decode behaves like the elementwise add (memory-bound). LLM prefill behaves like a big matmul (compute-bound).**\n\n### 1.5 Latency vs throughput\n\n- **Latency:** how long one task takes.\n- **Throughput:** how many tasks finish per second.\n\nA GPU gives up per-thread latency for massive throughput. An inference server makes the same trade: processing 64 users together makes each user's tokens a little slower but the total much higher. **Little's Law** connects them, and you'll use it in levels 9 and 12:\n\n```\nconcurrency (requests in system) = throughput (requests/s) \u00d7 latency (s)\n```\n\n*Example:* a replica that holds 16 concurrent sequences, with each request taking 4 s end to end, can sustain at most 16 / 4 = **4 requests/s**. Send 6 req/s and the queue grows without bound.\n\n---\n\n## 2. Worked examples\n\n**Example A: copy cost vs compute cost.** Adding two 256 MiB arrays on a GPU with 2 TB/s HBM moves 768 MiB, which takes ~0.4 ms. Copying the two inputs from the CPU over PCIe Gen4 (~25 GB/s in practice) moves 512 MiB, which takes ~21 ms. The copy costs **50\u00d7 more than the computation**. That's why inference engines load weights onto the GPU once and keep everything there.\n\n**Example B: why decode is memory-bound.** A Llama 3.1 8B model in BF16 is ~16 GB of weights. To generate one token for one user, the GPU reads all 16 GB and does about 2 FLOPs per weight, so ~16 GFLOPs over 16 GB, about **1 FLOP per byte**. An H100 can do ~989 TFLOP/s but read only ~3.35 TB/s, so it would need ~295 FLOPs per byte to keep its math units busy. At 1 FLOP/byte, more than 99% of its compute sits idle.\n\n## 3. Labs\n\n```bash\ncd levels/01-computer-basics/labs\npython3 loop_vs_vector.py      # Python loop vs NumPy SIMD (vs GPU if torch+CUDA present)\npython3 memory_vs_compute.py   # measure GFLOP/s and GB/s for add vs matmul on YOUR machine\n```\n\nSample output from a cloud VM (yours will differ):\n\n```\nkernel                   GFLOP/s      GB/s  FLOPs/byte\nadd 20M                      0.9      10.6       0.083\nmatmul 64x64                51.4      4.81        10.7\nmatmul 1024x1024           362.2      2.12       170.7\nmatmul 2048x2048           368.8      1.08       341.3\n```\n\nWhat to observe:\n- The add reaches a decent **GB/s** but a tiny **GFLOP/s**: it's limited by memory.\n- Matmul GFLOP/s climbs with size, then plateaus at the machine's compute peak: it's limited by compute.\n- The plateau is 400\u00d7 higher than the add's GFLOP/s, on the *same machine*. The only difference is the data reuse per byte.\n\n**Stretch:** run `loop_vs_vector.py` on a machine with a GPU. You'll see the GPU add beat NumPy, *and* the PCIe copy dwarf the kernel time.\n\n## 4. Check yourself\n\n<details><summary>1. Why are GPUs good at neural networks but bad at running a web server?<\/summary>\nNeural networks are huge numbers of identical, independent multiply-adds: data parallelism. Web servers are branchy, latency-sensitive logic with little data parallelism, which is exactly what CPU cores are optimized for.<\/details>\n\n<details><summary>2. Doubling a GPU's FLOPs without changing its memory bandwidth: does single-user LLM decode get faster?<\/summary>\nBarely. Single-user decode is memory-bound (~1 FLOP/byte), so it's limited by how fast the weights can be read, not by math. Prefill and large-batch decode would benefit.<\/details>\n\n<details><summary>3. A replica serves at most 32 concurrent requests; each takes 8 s. What's its max sustainable request rate?<\/summary>\nLittle's Law: 32 / 8 = 4 requests/s. Beyond that, the queue (and TTFT) grows without bound.<\/details>\n\n## 5. Going deeper\n- *Computer Architecture: A Quantitative Approach* (Hennessy & Patterson), chapters on memory hierarchy and data-level parallelism\n- \"Latency Numbers Every Programmer Should Know\", then think about where HBM and NVLink fit in it\n\n**Next \u2192 [Level 2: What a GPU is](#level-02)**\n"}, {"id": "level-02", "title": "What a GPU is", "path": "levels/02-what-is-a-gpu/README.md", "num": "02", "tier": "GPU", "md": "# Level 2: What a GPU is\n\n> A GPU is a large set of simple processors fed by very fast memory. To serve LLMs well, you need to know what's inside it and which spec matters for which workload.\n\n**You will:** learn GPU anatomy, the CUDA programming model, number formats and the GPU generations you'll rent on AWS. Then write and benchmark your first kernels.\n**Time:** 3\u20134 hours \u00b7 **Hardware:** laptop for reading; any NVIDIA GPU for the labs (Tier 1, or a free Colab/Kaggle GPU)\n\n---\n\n## 1. Concepts\n\n### 1.1 Anatomy of an NVIDIA GPU\n\n```mermaid\nflowchart TB\n    subgraph DIE[\"GPU die (H100 SXM: 132 SMs)\"]\n        direction TB\n        subgraph SMS[\"Streaming Multiprocessors\"]\n            direction LR\n            SM1[\"SM<br/>warp schedulers<br/>CUDA cores \u00b7 Tensor cores<br/>registers \u00b7 shared memory/L1 ~256 KB\"]\n            SM2[\"SM\"]\n            SM3[\"SM\"]\n            SMN[\"... SM\"]\n        end\n        L2[\"L2 cache (tens of MB)\"]\n        SMS --- L2\n    end\n    HBM[(\"HBM<br/>80-192 GB at 2-8 TB/s\")]\n    LINK[\"NVLink / PCIe<br/>other GPUs and the CPU\"]\n    L2 <-->|memory controllers| HBM\n    L2 <--> LINK\n```\n\n| Part | What it is | Why inference engineers care |\n|---|---|---|\n| **SM** (Streaming Multiprocessor) | The GPU's \"core\"; runs many threads at once | A kernel needs enough parallel work to fill all SMs. Small batches don't. |\n| **Warp** | 32 threads executing the same instruction in lockstep | Divergent branches inside a warp serialize, so kernels avoid them |\n| **CUDA cores** | Scalar FP32/INT units | Elementwise ops: activations, norms, sampling |\n| **Tensor cores** | Units that multiply small matrix tiles in one instruction | Nearly all LLM FLOPs. FP8/FP4 support depends on the generation |\n| **Registers / shared memory (SRAM)** | Tiny, extremely fast on-chip memory | FlashAttention's trick is keeping attention tiles here (level 7) |\n| **L2 cache** | Shared on-chip cache | Helps reuse across SMs |\n| **HBM** (High Bandwidth Memory) | The GPU's main memory | **Capacity** decides if the model and KV cache fit. **Bandwidth** decides decode speed |\n| **NVLink / PCIe** | Links to other GPUs and the CPU | Tensor parallelism across GPUs needs NVLink-class bandwidth (level 7) |\n\n### 1.2 The CUDA programming model\n\nYou write a **kernel**, a function that runs once per **thread**. Threads are grouped into **blocks** (up to 1,024 threads; a block runs on one SM and can share its shared memory), and blocks form a **grid**.\n\n```c\n__global__ void vector_add(const float* a, const float* b, float* c, int n) {\n  int i = blockIdx.x * blockDim.x + threadIdx.x;   // which element is mine?\n  if (i < n) c[i] = a[i] + b[i];\n}\nvector_add<<<num_blocks, 256>>>(a, b, c, n);       // launch: grid of blocks of 256 threads\n```\n\nKey facts:\n- **Launches are asynchronous.** The CPU queues work and moves on; to time GPU work you must synchronize. Every \"my GPU is 1000\u00d7 faster\" benchmark that forgets this is wrong.\n- **Kernel launch overhead** is several microseconds. LLM decode runs hundreds of small kernels per token, so launch overhead becomes visible. **CUDA graphs** record the sequence once and replay it with one launch (vLLM does this for decode).\n- **Memory coalescing:** neighbouring threads should read neighbouring addresses so the hardware can combine their loads.\n- **Kernel fusion:** each separate kernel reads its inputs from HBM and writes its outputs back. Fusing `add \u2192 relu \u2192 scale` into one kernel cuts memory traffic 3\u00d7. Triton, `torch.compile` and inference engines fuse aggressively.\n\n**Triton** (used throughout vLLM/SGLang) lets you write kernels in Python at the level of *blocks of data* rather than individual threads. The compiler handles much of the low-level work.\n\n### 1.3 Number formats\n\n| Format | Bytes | Range / precision | Inference use |\n|---|---|---|---|\n| FP32 | 4 | wide range, ~7 digits | almost never for LLM weights; some accumulations |\n| **BF16** | 2 | FP32's range, ~3 digits | default format for weights and activations |\n| FP16 | 2 | narrower range, ~3\u20134 digits | older default; overflow risk |\n| **FP8** (E4M3 / E5M2) | 1 | needs per-tensor/channel scales | weights + activations + KV cache on Ada/Hopper/Blackwell |\n| INT8 | 1 | integers + scale | weight (and activation) quantization |\n| INT4 / FP4 | 0.5 | needs group scales | weight-only quantization (AWQ/GPTQ); FP4 on Blackwell |\n\nFewer bytes per weight means less memory to read per decode step (faster), more room for KV cache (more users) and faster tensor-core math. The cost is accuracy, which you have to measure (level 7).\n\n### 1.4 The GPUs you'll meet on AWS\n\nApproximate datasheet values. Check the exact SKU, since cloud variants can differ.\n\n| GPU | Generation | Memory | Bandwidth | Dense BF16 | FP8 | AWS instances | Sweet spot |\n|---|---|---|---|---|---|---|---|\n| T4 | Turing (2018) | 16 GB | 320 GB/s | ~65 TFLOP/s | no | g4dn | tiny models, legacy |\n| A10G | Ampere | 24 GB | 600 GB/s | ~70 | no | g5 | 7\u20138B in BF16, cheap |\n| L4 | Ada | 24 GB | 300 GB/s | ~121 | **yes** | g6 | 7\u20138B (FP8 helps a lot), low power |\n| L40S | Ada | 48 GB | 864 GB/s | ~362 | **yes** | g6e | 8\u201334B, or 70B with 4 GPUs |\n| A100 40/80GB | Ampere | 40/80 GB | 1.6\u20132.0 TB/s | 312 | no | p4d / p4de | 70B with TP, NVLink |\n| H100 | Hopper | 80 GB | 3.35 TB/s | ~989 | **yes** | p5 | large models, high throughput |\n| H200 | Hopper | 141 GB | 4.8 TB/s | ~989 | **yes** | p5e / p5en | 70B on fewer GPUs, long context |\n| B200 | Blackwell | ~180 GB | ~8 TB/s | ~2,250 | yes + FP4 | p6-b200 | frontier scale |\n\nHow to read the table for inference:\n- **Does it fit?** Memory column (level 6 does the math).\n- **How fast is decode?** Bandwidth column. The L4 has *more* FLOPs than the A10G but *half* the bandwidth. At small batch it decodes BF16 models more slowly, while its FP8 support (halving bytes per weight) can recover the difference.\n- **How fast is prefill / large-batch work?** The FLOPs column.\n- **Can I split a model across GPUs efficiently?** NVLink is only on the p-family here; g-family multi-GPU instances use PCIe.\n\n### 1.5 Multi-GPU interconnects\n\n| Link | Rough bandwidth per GPU | Where |\n|---|---|---|\n| PCIe Gen4 x16 / Gen5 x16 | ~32 / ~64 GB/s per direction | every GPU, g-family multi-GPU |\n| NVLink (A100 / H100) | 600 / 900 GB/s total | p4d, p5 (8 GPUs, all-to-all via NVSwitch) |\n| EFA (AWS networking) | 400\u20133,200 Gbps per instance | p4d/p5 multi-node |\n\nTensor parallelism does an all-reduce in every layer (level 7), so it wants NVLink. Pipeline parallelism sends much less data between stages and tolerates slower networks.\n\n---\n\n## 2. Worked example: reading `nvidia-smi`\n\n```\n+-----------------------------------------------------------------------------------------+\n| NVIDIA-SMI 550.xx       Driver Version: 550.xx       CUDA Version: 12.4                 |\n| GPU  Name        Persistence-M | Bus-Id   Disp.A | Volatile Uncorr. ECC |               |\n| Fan  Temp  Perf  Pwr:Usage/Cap |     Memory-Usage | GPU-Util  Compute M. |               |\n|   0  NVIDIA L4             On  | 00000000:31:00.0 Off |               0 |               |\n| N/A   54C    P0    68W /  72W  |  21500MiB / 23034MiB |    97%  Default |               |\n```\n\n- `CUDA Version: 12.4` is the **highest CUDA runtime this driver supports**, not what's installed (level 3).\n- `21500MiB / 23034MiB` used: vLLM pre-allocates ~90% of memory for weights plus KV cache at startup, so this looks \"full\" even when idle. **Memory used is not a load signal for vLLM.**\n- `GPU-Util 97%` means \"a kernel was running during the sample window\", not \"97% of compute was used\". A memory-bound decode can show 100% utilization while using 5% of tensor-core FLOPs. Use DCGM metrics such as SM activity and tensor-pipe activity for real utilization (level 12).\n\n## 3. Labs\n\nOn a machine with an NVIDIA GPU (a g6.xlarge, Colab, or your own):\n\n```bash\ncd levels/02-what-is-a-gpu/labs\npython3 gpu_info.py                                   # memory, SMs, compute capability, measured bandwidth\nnvcc -O2 -o vector_add vector_add.cu && ./vector_add  # CUDA C kernel; compare copy vs kernel time\npip install torch triton && python3 vector_add_triton.py   # Triton kernel + kernel fusion speed-up\n```\n\nWhat to observe:\n1. `gpu_info.py`: the measured copy bandwidth should be about 70\u201390% of the datasheet number. That fraction (**MBU**, memory bandwidth utilization) is what you'll plug into level 6's calculator.\n2. `vector_add`: the kernel reaches hundreds of GB/s, while the host\u2194device copies run at PCIe speed and take far longer.\n3. `vector_add_triton.py`: the fused add+relu+scale kernel is about 2\u20133\u00d7 faster than three separate PyTorch ops, purely from less memory traffic.\n\n## 4. Check yourself\n\n<details><summary>1. Which spec decides whether Llama 3.1 70B in BF16 fits on one GPU, and which decides how fast one user's tokens stream?<\/summary>\nMemory capacity (~141 GB of weights needs \u2265 2\u00d7 80 GB, or one H200 with little room left), and memory bandwidth (each token reads all weights).<\/details>\n\n<details><summary>2. Why does nvidia-smi show a vLLM server at 95% memory even with zero traffic?<\/summary>\nvLLM pre-allocates a fixed fraction of GPU memory (`--gpu-memory-utilization`, default 0.9) for weights plus the KV cache block pool at startup.<\/details>\n\n<details><summary>3. What is kernel fusion and why does it speed up memory-bound work?<\/summary>\nIt combines several operations into one kernel so intermediate results stay in registers/SRAM instead of being written to and re-read from HBM. Memory-bound kernels are limited by those HBM round trips.<\/details>\n\n<details><summary>4. Why is \"GPU-Util 100%\" misleading?<\/summary>\nIt only measures whether any kernel was running during the sample period, not how many SMs or tensor cores were busy.<\/details>\n\n## 5. Going deeper\n- NVIDIA H100 / L4 / L40S datasheets and the Hopper architecture whitepaper\n- *Programming Massively Parallel Processors* (Hwu, Kirk, El Hajj)\n- Triton tutorials: vector add \u2192 fused softmax \u2192 matmul\n- Horace He, *Making Deep Learning Go Brrrr From First Principles*\n\n**Next \u2192 [Level 3: The GPU software stack](#level-03)**\n"}, {"id": "level-03", "title": "The GPU software stack", "path": "levels/03-gpu-software-stack/README.md", "num": "03", "tier": "GPU", "md": "# Level 3: The GPU software stack\n\n> Most \"GPU doesn't work\" incidents are version mismatches between layers. Learn the layers once and you can debug them for good.\n\n**You will:** learn the layers from kernel driver to PyTorch, the compatibility rules between them, and how to profile where inference time goes.\n**Time:** 2\u20133 hours \u00b7 **Hardware:** a GPU machine for the labs (Tier 1)\n\n---\n\n## 1. Concepts\n\n### 1.1 The layer cake\n\n```mermaid\nflowchart TB\n    subgraph IMG[\"Container image or pip wheel: you choose these\"]\n        direction TB\n        A[\"Your code: vLLM / SGLang / TensorRT-LLM / transformers\"]\n        B[\"Framework: PyTorch + Triton compiler\"]\n        C[\"Libraries: cuBLAS, cuDNN, NCCL, FlashAttention / FlashInfer\"]\n        D[\"CUDA runtime: libcudart X.Y\"]\n        A --> B --> C --> D\n    end\n    subgraph HOST[\"Host: the AMI, node image or GPU Operator installs these\"]\n        direction TB\n        E[\"NVIDIA Container Toolkit<br/>exposes /dev/nvidia*, mounts driver libraries\"]\n        F[\"User-mode driver: libcuda.so\"]\n        G[\"Kernel driver: nvidia.ko\"]\n        H[\"GPU hardware\"]\n        E --> F --> G --> H\n    end\n    D -->|\"needs driver version >= runtime minimum\"| E\n```\n\n| Layer | Where it lives | Who installs it | Example version |\n|---|---|---|---|\n| Kernel driver + `libcuda` | host OS | AMI / GPU Operator / node image | 550.x, 570.x |\n| NVIDIA Container Toolkit | host | AMI / GPU Operator | 1.17.x |\n| CUDA runtime, cuBLAS, cuDNN, NCCL | container image / wheel | you (via the base image) | CUDA 12.x |\n| PyTorch | container image | you | 2.x+cu12x |\n| Inference engine | container image | you | vLLM vX.Y |\n\n### 1.2 The one compatibility rule to remember\n\n> **Host driver version \u2265 the minimum required by the CUDA runtime inside the container.**\n\n- New driver + old runtime: works (drivers are backward compatible).\n- Old driver + new runtime: `CUDA driver version is insufficient for CUDA runtime version`, or `RuntimeError: No CUDA GPUs are available`.\n- The `CUDA Version` shown by `nvidia-smi` is the **maximum** runtime the driver supports.\n\nOn EKS, the AMI (or EKS Auto Mode) decides the driver. When you upgrade the vLLM image to one built on a newer CUDA, check the node driver first. This is the most common upgrade failure in GPU clusters.\n\n### 1.3 How PyTorch runs a model on the GPU\n\n1. Python calls `model(x)`. Each layer dispatches **kernels** (matmul via cuBLAS, attention via FlashAttention, elementwise ops via PyTorch or Triton).\n2. Kernels go into a **CUDA stream** (a queue) and run asynchronously.\n3. The CPU races ahead queuing work, unless something forces a **sync** (`.item()`, `.cpu()`, printing a tensor).\n4. During decode, each kernel is tiny, so the CPU's Python overhead plus launch latency can become the bottleneck. Engines fix this with **CUDA graphs** (capture once, replay) and by moving scheduling off the critical path.\n\n### 1.4 Multi-GPU: NCCL\n\n**NCCL** implements collectives (all-reduce, all-gather) across GPUs over NVLink, PCIe or the network (EFA on AWS). Tensor parallelism calls all-reduce twice per transformer layer. When multi-GPU inference hangs, it's usually NCCL: mismatched versions, blocked network ports, missing `/dev/shm`, or a missing EFA plugin. `NCCL_DEBUG=INFO` is the first debugging step.\n\n### 1.5 Profiling: where does the time go?\n\n| Tool | What it shows | When |\n|---|---|---|\n| `nvidia-smi dmon -s pucm` | power, utilization, clocks, memory per second | is anything running at all? |\n| DCGM (`dcgmi`, dcgm-exporter) | SM activity, tensor-core activity, memory bandwidth, Xid errors | production fleet metrics (level 12) |\n| PyTorch profiler | per-op and per-kernel time, Chrome trace | \"which part of my model is slow?\" |\n| Nsight Systems (`nsys`) | full timeline: CPU threads, kernel launches, gaps, NCCL | \"why are there gaps between kernels?\" |\n| Nsight Compute (`ncu`) | one kernel's achieved bandwidth/FLOPs vs roofline | kernel tuning |\n\n---\n\n## 2. Worked example: debugging \"CUDA driver version is insufficient\"\n\nSymptom: a new vLLM image crash-loops on a node that ran the old image fine.\n\n```bash\nkubectl logs vllm-xyz | head\n# RuntimeError: ... CUDA driver version is insufficient for CUDA runtime version\nkubectl debug node/ip-10-0-1-23 -it --image=ubuntu -- chroot /host nvidia-smi | head -3\n# Driver Version: 535.x   CUDA Version: 12.2\ndocker run --rm --entrypoint python3 vllm/vllm-openai:<new> -c \"import torch; print(torch.version.cuda)\"\n# 12.8\n```\n\nDiagnosis: the new image's runtime (12.8) needs a newer driver than the node's 535 (max CUDA 12.2). Fix: move GPU nodes to an AMI with a newer driver (e.g. the current EKS AL2023 NVIDIA AMI), or pin the image to a build that matches the driver. Prevention: put driver version on the dashboard, and canary image upgrades on one node first.\n\n## 3. Labs\n\n```bash\ncd levels/03-gpu-software-stack/labs\n./check_stack.sh                          # walk every layer; read the annotations\npip install torch transformers accelerate\npython3 profile_generate.py               # profile one generation; open trace.json in ui.perfetto.dev\n```\n\nWhat to find in the trace:\n1. **Prefill:** a few long GEMM (matmul) kernels. GPU busy, few gaps.\n2. **Decode:** for each token, a repeating pattern of dozens of short kernels with gaps between them. Those gaps are CPU and launch overhead.\n3. In the kernel table: the share of time in matmul vs attention vs elementwise ops. For small models at batch 1, \"everything else\" is surprisingly large.\n\n**Stretch:** run the same generation with `model.generate(..., cache_implementation=\"static\")` plus `torch.compile`, or in vLLM. Compare the decode gaps: CUDA graphs remove most of them.\n\n## 4. Check yourself\n\n<details><summary>1. nvidia-smi shows \"CUDA Version: 12.4\". Does that mean CUDA 12.4 is installed?<\/summary>\nNo. It's the highest CUDA runtime the installed driver supports. The runtime actually used comes from your container or wheel.<\/details>\n\n<details><summary>2. Which layers belong in the container image, and which on the host?<\/summary>\nImage: CUDA runtime, cuBLAS/cuDNN/NCCL, PyTorch, the engine. Host: kernel driver, libcuda, and the container toolkit that exposes them to containers.<\/details>\n\n<details><summary>3. Your decode trace shows 60% of wall time as gaps between kernels. What are two fixes?<\/summary>\nCUDA graphs (replay the whole decode step with one launch), and bigger batches or fused kernels so each launch does more work. Removing per-token Python overhead (async scheduling) also helps.<\/details>\n\n## 5. Going deeper\n- NVIDIA CUDA compatibility documentation (driver/runtime compatibility, forward-compatibility packages)\n- PyTorch profiler recipes; Nsight Systems user guide\n- NCCL environment variables (`NCCL_DEBUG`, `NCCL_SOCKET_IFNAME`) and AWS's EFA + NCCL guides\n\n**Next \u2192 [Level 4: Models from first principles](#level-04)**\n"}, {"id": "level-04", "title": "Models from first principles", "path": "levels/04-models-first-principles/README.md", "num": "04", "tier": "Laptop", "md": "# Level 4: Models from first principles\n\n> You can't size, serve or optimize a model you can't read. By the end of this level, a `config.json` tells you its memory footprint and where the work goes.\n\n**You will:** learn tensors and matmuls, tokenization, the transformer decoder block, MHA/MQA/GQA attention, and parameter counting, and implement each in NumPy.\n**Time:** 4\u20135 hours \u00b7 **Hardware:** laptop (Tier 0)\n\n---\n\n## 1. Concepts\n\n### 1.1 Everything is a matrix multiply\n\nA **tensor** is an n-dimensional array. A **linear layer** `y = x @ W` multiplies a batch of input vectors `x` (shape `[tokens, d_in]`) by a weight matrix `W` (`[d_in, d_out]`). It costs `2 \u00d7 tokens \u00d7 d_in \u00d7 d_out` FLOPs and reads `d_in \u00d7 d_out` weights. More than 95% of a transformer's FLOPs are in matmuls like this one, which is why GPUs (tensor cores) and memory bandwidth matter so much.\n\n### 1.2 Tokenization\n\nModels don't see text. They see **token IDs**. A tokenizer splits text into pieces from a fixed vocabulary (32k\u2013256k entries).\n\n- **Byte-pair encoding (BPE):** start from bytes, then repeatedly merge the most frequent adjacent pair into a new token. Frequent words become single tokens; rare words split into pieces.\n- **Rule of thumb:** ~4 characters or ~0.75 English words per token. Code, non-English scripts and numbers usually take more tokens.\n- **Why it matters for inference:** latency, KV cache memory, context limits and price are all counted in tokens. Hindi or Japanese text can cost 2\u20134\u00d7 more tokens than the same meaning in English with an English-heavy tokenizer.\n\n### 1.3 The decoder-only transformer (Llama-style)\n\n```mermaid\nflowchart TB\n    IDS[\"Token IDs\"] --> EMB[\"Embedding lookup<br/>x: [T, d]\"]\n    EMB --> BLOCK\n    subgraph BLOCK[\"Decoder block \u00b7 repeated L times (32 for Llama 3.1 8B)\"]\n        direction TB\n        N1[\"RMSNorm\"] --> QKV[\"q, k, v = h\u00b7Wq, h\u00b7Wk, h\u00b7Wv\"]\n        QKV --> ROPE[\"RoPE on q and k<br/>(position information)\"]\n        ROPE --> ATT[\"Attention<br/>softmax(q\u00b7k\u1d40/\u221ad_head + causal mask)\u00b7v\"]\n        ATT --> R1((\"+ residual\"))\n        R1 --> N2[\"RMSNorm\"]\n        N2 --> MLP[\"SwiGLU MLP<br/>W_down(SiLU(h\u00b7W_gate) * h\u00b7W_up)\"]\n        MLP --> R2((\"+ residual\"))\n    end\n    BLOCK --> NF[\"Final RMSNorm\"] --> HEAD[\"LM head: x\u00b7W_lm_head\"]\n    HEAD --> LOG[\"Logits [T, vocab]\"] --> SAMP[\"Sampler (level 5)\"]\n```\n\n- **Attention** is the only place tokens interact. Each token's query is compared with every earlier token's key, and the scores weight a sum of their values.\n- **Causal mask:** a token can only attend to itself and earlier tokens. That's what makes generation one-token-at-a-time and makes the KV cache possible (level 5).\n- **MLP** transforms each token independently and holds most of the parameters.\n- **RoPE** encodes position by rotating q and k. **RMSNorm** keeps activations well-scaled.\n\n### 1.4 MHA, MQA and GQA\n\nAttention uses `h` query heads. The question is how many key/value heads there are, because **K and V are what gets cached** for every token:\n\n| Variant | KV heads | KV cache size | Quality | Used by |\n|---|---|---|---|---|\n| Multi-head (MHA) | = h | 1\u00d7 (largest) | baseline | GPT-2, Llama 1/2 7B |\n| Grouped-query (GQA) | h / g (e.g. 8) | g\u00d7 smaller | \u2248 MHA | Llama 3, Qwen 2.5, Mistral |\n| Multi-query (MQA) | 1 | h\u00d7 smaller | slightly lower | some older models (PaLM, Falcon) |\n\nLlama 3.1 8B has 32 query heads and **8 KV heads**, so its KV cache is 4\u00d7 smaller than MHA would need. That means 4\u00d7 more concurrent users per GPU. (DeepSeek's **MLA** compresses KV further with a learned low-rank projection.)\n\n### 1.5 Dense vs Mixture-of-Experts (MoE)\n\nAn MoE model replaces each MLP with N \"expert\" MLPs plus a router that sends each token to the top-k experts (e.g. 2 of 8).\n\n- **Total parameters** (all experts) decide **memory**: Mixtral 8\u00d77B needs ~94 GB in BF16.\n- **Active parameters** per token decide **FLOPs** and, at small batch, bytes read: ~13B for Mixtral.\n- Serving challenges: every expert must stay in memory, load across experts is uneven, and expert parallelism needs all-to-all communication (level 7).\n\n### 1.6 Model files on the Hugging Face Hub\n\n```\nconfig.json                 architecture: layers, hidden size, heads, kv heads, vocab, rope, max positions\ngeneration_config.json      default sampling params, EOS token ids\ntokenizer.json, tokenizer_config.json (incl. chat template)\nmodel-00001-of-00004.safetensors ...  weights, sharded\nmodel.safetensors.index.json          which tensor lives in which shard\n```\n\n- **safetensors** is a simple, memory-mappable format with no code execution. Avoid pickle-based `.bin`/`.pt` checkpoints from untrusted sources, because unpickling can run arbitrary code (level 14).\n- The **chat template** turns a list of messages into the exact token sequence the model was trained on. A wrong template silently degrades quality.\n- **Gated** models (Llama) need a Hugging Face token and an accepted license. Ungated alternatives for labs: Qwen2.5 (0.5B\u201372B).\n\n---\n\n## 2. Worked example: Llama 3.1 8B from its config\n\n```json\n{\"hidden_size\": 4096, \"intermediate_size\": 14336, \"num_hidden_layers\": 32,\n \"num_attention_heads\": 32, \"num_key_value_heads\": 8, \"vocab_size\": 128256}\n```\n\n`head_dim = 4096 / 32 = 128`. KV projection width = 8 \u00d7 128 = 1024.\n\n| Part | Formula | Parameters |\n|---|---|---|\n| Embedding | 128256 \u00d7 4096 | 525.3 M |\n| Attention per layer | q: 4096\u00d74096 + k: 4096\u00d71024 + v: 4096\u00d71024 + o: 4096\u00d74096 | 41.9 M |\n| MLP per layer | 3 \u00d7 4096 \u00d7 14336 | 176.2 M |\n| Norms per layer | 2 \u00d7 4096 | 0.008 M |\n| \u00d7 32 layers | | 6,979.6 M |\n| LM head (untied) | 4096 \u00d7 128256 | 525.3 M |\n| **Total** | | **8.03 B** |\n\nWhat it means: **16.1 GB in BF16**, 8.0 GB in FP8, ~4 GB in INT4 (plus group scales). The MLP holds ~70% of the weights, so it dominates decode bytes. Attention projections are small because of GQA.\n\n## 3. Labs\n\n```bash\ncd levels/04-models-first-principles/labs\npython3 bpe.py            # train a tiny BPE tokenizer; compare token counts across English, Hindi, code\npython3 count_params.py   # reproduce the table above for 8B and 70B; pass any config.json to count it\npython3 attention.py      # MHA vs GQA attention with a causal mask; see the attention matrix\npython3 -m unittest test_level04   # tests: tokenizer round-trip, param counts, GQA == MHA with repeated KV\n```\n\nExercises:\n1. Download `config.json` for `Qwen/Qwen2.5-7B-Instruct` and run `count_params.py` on it. Qwen uses attention biases and tied/untied embeddings differently, so check that your total matches the published size.\n2. In `attention.py`, set `kv = 1` (MQA) and `kv = h` (MHA). Confirm the output shape is unchanged and compute the KV-cache saving.\n3. In `bpe.py`, raise `vocab_size` to 1000. What happens to token counts for corpus-like text vs Hindi? Why do production tokenizers have 100k+ entries?\n\n## 4. Check yourself\n\n<details><summary>1. A model has 70B parameters. How much GPU memory do its weights need in BF16, FP8 and INT4?<\/summary>\n~140 GB, ~70 GB, ~35 GB (plus a little for scales and zero-points).<\/details>\n\n<details><summary>2. Why does GQA matter more for serving than for model quality?<\/summary>\nIt barely changes quality, but it shrinks the KV cache by num_heads / num_kv_heads, which multiplies how many concurrent sequences (and how much context) fit in GPU memory.<\/details>\n\n<details><summary>3. Mixtral 8\u00d77B has ~47B total and ~13B active parameters. Which number sets memory, and which sets FLOPs per token?<\/summary>\nTotal parameters set memory (every expert must be resident). Active parameters set FLOPs per token.<\/details>\n\n<details><summary>4. Why is the causal mask essential for efficient generation?<\/summary>\nBecause token i never depends on later tokens, earlier tokens' keys and values never change as the sequence grows. They can be computed once and cached.<\/details>\n\n## 5. Going deeper\n- Vaswani et al., *Attention Is All You Need* (2017); Ainslie et al., *GQA* (2023)\n- Andrej Karpathy, *Let's build GPT* and *Let's build the GPT tokenizer*; nanoGPT, minbpe\n- Jay Alammar, *The Illustrated Transformer*\n- The Llama 3 paper (*The Llama 3 Herd of Models*): architecture and scaling choices\n\n**Next \u2192 [Level 5: How generation works](#level-05)**\n"}, {"id": "level-05", "title": "How generation works", "path": "levels/05-how-generation-works/README.md", "num": "05", "tier": "Laptop", "md": "# Level 5: How generation works\n\n> An LLM generates text one token at a time. The KV cache, prefill vs decode, and the sampler explain almost every behavior you'll see in production.\n\n**You will:** implement autoregressive generation, prefill and decode, an exact KV cache, every common sampling method, and constrained (JSON) decoding. All of it in NumPy, all of it tested.\n**Time:** 4\u20135 hours \u00b7 **Hardware:** laptop (Tier 0)\n\n---\n\n## 1. Concepts\n\n### 1.1 Autoregressive decoding\n\n```mermaid\nsequenceDiagram\n    participant S as Scheduler\n    participant M as Model\n    participant K as KV cache\n    participant P as Sampler\n    S->>M: prompt tokens (all at once)\n    Note over M,K: PREFILL\n    M->>K: store K and V for every prompt token, every layer\n    M->>P: logits for the last position\n    P-->>S: token t1\n    loop DECODE until EOS, a stop string or max_tokens\n        S->>M: only the newest token\n        M->>K: read all cached K/V, append this token's K/V\n        M->>P: logits\n        P-->>S: next token\n    end\n```\n\nWithout any cache, step *n* re-processes all *n* previous tokens, so generating N tokens costs O(N\u00b2) work.\n\n### 1.2 The KV cache\n\nBecause of the causal mask (level 4), the keys and values of earlier tokens **never change**. So:\n\n- **Prefill:** run the whole prompt in one forward pass, **store K and V** for every layer and every token, and output the first token.\n- **Decode:** feed only the *newest* token, compute its q, k, v, append its k and v to the cache, and attend over the whole cache.\n\nThe output is **mathematically identical** (the lab tests this). The cost is memory:\n\n```\nKV bytes per token = 2 (K and V) \u00d7 layers \u00d7 kv_heads \u00d7 head_dim \u00d7 bytes_per_element\n```\n\n| Model | Per token (BF16) | One 8k-token sequence | 64 such sequences |\n|---|---|---|---|\n| Llama 3.1 8B (32 layers, 8 KV heads, 128 dim) | 128 KiB | 1 GiB | 64 GiB |\n| Llama 3.1 70B (80 layers, 8 KV heads, 128 dim) | 320 KiB | 2.5 GiB | 160 GiB |\n\n**The KV cache, not the weights, is usually what limits how many users one GPU can serve.** Most of level 7 (PagedAttention, prefix caching, FP8 KV, offloading) is about managing this memory.\n\n### 1.3 Prefill vs decode, again\n\n| | Prefill | Decode |\n|---|---|---|\n| Tokens per forward pass | the whole prompt (100s\u2013100,000s) | 1 per sequence |\n| Bottleneck | compute (matmuls) | memory bandwidth (weights + KV reads) |\n| Sets | TTFT | ITL / TPOT |\n| Scales with | prompt length | batch size and context length (KV reads) |\n\n### 1.4 Sampling: from logits to a token\n\nThe model outputs a **logit** (unnormalized score) for each vocabulary entry. The sampler runs a pipeline:\n\n1. **Penalties:** repetition / presence / frequency penalties adjust logits of tokens already generated.\n2. **Temperature** `T`: divide logits by T. T\u21920 means greedy; T=1 keeps the model's own distribution; T>1 flattens it and raises randomness.\n3. **Truncation:** **top-k** (keep the k most likely), **top-p** / nucleus (keep the smallest set whose probability mass reaches p), **min-p** (keep tokens with at least `min_p \u00d7 p_max`).\n4. **Sample** from what remains (or take the argmax for greedy).\n\nProduction notes:\n- **Determinism:** greedy decoding on a GPU is *not* guaranteed bit-identical across runs, because batch composition changes the order of floating-point additions. Don't promise users \"same input, same output\".\n- **Logprobs:** engines can return the log-probability of each chosen token. That's useful for evals, classification and confidence scores.\n- **Stop conditions:** EOS token, user stop strings, `max_tokens`. A response that \"cuts off mid-sentence\" almost always hit `max_tokens` (`finish_reason: \"length\"`).\n\n### 1.5 Structured output (JSON mode, tool calling)\n\nTo guarantee output matches a JSON schema or grammar, the engine **masks invalid tokens** at every step: their logits are set to \u2212\u221e before sampling. The schema is compiled into an automaton that says, given the text so far, which tokens may come next. vLLM supports several structured-output backends (e.g. xgrammar, guidance, outlines). The cost is a little CPU work per step. The benefit is zero parse errors.\n\n---\n\n## 2. Worked examples\n\n**Example A: KV cache memory for a chatbot.** Llama 3.1 8B on a 24 GB L4 in BF16: weights 16.1 GB. With `--gpu-memory-utilization 0.9`, that leaves 21.6 GB \u2212 16.1 GB \u2212 ~1.5 GB activations \u2248 **4 GB for KV cache** \u2248 32k tokens. That's 4 users at 8k context, or 32 users at 1k context. Switch to FP8 weights (8 GB) plus FP8 KV (64 KiB/token) and you get ~12 GB of KV, ~190k tokens: **6\u00d7 the concurrency on the same GPU.**\n\n**Example B: why `temperature=0` still varies.** A user reports different answers to the same prompt at temperature 0. Under load, the request was batched with different neighbours, the matmul reduction order changed, two top logits within 1e-3 of each other swapped order, and the text diverged from that token onwards. The fix is product-level (don't rely on exact reproducibility), not a bug fix.\n\n## 3. Labs\n\n```bash\ncd levels/05-how-generation-works/labs\npython3 tiny_llama.py      # a full Llama-style model in NumPy: generate with and without KV cache\npython3 sampling.py        # see how temperature, top-k, top-p, min-p reshape a distribution\npython3 constrained.py     # a random \"model\" that can only emit valid JSON, thanks to masking\npython3 -m unittest test_level05\n```\n\nSample output of `tiny_llama.py`:\n\n```\nprompt 41 tokens, generate 48 tokens (greedy)\n  without KV cache:   289.7 ms\n  with KV cache:       48.0 ms   (6.0x faster, identical tokens)\n  prefill 3.72 ms for 41 tokens; decode 0.92 ms per token\n  cache now holds 88 tokens = 44 KiB in BF16 (2 x 4 layers x 2 kv_heads x 16 head_dim x 2 bytes per token)\n```\n\nExercises:\n1. Increase the prompt to 400 tokens and `n` to 200. How does the speed-up change, and why does it grow with length?\n2. In `tiny_llama.py`, set `kv_heads = heads` (MHA). How much bigger is the cache?\n3. Add **stop strings** to `generate_with_cache`: stop when the decoded output ends with any string in a list. What's tricky when a stop string spans two tokens?\n4. Extend `constrained.py` so the allowed set is \"any integer from 0 to 999\". Hint: you don't need a trie of 1,000 strings; write the state machine.\n\n## 4. Check yourself\n\n<details><summary>1. Why is the KV cache exact rather than an approximation?<\/summary>\nWith causal attention, earlier tokens' K and V depend only on earlier tokens, which never change. Recomputing them gives the same numbers.<\/details>\n\n<details><summary>2. Compute the KV cache of one 32k-token sequence for Llama 3.1 70B in BF16.<\/summary>\n320 KiB \u00d7 32,768 \u2248 10 GiB. One long-context user can take more memory than many short-chat users together.<\/details>\n\n<details><summary>3. top_p=0.9 with a very peaked distribution (top token p=0.95): how many tokens remain?<\/summary>\nOne. The top token alone already reaches 0.9 of the mass.<\/details>\n\n<details><summary>4. A JSON-mode response is valid but semantically wrong. Did constrained decoding fail?<\/summary>\nNo. Constraints guarantee syntax and schema validity, not correctness. The model's logits still choose among the valid options.<\/details>\n\n## 5. Going deeper\n- Pope et al., *Efficiently Scaling Transformer Inference* (2022): KV cache, partitioning, the memory math\n- Holtzman et al., *The Curious Case of Neural Text Degeneration* (nucleus sampling); Nguyen et al., min-p sampling\n- Willard & Louf, *Efficient Guided Generation for LLMs* (Outlines); the XGrammar paper\n- vLLM docs: Sampling Parameters, Structured Outputs\n\n**Next \u2192 [Level 6: Performance math](#level-06)**\n"}, {"id": "level-06", "title": "Performance math", "path": "levels/06-performance-math/README.md", "num": "06", "tier": "Laptop", "md": "# Level 6: Performance math\n\n> If you can estimate memory, speed and cost on a whiteboard to within 2\u00d7, you can make good decisions before spending a dollar on GPUs. This is the most useful skill in the course.\n\n**You will:** learn six formulas, the roofline model applied to LLMs, and a calculator (Go) you'll use for every later decision.\n**Time:** 3\u20134 hours \u00b7 **Hardware:** laptop (Tier 0)\n\n---\n\n## 1. The six formulas\n\nLet `P` = parameters, `b` = bytes per weight, `L` = layers, `Hkv` = KV heads, `d` = head dim, `bkv` = bytes per KV element.\n\n| # | Quantity | Formula | Llama 3.1 8B, BF16 |\n|---|---|---|---|\n| 1 | Weight memory | `P \u00d7 b` | 8.03e9 \u00d7 2 = **16.1 GB** |\n| 2 | KV cache per token | `2 \u00d7 L \u00d7 Hkv \u00d7 d \u00d7 bkv` | 2\u00d732\u00d78\u00d7128\u00d72 = **128 KiB** |\n| 3 | Max concurrent sequences | `(mem \u00d7 util \u2212 weights \u2212 overhead) / (KV/token \u00d7 context)` | (24\u00d70.9 \u2212 16.1 \u2212 1) / (128 KiB \u00d7 4096) \u2248 **8** on a 24 GB GPU |\n| 4 | Decode step time (memory-bound) | `(active weight bytes + batch \u00d7 KV bytes read) / (bandwidth \u00d7 MBU)` | (16.1 GB + 8 \u00d7 0.54 GB) / (600 GB/s \u00d7 0.75) \u2248 **45 ms** on an A10G |\n| 5 | Prefill time (compute-bound) | `2 \u00d7 P_active \u00d7 prompt_tokens / (peak FLOP/s \u00d7 MFU)` | 2\u00d78e9\u00d71024 / (70e12\u00d70.5) \u2248 **470 ms** on an A10G |\n| 6 | Cost per 1M output tokens | `$/hour / (aggregate tok/s \u00d7 3600) \u00d7 1e6` | $1/h \u00f7 (177 tok/s \u00d7 3600) \u00d7 1e6 \u2248 **$1.57** |\n\n**MBU** (memory bandwidth utilization, typically 0.6\u20130.85) and **MFU** (model FLOPs utilization, typically 0.3\u20130.6) are how far real kernels fall short of the datasheet. Measure your own (level 2's `gpu_info.py`, level 9's benchmarks) and plug them in.\n\nConservative simplification: formula 3 uses the *full* context per sequence. Real requests are at various stages of generation, so measured concurrency is usually higher. vLLM prints its own number at startup (\"Maximum concurrency for N tokens per request\").\n\n## 2. The roofline model for LLMs\n\n`attainable FLOP/s = min(peak FLOP/s, memory bandwidth \u00d7 arithmetic intensity)`\n\nH100 SXM in BF16: the ridge point is 989e12 / 3.35e12 \u2248 295 FLOPs/byte. Left of it, kernels
