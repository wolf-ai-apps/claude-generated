<title>AI Inference Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a course reader. Fixed level index on the left (like a datasheet's table of contents), one lesson column on the right. */
:root {
  --bg: #f4f6f8;          /* cool paper */
  --surface: #ffffff;
  --ink: #17202b;
  --muted: #5a6776;
  --rule: #d9dfe6;
  --accent: #0a6e7d;      /* HBM teal */
  --accent-soft: #e1f0f2;
  --signal: #b35c00;      /* the one warm accent: tiers, "done" */
  --code-bg: #eef1f4;
  --done: #2c7a3f;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #151d26; --ink: #e4e9ef; --muted: #96a3b1; --rule: #273340;
    --accent: #5fc3cf; --accent-soft: #15303a; --signal: #f0a050; --code-bg: #1b2530; --done: #6cc784;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #151d26; --ink: #e4e9ef; --muted: #96a3b1; --rule: #273340;
  --accent: #5fc3cf; --accent-soft: #15303a; --signal: #f0a050; --code-bg: #1b2530; --done: #6cc784;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }

/* ---------- sidebar ---------- */
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--rule);
  padding-block: 24px 32px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
.brand-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -.01em; }
.progress { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--code-bg); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
.nav-top { display: flex; flex-direction: column; gap: 2px; }
.part { display: flex; flex-direction: column; gap: 2px; }
.part-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 8px 4px; }
.nav-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; gap: 6px;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3; }
.nav-item:hover { background: var(--code-bg); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav-item[aria-current="page"] .nav-num { color: var(--accent); }
.nav-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-check { font-size: 12px; color: var(--done); width: 14px; text-align: right; }
.nav-plain { grid-template-columns: minmax(0, 1fr) auto; }

/* ---------- mobile bar ---------- */
.mobile-bar { display: none; }

/* ---------- lesson ---------- */
.main { padding-block: 40px 80px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); min-width: 0; }
.lesson { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.chip { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); }
.chip.tier { color: var(--signal); border-color: currentColor; }
.chip.lvl { color: var(--accent); border-color: currentColor; }

.prose { min-width: 0; }
.prose h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 5vw, 46px); line-height: 1.05; letter-spacing: -.015em; margin: 0 0 18px; text-wrap: balance; }
.prose h2 { font-family: var(--font-display); font-weight: 600; font-size: 27px; line-height: 1.15; margin: 48px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); text-wrap: balance; }
.prose h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 30px 0 8px; text-wrap: balance; }
.prose p, .prose li { max-width: 68ch; }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 22px; }
.prose li { margin: 4px 0; }
.prose li > p { margin: 0; }
.prose strong { font-weight: 600; }
.prose blockquote { margin: 0 0 24px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: 17.5px; }
.prose blockquote p { margin: 0; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0; }
.prose code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.prose pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 18px; line-height: 1.5; position: relative; }
.prose pre code { background: none; padding: 0; font-size: 13.5px; white-space: pre; }
.copy { position: absolute; top: 8px; right: 8px; font: 500 11px var(--font-mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.prose pre:hover .copy, .copy:focus-visible { opacity: 1; }
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.45; }
.prose th, .prose td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.prose th { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .02em; background: var(--code-bg); white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose td code { white-space: nowrap; }
.prose details { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); margin: 0 0 10px; padding: 0 16px; }
.prose summary { cursor: pointer; padding: 12px 0; font-weight: 500; list-style-position: outside; }
.prose details[open] { padding-bottom: 12px; }
.prose details[open] summary { border-bottom: 1px solid var(--rule); margin-bottom: 10px; color: var(--accent); }

.done-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--rule); }
.btn { font: 500 15px var(--font-body); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--accent); }
.btn.mark[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--surface); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager .dir { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pager .next { text-align: right; grid-column: 2; }
.source { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); height: 100%; z-index: 30; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 15, 20, .45); z-index: 25; }
  .mobile-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mobile-bar .title { font-family: var(--font-display); font-weight: 600; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .prose h2 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="mobile-bar">
  <button class="btn" id="menu-btn" aria-controls="side" aria-expanded="false">Levels</button>
  <span class="title" id="mobile-title">AI Inference Academy</span>
</div>
<div class="shell">
  <nav class="side" id="side" aria-label="Course levels">
    <a class="brand" href="#home">
      <span class="brand-kicker">GPU to production</span>
      <span class="brand-name">AI Inference Academy</span>
    </a>
    <div class="progress">
      <span id="progress-text">0 of 16 levels done</span>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>
    <div class="nav-top" id="nav-top"></div>
    <div id="nav-parts" style="display:flex;flex-direction:column;gap:18px"></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main">
    <article class="lesson">
      <div class="meta" id="meta"></div>
      <div class="prose" id="content"></div>
      <div class="done-row" id="done-row">
        <button class="btn mark" id="mark-btn" aria-pressed="false">Mark level as done</button>
        <a class="source" id="source-link" href="#" target="_blank" rel="noopener">View source on GitHub</a>
      </div>
      <nav class="pager" id="pager" aria-label="Previous and next level"></nav>
    </article>
  </main>
</div>

<script id="academy-data" type="application/json">__DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("academy-data").textContent);
  const pages = DATA.pages;
  const byId = Object.fromEntries(pages.map(p => [p.id, p]));
  const levels = pages.filter(p => p.num);
  const STORE = "academy-done-v1";

  function loadDone() { try { return new Set(JSON.parse(localStorage.getItem(STORE) || "[]")); } catch (e) { return new Set(); } }
  function saveDone(s) { try { localStorage.setItem(STORE, JSON.stringify([...s])); } catch (e) {} }
  let done = loadDone();

  function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---- nav ----
  const navTop = document.getElementById("nav-top");
  navTop.innerHTML = ["home", "curriculum"].map(id =>
    `<a class="nav-item nav-plain" href="#${id}" data-id="${id}"><span>${esc(byId[id].title)}</span><span></span></a>`).join("");
  document.getElementById("nav-parts").innerHTML = DATA.parts.map(([label, nums]) =>
    `<div class="part"><div class="part-label">${esc(label)}</div>` +
    nums.map(n => { const p = byId["level-" + n]; return `<a class="nav-item" href="#${p.id}" data-id="${p.id}">
      <span class="nav-num">${n}</span><span>${esc(p.title)}</span><span class="nav-check" data-check="${p.id}"></span></a>`; }).join("") +
    `</div>`).join("");

  function paintProgress() {
    const n = levels.filter(p => done.has(p.id)).length;
    document.getElementById("progress-text").textContent = `${n} of ${levels.length} levels done`;
    document.getElementById("progress-bar").style.width = (100 * n / levels.length) + "%";
    document.querySelectorAll("[data-check]").forEach(el => { el.textContent = done.has(el.dataset.check) ? "✓" : ""; });
  }

  // ---- render ----
  marked.setOptions({ gfm: true, breaks: false });
  const content = document.getElementById("content");
  function render(id) {
    const p = byId[id] || byId.home;
    content.innerHTML = marked.parse(p.md);
    content.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });
    content.querySelectorAll("pre").forEach(pre => {
      const b = document.createElement("button"); b.className = "copy"; b.type = "button"; b.textContent = "Copy";
      b.addEventListener("click", () => {
        const text = pre.querySelector("code")?.innerText ?? pre.innerText;
        const ok = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1400); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre.querySelector("code") || pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; };
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
      pre.appendChild(b);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });

    const meta = document.getElementById("meta");
    meta.innerHTML = p.num ? `<span class="chip lvl">Level ${p.num} of 15</span><span class="chip tier">${esc(p.tier)}</span>` : "";
    meta.hidden = !p.num;

    const markBtn = document.getElementById("mark-btn");
    document.getElementById("done-row").hidden = false;
    markBtn.hidden = !p.num;
    const isDone = done.has(p.id);
    markBtn.setAttribute("aria-pressed", String(isDone));
    markBtn.textContent = isDone ? "✓ Done" : "Mark level as done";
    markBtn.onclick = () => { done.has(p.id) ? done.delete(p.id) : done.add(p.id); saveDone(done); paintProgress(); render(p.id); };
    document.getElementById("source-link").href = DATA.gh + p.path;

    const order = ["home", ...levels.map(l => l.id)];
    const i = order.indexOf(p.id);
    const prev = i > 0 ? byId[order[i - 1]] : null;
    const next = i >= 0 && i < order.length - 1 ? byId[order[i + 1]] : (p.id === "curriculum" ? byId["level-00"] : null);
    const label = q => q.num ? `${q.num} · ${esc(q.title)}` : esc(q.title);
    document.getElementById("pager").innerHTML =
      (prev ? `<a href="#${prev.id}"><span class="dir">Previous</span><span>${label(prev)}</span></a>` : "") +
      (next ? `<a class="next" href="#${next.id}"><span class="dir">Next</span><span>${label(next)}</span></a>` : "");

    document.querySelectorAll(".nav-item").forEach(a => a.toggleAttribute("aria-current", false));
    const cur = document.querySelector(`.nav-item[data-id="${p.id}"]`);
    if (cur) cur.setAttribute("aria-current", "page");
    document.getElementById("mobile-title").textContent = p.num ? `${p.num} · ${p.title}` : p.title;
    window.scrollTo(0, 0);
  }

  // ---- mobile menu ----
  const side = document.getElementById("side"), scrim = document.getElementById("scrim"), menuBtn = document.getElementById("menu-btn");
  function setMenu(open) { side.classList.toggle("open", open); scrim.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); }
  menuBtn.addEventListener("click", () => setMenu(!side.classList.contains("open")));
  scrim.addEventListener("click", () => setMenu(false));
  side.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

  function route() { const id = location.hash.slice(1); render(byId[id] ? id : "home"); }
  window.addEventListener("hashchange", route);
  paintProgress();
  route();
})();
</script>
