<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Life of a Prompt — explainer</title>
<style>
  html, body { margin: 0; background: #0e1116; }
  canvas { display: block; width: 100vw; max-width: 1280px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// A 3Blue1Brown-style explainer of the Promptlife design, drawn on a canvas.
// Deterministic: renderFrame(seconds) draws the exact frame for that time,
// so the renderer can step through it frame by frame. Open this file in a
// browser to watch it live.

const W = 1280, H = 720, OUT_W = 1920, OUT_H = 1080;
const cv = document.getElementById('c');
cv.width = OUT_W; cv.height = OUT_H;
const ctx = cv.getContext('2d');

const C = {
  bg: '#0e1116', grid: '#1b2530', axis: '#3a4a5a',
  white: '#ECECEC', grey: '#8A939C', dim: '#4B5560',
  blue: '#58C4DD', teal: '#5CD0B3', green: '#83C167', yellow: '#F4D35E',
  gold: '#F0AC5F', red: '#FC6255', purple: '#A98BD6', pink: '#E58FB5',
};
const SERIF = '"DejaVu Serif", Georgia, serif';
const SANS = '"DejaVu Sans", "Helvetica Neue", Arial, sans-serif';
const MONO = '"DejaVu Sans Mono", Menlo, monospace';

// ---------- easing and timing ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = (t, a, b) => smooth(seg(t, a, b));
const lerp = (a, b, p) => a + (b - a) * p;
const fadeIO = (t, a, b, f = 0.35) => Math.min(sm(t, a, a + f), 1 - sm(t, b - f, b));

// ---------- drawing primitives ----------
function withAlpha(a, fn) { if (a <= 0.001) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function setFont(o) { ctx.font = `${o.weight || 'normal'} ${o.size || 20}px ${o.font || SANS}`; }

// Text with a "write-on" reveal: p = 0..1 of characters shown.
function text(str, x, y, o = {}) {
  const p = o.write ?? 1, alpha = o.alpha ?? 1;
  if (p <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(o);
  ctx.fillStyle = o.color || C.white;
  ctx.textBaseline = o.baseline || 'middle';
  const lines = String(str).split('\n');
  const lh = (o.size || 20) * (o.lh || 1.3);
  const total = lines.reduce((n, l) => n + l.length, 0);
  let budget = p * total;
  lines.forEach((line, i) => {
    const full = ctx.measureText(line).width;
    const align = o.align || 'center';
    const x0 = align === 'center' ? x - full / 2 : align === 'right' ? x - full : x;
    const yy = y + (i - (lines.length - 1) / 2) * lh;
    const shown = Math.floor(clamp(budget, 0, line.length));
    ctx.textAlign = 'left';
    const head = line.slice(0, shown);
    ctx.fillText(head, x0, yy);
    if (shown < line.length && budget - shown > 0) {
      ctx.save(); ctx.globalAlpha *= budget - shown;
      ctx.fillText(line[shown], x0 + ctx.measureText(head).width, yy);
      ctx.restore();
    }
    budget -= line.length;
  });
  ctx.restore();
}

// Rounded box whose outline draws itself, then fills, then shows its label.
function box(x, y, w, h, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const color = o.color || C.blue, r = o.r ?? 10;
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  const per = 2 * (w + h);
  const pf = sm(p, 0.45, 1);
  if (o.glow) { ctx.shadowColor = o.glowColor || color; ctx.shadowBlur = 24 * o.glow; }
  rrPath(x, y, w, h, r);
  ctx.fillStyle = o.fillColor || color;
  ctx.save(); ctx.globalAlpha *= (o.fillAlpha ?? 0.14) * pf; ctx.fill(); ctx.restore();
  ctx.setLineDash(o.dash ? o.dash : [per * smooth(clamp(p / 0.7)), per + 20]);
  if (o.dash) ctx.globalAlpha *= smooth(clamp(p / 0.7));
  ctx.lineWidth = o.lw || 2.5;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
  if (o.label) text(o.label, x + w / 2, y + h / 2 + (o.sub ? -10 : 0), {
    size: o.size || 20, color: o.labelColor || C.white, weight: o.weight || 'bold',
    font: o.font || SANS, write: sm(p, 0.4, 1), alpha: o.alpha ?? 1,
  });
  if (o.sub) text(o.sub, x + w / 2, y + h / 2 + 14, {
    size: o.subSize || 13, color: o.subColor || C.grey, font: o.subFont || SANS,
    write: sm(p, 0.6, 1), alpha: o.alpha ?? 1,
  });
}

function arrowHead(x, y, ang, size, color) {
  ctx.save(); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - size * Math.cos(ang - 0.42), y - size * Math.sin(ang - 0.42));
  ctx.lineTo(x - size * Math.cos(ang + 0.42), y - size * Math.sin(ang + 0.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function arrow(x1, y1, x2, y2, o = {}) {
  const p = o.p ?? 1; if (p <= 0) return;
  const color = o.color || C.grey;
  const xe = lerp(x1, x2, smooth(p)), ye = lerp(y1, y2, smooth(p));
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.strokeStyle = color; ctx.lineWidth = o.lw || 2.5;
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(xe, ye); ctx.stroke();
  ctx.setLineDash([]);
  if (p > 0.05 && !o.noHead) arrowHead(xe, ye, Math.atan2(y2 - y1, x2 - x1), o.head || 12, color);
  ctx.restore();
  if (o.label) text(o.label, (x1 + x2) / 2 + (o.lx || 0), (y1 + y2) / 2 + (o.ly ?? -14),
    { size: o.lsize || 14, color: o.lcolor || C.grey, write: sm(p, 0.5, 1), alpha: o.alpha ?? 1 });
}

function quadPoint(x1, y1, cx, cy, x2, y2, p) {
  const a = (1 - p) * (1 - p), b = 2 * (1 - p) * p, c = p * p;
  return [a * x1 + b * cx + c * x2, a * y1 + b * cy + c * y2];
}

function curveArrow(x1, y1, cx, cy, x2, y2, o = {}) {
  const p = smooth(o.p ?? 1); if (p <= 0) return;
  const color = o.color || C.grey;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.strokeStyle = color; ctx.lineWidth = o.lw || 2.5;
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1);
  const N = 40; let last = [x1, y1], prev = [x1, y1];
  for (let i = 1; i <= N; i++) { prev = last; last = quadPoint(x1, y1, cx, cy, x2, y2, p * i / N); ctx.lineTo(last[0], last[1]); }
  ctx.stroke(); ctx.setLineDash([]);
  if (p > 0.05) arrowHead(last[0], last[1], Math.atan2(last[1] - prev[1], last[0] - prev[0]), 12, color);
  ctx.restore();
}

function dot(x, y, r, color, alpha = 1, glow = 1) {
  withAlpha(alpha, () => {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 18 * glow;
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  });
}

function pill(str, x, y, color, alpha = 1, size = 15) {
  withAlpha(alpha, () => {
    setFont({ size, font: MONO });
    const w = ctx.measureText(str).width + 24, h = size + 16;
    rrPath(x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fillStyle = '#151b22'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
    text(str, x, y + 1, { size, font: MONO, color });
  });
}

function polyPoint(pts, p) {
  const lens = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); lens.push(l); total += l; }
  let d = clamp(p) * total;
  for (let i = 0; i < lens.length; i++) {
    if (d <= lens[i] || i === lens.length - 1) { const q = lens[i] ? clamp(d / lens[i]) : 1; return [lerp(pts[i][0], pts[i + 1][0], q), lerp(pts[i][1], pts[i + 1][1], q)]; }
    d -= lens[i];
  }
  return pts[pts.length - 1];
}

function check(x, y, s, color, p = 1) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const pts = [[x - s, y], [x - s / 3, y + s * 0.7], [x + s, y - s * 0.7]];
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  const a = polyPoint(pts, smooth(p));
  if (p < 0.4) ctx.lineTo(...a); else { ctx.lineTo(...pts[1]); ctx.lineTo(...a); }
  ctx.stroke(); ctx.restore();
}

function cross(x, y, s, color, p = 1) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const a = smooth(clamp(p * 2)), b = smooth(clamp(p * 2 - 1));
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x - s + 2 * s * a, y - s + 2 * s * a);
  if (b > 0) { ctx.moveTo(x + s, y - s); ctx.lineTo(x + s - 2 * s * b, y - s + 2 * s * b); }
  ctx.stroke(); ctx.restore();
}

function person(x, y, color, alpha = 1) {
  withAlpha(alpha, () => {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y - 14, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + 14, 16, Math.PI, 0); ctx.stroke();
    ctx.restore();
  });
}

function cylinder(x, y, w, h, color, alpha = 1, label = '') {
  withAlpha(alpha, () => {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.fillStyle = color;
    const ry = 10;
    ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h);
    ctx.ellipse(x + w / 2, y + h, w / 2, ry, 0, Math.PI, 0, true); ctx.lineTo(x + w, y); ctx.stroke();
    ctx.restore();
    if (label) text(label, x + w / 2, y + h / 2 + 6, { size: 14, color });
  });
}

function caption(cues, t) {
  for (const [a, b, str] of cues) {
    if (t < a || t > b) continue;
    const al = fadeIO(t, a, b, 0.3);
    withAlpha(al, () => {
      setFont({ size: 22 });
      const words = str.split(' '); const lines = []; let cur = '';
      for (const w of words) { const nx = cur ? cur + ' ' + w : w; if (ctx.measureText(nx).width > 1080 && cur) { lines.push(cur); cur = w; } else cur = nx; }
      lines.push(cur);
      const bh = 22 + lines.length * 30;
      const y0 = 700 - bh;
      ctx.fillStyle = 'rgba(8,10,14,0.72)';
      rrPath(80, y0, 1120, bh, 10); ctx.fill();
      lines.forEach((l, i) => text(l, 640, y0 + 26 + i * 30, { size: 22, color: C.white }));
    });
  }
}

function chapterTag(str, t) {
  if (!str) return;
  text(str, 40, 36, { size: 15, color: C.grey, align: 'left', alpha: sm(t, 0.2, 0.8), font: MONO });
}

// ---------- scenes ----------
const scenes = [];

// 1 · Title
scenes.push({ dur: 8, tag: '', cues: [[3.6, 8, 'It starts with one question.']], draw(t) {
  text('The Life of a Prompt', 640, 240, { size: 66, font: SERIF, write: sm(t, 0.2, 2.2) });
  text('how one question travels through an LLM agent platform', 640, 305, { size: 22, color: C.grey, alpha: sm(t, 2, 3) });
  const a = sm(t, 3, 3.6);
  withAlpha(a, () => {
    rrPath(370, 395, 540, 74, 16); ctx.lineWidth = 2.5; ctx.strokeStyle = C.grey; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(420, 469); ctx.lineTo(408, 492); ctx.lineTo(446, 469); ctx.strokeStyle = C.grey; ctx.stroke();
  });
  text("Where's my refund for order #4417?", 640, 432, { size: 26, color: C.yellow, write: seg(t, 3.7, 6) });
  if (t > 6 && Math.floor(t * 2) % 2 === 0) withAlpha(a, () => { ctx.fillStyle = C.yellow; ctx.fillRect(868, 418, 3, 28); });
}});

// 2 · The naive picture, then the layers
scenes.push({ dur: 12, tag: 'the naive picture', cues: [
  [0.3, 4.6, 'The usual picture: a question goes in, an answer comes out.'],
  [4.8, 7.2, "But a model on its own can't look up order #4417. It has no data and can't take action."],
  [7.4, 12, 'In practice the question passes through many layers. We will follow it through each one.'],
], draw(t) {
  const out = 1 - sm(t, 7, 7.8);
  withAlpha(out, () => {
    box(110, 320, 240, 80, { p: sm(t, 0.2, 1.4), color: C.yellow, label: 'question' });
    box(520, 300, 240, 120, { p: sm(t, 0.6, 1.8), color: C.blue, label: 'LLM', size: 30 });
    box(930, 320, 240, 80, { p: sm(t, 1.0, 2.2), color: C.green, label: 'answer' });
    arrow(352, 360, 516, 360, { p: sm(t, 1.8, 2.6), color: C.grey });
    arrow(762, 360, 926, 360, { p: sm(t, 2.2, 3.0), color: C.grey });
    const d = seg(t, 3, 4.6);
    if (d > 0 && d < 1) { const [x, y] = polyPoint([[230, 360], [640, 360], [1050, 360]], smooth(d)); dot(x, y, 8, C.yellow); }
    text('?', 640, 255, { size: 56, color: C.red, font: SERIF, alpha: sm(t, 5, 5.6) });
    text('no order data · no actions', 640, 445, { size: 16, color: C.red, alpha: sm(t, 5.4, 6) });
  });
  const layers = ['Application', 'Harness', 'Agent loop', 'Context & memory', 'Tools & policy', 'Model gateway', 'Model'];
  const cols = [C.blue, C.blue, C.blue, C.teal, C.purple, C.gold, C.gold];
  layers.forEach((name, i) => {
    box(440, 125 + i * 62, 400, 50, { p: sm(t, 8 + i * 0.35, 9 + i * 0.35), color: cols[i], label: name, size: 19 });
  });
  const dd = seg(t, 10.6, 11.9);
  if (dd > 0 && dd < 1) dot(640, lerp(100, 560, smooth(dd)), 8, C.yellow);
}});

// 3 · The agent loop
scenes.push({ dur: 24, tag: '01 · the agent loop', cues: [
  [0.3, 4.8, 'At the centre is a loop. Send the conversation to the model and ask what to do next.'],
  [5, 10.8, 'If it asks for a tool, run the tool and append the result to the conversation.'],
  [11, 16.6, 'Then ask again with everything so far. The history only ever grows.'],
  [16.8, 24, 'When the model replies with end_turn instead of a tool call, the loop stops. That loop is the agent.'],
], draw(t) {
  const cx = 330, cy = 320, R = 135;
  const ring = sm(t, 0.3, 2);
  ctx.save(); ctx.strokeStyle = C.dim; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ring); ctx.stroke(); ctx.restore();
  if (ring > 0.99) [-45, 45, 135, 225].forEach(deg => {
    const a = deg * Math.PI / 180; arrowHead(cx + R * Math.cos(a), cy + R * Math.sin(a), a + Math.PI / 2, 12, C.dim);
  });
  const nodes = [['model', -90, C.blue], ['tool_use', 0, C.purple], ['run tool', 90, C.gold], ['tool_result', 180, C.gold]];
  nodes.forEach(([n, deg, col], i) => {
    const a = deg * Math.PI / 180, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    box(x - 66, y - 21, 132, 42, { p: sm(t, 1 + i * 0.3, 2 + i * 0.3), color: col, label: n, size: 16, font: MONO, r: 21, fillAlpha: 0.9, fillColor: '#151b22' });
  });
  // dot travelling round the loop: two cycles, then out to the answer
  let phase = -1, cyc = 0;
  if (t >= 4 && t < 10) { phase = (t - 4) / 6; cyc = 1; } else if (t >= 10 && t < 16) { phase = (t - 10) / 6; cyc = 2; }
  if (phase >= 0) {
    const a = -Math.PI / 2 + phase * Math.PI * 2;
    dot(cx + R * Math.cos(a), cy + R * Math.sin(a), 9, C.yellow);
    text(`turn ${cyc}`, cx, cy, { size: 22, color: C.yellow, font: MONO });
  }
  const ex = seg(t, 16, 17.2);
  if (ex > 0) {
    arrow(cx + 40, cy - R - 20, 500, 120, { p: ex, color: C.green });
    text('end_turn → answer', 470, 96, { size: 17, color: C.green, font: MONO, alpha: sm(t, 16.8, 17.4) });
  }
  // message list
  text('messages', 650, 92, { size: 18, color: C.grey, align: 'left', font: MONO, alpha: sm(t, 1, 1.6) });
  const msgs = [
    [1.5, 'user', "Where's my refund for order #4417?", C.grey],
    [5.5, 'assistant', 'tool_use  get_order(order_id="4417")', C.purple],
    [8.5, 'user', 'tool_result  {status: "refunded", amount: 349}', C.gold],
    [11.5, 'assistant', 'tool_use  knowledge.search("refund timing")', C.purple],
    [14.5, 'user', 'tool_result  "Banks post refunds in 3-5 days"', C.gold],
    [17, 'assistant', 'Refunded $349 on 12 Sep. Allow 3-5 days.', C.green],
  ];
  msgs.forEach(([t0, role, str, col], i) => {
    const p = sm(t, t0, t0 + 0.6); if (p <= 0) return;
    const y = 112 + i * 66 + (1 - p) * 20;
    withAlpha(p, () => {
      rrPath(650, y, 590, 54, 8); ctx.fillStyle = '#151b22'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      text(role, 664, y + 27, { size: 13, color: col, align: 'left', font: MONO });
      text(str, 760, y + 27, { size: 15, color: C.white, align: 'left', font: MONO, write: sm(t, t0 + 0.2, t0 + 1.2) });
    });
  });
  // the code, with the current line highlighted
  const code = ['while True:', '    reply = model(messages, tools)', '    if reply.stop_reason != "tool_use": break', '    messages += [reply, run_tools(reply)]'];
  let hl = -1;
  if (phase >= 0) hl = phase < 0.2 || phase > 0.95 ? 1 : phase < 0.45 ? 2 : 3;
  if (t >= 16) hl = 2;
  const ca = sm(t, 2, 3);
  code.forEach((l, i) => {
    const y = 520 + i * 25;
    if (i === hl) withAlpha(ca, () => { ctx.fillStyle = t >= 16 ? 'rgba(131,193,103,0.18)' : 'rgba(244,211,94,0.14)'; ctx.fillRect(52, y - 12, 470, 24); });
    text(l, 60, y, { size: 15, font: MONO, align: 'left', color: i === hl ? C.white : C.grey, alpha: ca });
  });
}});

// 4 · The context window
scenes.push({ dur: 20, tag: '02 · context', cues: [
  [0.3, 5, 'Everything the model sees on one call has to fit in its context window.'],
  [5.2, 10, 'Tool results pile up. Past a point, more context makes answers worse. This is called context rot.'],
  [10.2, 15, 'Compaction summarises the older turns into a short note, which frees up space.'],
  [15.2, 20, 'Offloading moves a big output to storage and leaves a pointer. Together these are context engineering.'],
], draw(t) {
  const X0 = 140, Y = 270, BW = 1000, BH = 64;
  const o = sm(t, 0.2, 1.4);
  box(X0 - 4, Y - 4, BW + 8, BH + 8, { p: o, color: C.grey, r: 6, fillAlpha: 0.03 });
  text('context window (tokens)', X0, Y - 30, { size: 17, color: C.grey, align: 'left', alpha: o });
  // build segments
  const segs = [{ w: 70, c: C.blue, l: 'system', t0: 1.5 }, { w: 80, c: C.teal, l: 'tools', t0: 2.2 }];
  const comp = sm(t, 10.5, 13), off = sm(t, 15.5, 17.5);
  segs.push({ w: 64 * comp, c: C.green, l: 'summary', t0: -1 });
  const tr = [90, 70, 130, 100, 80];
  let offX = 0;
  for (let k = 0; k < 5; k++) {
    const t0 = 3 + k * 1.3, shrink = k < 3 ? 1 - comp : 1;
    segs.push({ w: 30 * shrink, c: C.grey, l: 'user', t0 });
    segs.push({ w: 40 * shrink, c: C.purple, l: 'asst', t0: t0 + 0.3 });
    const isOff = k === 3;
    segs.push({ w: (isOff ? 100 - 84 * off : tr[k]) * shrink, c: C.gold, l: isOff && off > 0.6 ? 'ptr' : 'tool result', t0: t0 + 0.6, off: isOff });
  }
  let x = X0, fill = 0;
  for (const s of segs) {
    const g = s.t0 < 0 ? 1 : sm(t, s.t0, s.t0 + 0.45);
    const w = s.w * g; if (w < 0.5) continue;
    if (s.off) offX = x;
    ctx.save(); ctx.fillStyle = s.c; ctx.globalAlpha = 0.85; ctx.fillRect(x, Y, w - 2, BH); ctx.restore();
    if (w > 46) text(s.l, x + w / 2, Y + BH / 2, { size: 12, color: '#0e1116', weight: 'bold' });
    x += w; fill += w;
  }
  const f = fill / BW;
  text(`${Math.round(f * 100)}% full`, X0 + BW, Y + BH + 26, { size: 16, color: C.grey, align: 'right', font: MONO, alpha: o });
  // quality meter
  const q = clamp(1 - 1.6 * Math.max(0, f - 0.5));
  withAlpha(sm(t, 4, 4.8), () => {
    text('answer quality', 900, 140, { size: 16, color: C.grey, align: 'left' });
    ctx.fillStyle = C.grid; ctx.fillRect(900, 160, 240, 12);
    const col = q > 0.7 ? C.green : q > 0.45 ? C.yellow : C.red;

  Object.entries(NODES).forEach(([k, [x, y, w, h, l, c]], i) => box(x, y, w, h, { p: sm(t, 0.3 + i * 0.45, 1.3 + i * 0.45), color: c, label: l, size: 17 }));
  const E = (a, b, i, o = {}) => { const [x1, y1] = ctr(a), [x2, y2] = ctr(b); const na = NODES[a], nb = NODES[b];
    let sx = x1, sy = y1, ex = x2, ey = y2;
    if (Math.abs(y1 - y2) < 5) { sx = x1 < x2 ? na[0] + na[2] : na[0]; ex = x1 < x2 ? nb[0] - 2 : nb[0] + nb[2] + 2; }
    else { sy = y1 < y2 ? na[1] + na[3] : na[1]; ey = y1 < y2 ? nb[1] - 2 : nb[1] + nb[3] + 2; }
    arrow(sx, sy, ex, ey, { p: sm(t, 4 + i * 0.3, 4.8 + i * 0.3), color: C.dim, ...o }); };
  E('client', 'api', 0); E('api', 'guard', 1); E('guard', 'router', 2); E('router', 'agent', 3);
  E('agent', 'gateway', 4); E('gateway', 'models', 5); E('agent', 'exec', 6); E('exec', 'tools', 7);
  E('packs', 'router', 8); E('api', 'sessions', 9, { label: '' });
  // trace band
  const BX = 40, BY = 515, BW = 1200;
  withAlpha(sm(t, 7, 8), () => {
    ctx.strokeStyle = C.dim; ctx.lineWidth = 1.5; ctx.strokeRect(BX, BY, BW, 108);
    text('trace', BX + 10, BY - 14, { size: 14, color: C.grey, align: 'left', font: MONO });
  });
  const T0 = 9, HOP = 0.7;
  const totalHops = ROUTE.length - 1;
  for (let i = 0; i < totalHops; i++) {
    const a = T0 + i * HOP, b = a + HOP;
    if (t >= a && t < b) { const [x, y] = polyPoint([ctr(ROUTE[i]), ctr(ROUTE[i + 1])], smooth(seg(t, a, b))); dot(x, y, 9, C.yellow); }
    const lane = LANES[ROUTE[i + 1]];
    const w = (HOP / (totalHops * HOP)) * (BW - 40);
    const x0 = BX + 20 + i * w;
    const p = seg(t, a, b);
    if (p > 0) { const col = NODES[ROUTE[i + 1]][5]; ctx.save(); ctx.fillStyle = col; ctx.globalAlpha = 0.8; ctx.fillRect(x0, BY + 12 + lane * 15, (w - 3) * p, 11); ctx.restore(); }
  }
  if (t >= T0 + totalHops * HOP) dot(...ctr('client'), 9, C.green);
  text("Refunded $349 on 12 Sep.", 105, 220, { size: 15, color: C.green, alpha: sm(t, T0 + totalHops * HOP, T0 + totalHops * HOP + 0.5) });
}});

// 10 · Closing
scenes.push({ dur: 11, tag: '', cues: [], draw(t) {
  text('Packs change. The engine stays.', 640, 220, { size: 36, font: SERIF, write: sm(t, 0.4, 2.2) });
  text('Policy lives in code, at the tool boundary.', 640, 300, { size: 30, font: SERIF, color: C.blue, write: sm(t, 2.4, 4.2) });
  text('Every hop is measured.', 640, 375, { size: 30, font: SERIF, color: C.gold, write: sm(t, 4.4, 5.6) });
  text('Promptlife · The Life of a Prompt', 640, 520, { size: 18, color: C.grey, font: MONO, alpha: sm(t, 6.5, 7.5) });
}});

// ---------- timeline ----------
const starts = []; let acc = 0;
for (const s of scenes) { starts.push(acc); acc += s.dur; }
const TOTAL = acc;
window.TOTAL = TOTAL;

window.renderFrame = function (T) {
  ctx.setTransform(OUT_W / W, 0, 0, OUT_H / H, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  let i = 0; while (i < scenes.length - 1 && T >= starts[i + 1]) i++;
  const s = scenes[i], t = T - starts[i];
  const a = Math.min(sm(t, 0, 0.45), 1 - sm(t, s.dur - 0.45, s.dur));
  ctx.save(); ctx.globalAlpha = a;
  s.draw(t);
  chapterTag(s.tag, t);
  caption(s.cues, t);
  ctx.restore();
};

// live preview when opened directly in a browser
if (!window.__RENDER__) {
  const t0 = performance.now();
  const loop = () => { const T = ((performance.now() - t0) / 1000) % TOTAL; window.renderFrame(T); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
